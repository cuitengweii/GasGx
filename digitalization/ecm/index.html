<!DOCTYPE html>
<html lang="zh">
<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/shared/ui/site-shell.shared.css">
    <style>

        .text-gas-green { color: rgb(93 214 44 / 1); }

        .bg-gas-green { background-color: rgb(93 214 44 / 1); }
        .bg-gas-green\/10 { background-color: rgb(93 214 44 / 0.1); }
        .border-gas-green { border-color: rgb(93 214 44 / 1); }
        .border-gas-green\/20 { border-color: rgb(93 214 44 / 0.2); }
        .border-gas-green\/30 { border-color: rgb(93 214 44 / 0.3); }
        .border-gas-green\/35 { border-color: rgb(93 214 44 / 0.35); }
        .border-gas-green\/40 { border-color: rgb(93 214 44 / 0.4); }
        .border-gas-green\/45 { border-color: rgb(93 214 44 / 0.45); }
        .border-gas-green\/60 { border-color: rgb(93 214 44 / 0.6); }
        .hover\:text-gas-green:hover { color: rgb(93 214 44 / 1); }
        .hover\:bg-gas-green:hover { background-color: rgb(93 214 44 / 1); }
        .hover\:border-gas-green:hover { border-color: rgb(93 214 44 / 1); }
    </style>
    <script>
        window.tailwind = window.tailwind || {};
        window.tailwind.config = {
            corePlugins: {
                preflight: false
            },
            theme: {
                extend: {
                    colors: {
                        gas: {
                            green: '#5DD62C',
                            subtext: '#94a3b8'
                        }
                    },
                    boxShadow: {
                        glow: '0 0 10px rgba(93, 214, 44, 0.3)',
                        'glow-strong': '0 0 20px rgba(93, 214, 44, 0.6)'
                    }
                }
            }
        };
    </script>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React 和 ReactDOM (生产版本) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- 引入 Babel 以在浏览器中编译 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0F0F0F]">
    <div id="ggx-site-header-slot"></div>
    <main class="pt-20 px-2">
        <div id="root"></div>
    </main>
    <div id="ggx-site-footer-slot"></div>
    <div
        id="ggx-shell-tailwind-safelist"
        class="hidden
            text-gas-green text-gas-subtext text-gas-green/80
            bg-gas-green bg-gas-green/10
            border-gas-green border-gas-green/20 border-gas-green/30 border-gas-green/35 border-gas-green/40 border-gas-green/45 border-gas-green/60
            shadow-glow hover:shadow-glow-strong
            hover:text-gas-green hover:bg-gas-green hover:border-gas-green
            border-l-2"
        aria-hidden="true"
    ></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 内联微型图标组件 (替代 lucide-react，确保单文件独立运行) ---
        const IconBase = ({ d, size=16, className="", style={}, children }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} style={style}>
                {d && <path d={d} />}
                {children}
            </svg>
        );
        const Settings2 = (p) => <IconBase {...p}><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="7" r="3"/><circle cx="9" cy="17" r="3"/></IconBase>;
        const Play = (p) => <IconBase {...p}><polygon points="5 3 19 12 5 21 5 3"/></IconBase>;
        const PowerOff = (p) => <IconBase {...p}><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></IconBase>;
        const AlertTriangle = (p) => <IconBase {...p}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></IconBase>;
        const Activity = (p) => <IconBase {...p}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></IconBase>;


        // --- 全局昼夜主题与滚动条注入 ---
        const GlobalStyles = () => (
            <style>{`
            .ecm-page {
                --bg-main: #0F0F0F; --bg-card: #202020; --bg-tab: #1A1A1A;
                --text-primary: #E0E0E0; --text-secondary: #888888;
                --border-line: #333333;
                --accent: #5DD62C; --accent-rgb: 93, 214, 44;
                --status-warning: #FF9900; --status-danger: #FF3366;
                --shadow-inset: inset 0 2px 6px rgba(0,0,0,0.6);
                --glass-bg: rgba(32, 32, 32, 0.7);
            }
            .ecm-page {
                background-color: var(--bg-main);
                color: var(--text-primary);
                font-family: 'Inter', 'PingFang SC', sans-serif;
                -webkit-font-smoothing: antialiased;
                transition: background-color 0.3s ease, color 0.3s ease;
                overflow-y: auto;
            }
            .ecm-page .data-numbers { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
            .ecm-page .gx-bg-main { background-color: var(--bg-main); }
            .ecm-page .gx-bg-card { background-color: var(--bg-card); }
            .ecm-page .gx-bg-tab { background-color: var(--bg-tab); }
            .ecm-page .gx-border { border-color: var(--border-line); }
            .ecm-page .gx-text-primary { color: var(--text-primary); }
            .ecm-page .gx-text-secondary { color: var(--text-secondary); }
            .ecm-page .gx-text-accent { color: var(--accent); }
            .ecm-page .gx-border-accent { border-color: var(--accent); }
            .ecm-page .gx-shadow-inner { box-shadow: var(--shadow-inset); }
            .ecm-page ::-webkit-scrollbar { width: 6px; height: 6px; }
            .ecm-page ::-webkit-scrollbar-track { background: var(--bg-main); }
            .ecm-page ::-webkit-scrollbar-thumb { background: var(--border-line); border-radius: 3px; }
            .ecm-page ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }
            .ecm-page option { background-color: var(--bg-card); color: var(--text-primary); }
            .ecm-page .ecm-diagnostic-panel {
                position: relative;
                overflow: hidden;
                border: 1px solid rgba(255, 76, 76, 0.72);
                background:
                    linear-gradient(180deg, rgba(255, 70, 70, 0.06), rgba(255, 70, 70, 0.015) 28%, transparent 70%),
                    linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0));
                box-shadow:
                    inset 0 0 0 1px rgba(255, 76, 76, 0.1),
                    0 0 0 1px rgba(255, 76, 76, 0.08),
                    0 14px 34px rgba(0, 0, 0, 0.26);
            }
            .ecm-page .ecm-diagnostic-panel::before {
                content: "";
                position: absolute;
                inset: 0;
                border-radius: inherit;
                border: 1px solid rgba(255, 92, 92, 0.86);
                box-shadow:
                    inset 0 0 18px rgba(255, 70, 70, 0.08),
                    0 0 18px rgba(255, 56, 96, 0.12);
                animation: ecm-diagnostic-pulse 1.9s ease-in-out infinite;
                pointer-events: none;
            }
            .ecm-page .ecm-diagnostic-panel::after {
                content: "";
                position: absolute;
                top: -34%;
                left: -18%;
                width: 36%;
                height: 180%;
                background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,128,128,0.16), rgba(255,255,255,0));
                transform: rotate(18deg);
                animation: ecm-diagnostic-sweep 3.6s linear infinite;
                pointer-events: none;
            }
            .ecm-page .ecm-diagnostic-panel > * {
                position: relative;
                z-index: 1;
            }
            .ecm-page .ecm-diagnostic-step {
                position: relative;
                border: 1px solid rgba(255,255,255,0.08);
                background: rgba(255,255,255,0.02);
                transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.2s ease;
            }
            .ecm-page .ecm-diagnostic-step.is-active {
                border-color: rgba(255, 99, 99, 0.72);
                background: linear-gradient(180deg, rgba(255, 76, 76, 0.16), rgba(255, 76, 76, 0.06));
                box-shadow: inset 0 0 0 1px rgba(255, 112, 112, 0.15), 0 0 18px rgba(255, 76, 76, 0.08);
                transform: translateY(-1px);
            }
            .ecm-page .ecm-diagnostic-step.is-done {
                border-color: rgba(255, 153, 0, 0.35);
                background: linear-gradient(180deg, rgba(255, 153, 0, 0.08), rgba(255, 153, 0, 0.02));
            }
            .ecm-page .ecm-diagnostic-metric {
                border: 1px solid rgba(255,255,255,0.07);
                background: linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.01));
            }
            @media (max-width: 767px) {
                .ecm-page .ecm-diagnostic-panel::before,
                .ecm-page .ecm-diagnostic-panel::after {
                    animation: none;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .ecm-page .ecm-diagnostic-panel::before,
                .ecm-page .ecm-diagnostic-panel::after {
                    animation: none;
                }
            }
            @keyframes ecm-diagnostic-pulse {
                0%, 100% {
                    box-shadow:
                        inset 0 0 18px rgba(255, 70, 70, 0.08),
                        0 0 18px rgba(255, 56, 96, 0.12);
                    opacity: 0.78;
                }
                50% {
                    box-shadow:
                        inset 0 0 22px rgba(255, 82, 82, 0.14),
                        0 0 26px rgba(255, 56, 96, 0.22);
                    opacity: 1;
                }
            }
            @keyframes ecm-diagnostic-sweep {
                0% { transform: translateX(-170%) rotate(18deg); opacity: 0; }
                12% { opacity: 0.55; }
                48% { opacity: 0.24; }
                100% { transform: translateX(360%) rotate(18deg); opacity: 0; }
            }
            `}</style>
        );

        // --- 全局国际化字典 (i18n) ---
        const dict = {
            en: {
                appTitle: 'GasGx ECM', port: 'PORT', baud: 'BAUD',
                start: 'IGNITION SEQ', stop: 'EMERGENCY STOP', mode: 'SIMULATION MODE',
                sysSts: 'SYS_STS', phase: 'PHASE',
                noError: 'System Normal', errPrefix: 'ERR:',
                tabs: { speed: 'Speed', ignition: 'Ignition', lambda: 'Lambda', waterTem: 'WaterTemp', oilPress: 'OilPress' },
                expert: 'Expert System | Simulating', cause: '[CAUSE]', sol: '[SOLUTION]', chartMap: 'Map Curve'
            },
            zh: {
                appTitle: 'GasGx ECM', port: '串口', baud: '波特率',
                start: '启动测试', stop: '急停关机', mode: '诊断推演模式',
                sysSts: '系统状态', phase: '阶段',
                noError: '系统无故障', errPrefix: '故障:',
                tabs: { speed: '调速控制', ignition: '点火系统', lambda: '空燃比', waterTem: '水温曲线', oilPress: '油压曲线' },
                expert: '专家系统介入 | 正在预演', cause: '【故障表象】', sol: '【排查方案】', chartMap: '标定曲线'
            },
            ru: {
                appTitle: 'ЦУ Газ-Двигатель', port: 'ПОРТ', baud: 'БОД',
                start: 'ЗАПУСК', stop: 'АВАР. СТОП', mode: 'РЕЖИМ СИМУЛЯЦИИ',
                sysSts: 'СТАТУС', phase: 'ФАЗА',
                noError: 'Система в норме', errPrefix: 'ОШИБКА:',
                tabs: { speed: 'Скорость', ignition: 'Зажигание', lambda: 'Лямбда', waterTem: 'Темп.Воды', oilPress: 'Давл.Масла' },
                expert: 'Экспертная система | Сценарий', cause: '[ПРИЧИНА]', sol: '[РЕШЕНИЕ]', chartMap: 'Кривая (MAP)'
            }
        };

        const normalizeShellLang = (langCandidate) => {
            const value = String(langCandidate || '').toLowerCase();
            return value.startsWith('zh') ? 'zh' : 'en';
        };

        const resolveInitialLang = () => {
            try {
                const primary = window.localStorage.getItem('gasgx-lang');
                if (primary) return normalizeShellLang(primary);
                const fallback = window.localStorage.getItem('gas_lang');
                if (fallback) return normalizeShellLang(fallback);
            } catch (error) {
                // Ignore localStorage failures in restricted environments.
            }
            return normalizeShellLang(document.documentElement.lang || 'zh-CN');
        };

        const App = () => {
            const [lang, setLang] = useState(resolveInitialLang);
            const [activeTab, setActiveTab] = useState('lambda');
            const [baudRate, setBaudRate] = useState('9600');
            
            const [isSimulating, setIsSimulating] = useState(false);
            const [simMode, setSimMode] = useState('NORMAL');
            
            const tickRef = useRef(0);
            const phaseRef = useRef('STOP');
            const initialGaugeValuesRef = useRef({
                rpm: 0,
                water: 20,
                exhaust: 25,
                oil: 0
            });
            const initialGaugeHistoryRef = useRef({
                rpm: [0],
                water: [20],
                exhaust: [25],
                oil: [0]
            });
            const [smoothedGauges, setSmoothedGauges] = useState(initialGaugeValuesRef.current);
            const [gaugeHistory, setGaugeHistory] = useState(initialGaugeHistoryRef.current);
            const smoothedGaugesRef = useRef(initialGaugeValuesRef.current);
            const gaugeTargetsRef = useRef(initialGaugeValuesRef.current);
            const gaugeAnimationFrameRef = useRef(0);
            const lastHistorySampleRef = useRef(0);
            const [isMobileView, setIsMobileView] = useState(() => {
                if (typeof window === 'undefined' || typeof window.matchMedia !== 'function') return false;
                return window.matchMedia('(max-width: 767px)').matches;
            });

            const getStopStateText = () => lang === 'en' ? 'STOP' : (lang === 'zh' ? '停机' : 'СТОП');

            const INITIAL_ENGINE_STATE = {
                CurSpd: 0, SetSpd: 1500, IgtSpd: 0, SyncVolt: 0.0,
                SpdState: getStopStateText(), BaseI: 0, CurPos1: 185, SetPos1: 185,
                StopKey: 1, IdleKey: 0, MAP: 101.3, MAT: 25.0,
                CurPos2: 162, SetPos2: 162, lambda: 1.0, fltrSpd: 0,
                AState: 'OPEN', LoadI: 0, OilPressure: 0, WaterTemp: 20.0, ExhaustTemp: 25,
                FaultMsg: ''
            };

            const [engineState, setEngineState] = useState(INITIAL_ENGINE_STATE);
            const t = (key) => dict[lang][key] || key;
            const textPair = (zh, en) => (lang === 'zh' ? zh : en);
            const toMetricNumber = (value) => {
                const parsed = Number(value);
                return Number.isFinite(parsed) ? parsed : null;
            };
            const formatMetricValue = (value, digits = 0) => {
                if (value === 'ERR' || value === 'FLT') return String(value);
                const numeric = toMetricNumber(value);
                if (numeric === null) return String(value ?? '--');
                if (digits > 0) return numeric.toFixed(digits);
                return String(Math.round(numeric));
            };

            useEffect(() => {
                const app = (window.app && typeof window.app === 'object') ? window.app : {};
                app.currentLang = normalizeShellLang(lang);
                app.setLanguage = function (langCandidate) {
                    const nextLang = normalizeShellLang(langCandidate || this.currentLang);
                    this.currentLang = nextLang;
                    setLang((prev) => (prev === nextLang ? prev : nextLang));
                    return this.currentLang;
                };
                app.init = function () {
                    this.setLanguage(this.currentLang || resolveInitialLang());
                };
                window.app = app;

                const handleLangChanged = (event) => {
                    const nextLang = normalizeShellLang(event && event.detail ? event.detail.lang : undefined);
                    app.setLanguage(nextLang);
                };

                document.addEventListener('gasgx:lang-changed', handleLangChanged);
                return () => {
                    document.removeEventListener('gasgx:lang-changed', handleLangChanged);
                };
            }, []);

            useEffect(() => {
                const normalized = normalizeShellLang(lang);
                if (normalized !== lang) {
                    setLang(normalized);
                    return;
                }

                if (window.app && typeof window.app === 'object') {
                    window.app.currentLang = normalized;
                }
                document.documentElement.lang = normalized === 'zh' ? 'zh-CN' : 'en';
            }, [lang]);

            useEffect(() => {
                if (typeof window === 'undefined' || typeof window.matchMedia !== 'function') return undefined;
                const mediaQuery = window.matchMedia('(max-width: 767px)');
                const applyChange = (event) => setIsMobileView(event.matches);
                setIsMobileView(mediaQuery.matches);
                if (typeof mediaQuery.addEventListener === 'function') {
                    mediaQuery.addEventListener('change', applyChange);
                    return () => mediaQuery.removeEventListener('change', applyChange);
                }
                mediaQuery.addListener(applyChange);
                return () => mediaQuery.removeListener(applyChange);
            }, []);

            useEffect(() => {
                gaugeTargetsRef.current = {
                    rpm: Math.max(0, Math.min(2000, Number(engineState.CurSpd) || 0)),
                    water: Math.max(0, Math.min(120, Number(engineState.WaterTemp) || 0)),
                    exhaust: Math.max(0, Math.min(800, Number(engineState.ExhaustTemp) || 0)),
                    oil: Math.max(0, Math.min(600, Number(engineState.OilPressure) || 0))
                };

                if (isMobileView) {
                    if (gaugeAnimationFrameRef.current) {
                        window.cancelAnimationFrame(gaugeAnimationFrameRef.current);
                        gaugeAnimationFrameRef.current = 0;
                    }
                    smoothedGaugesRef.current = gaugeTargetsRef.current;
                    setSmoothedGauges(gaugeTargetsRef.current);
                    return undefined;
                }

                if (gaugeAnimationFrameRef.current) return;

                let lastTime = 0;
                const animate = (time) => {
                    if (!lastTime) lastTime = time;
                    const delta = Math.min(40, time - lastTime || 16);
                    lastTime = time;

                    let hasPending = false;
                    const current = smoothedGaugesRef.current;
                    const target = gaugeTargetsRef.current;
                    const next = { ...current };

                    Object.keys(target).forEach((key) => {
                        const diff = target[key] - current[key];
                        if (Math.abs(diff) < 0.2) {
                            next[key] = target[key];
                            return;
                        }

                        const smoothing = 1 - Math.exp(-delta / 180);
                        next[key] = current[key] + diff * smoothing;
                        hasPending = true;
                    });

                    smoothedGaugesRef.current = next;
                    setSmoothedGauges(next);

                    if (hasPending) {
                        gaugeAnimationFrameRef.current = window.requestAnimationFrame(animate);
                    } else {
                        gaugeAnimationFrameRef.current = 0;
                    }
                };

                gaugeAnimationFrameRef.current = window.requestAnimationFrame(animate);

                return () => {
                    if (gaugeAnimationFrameRef.current) {
                        window.cancelAnimationFrame(gaugeAnimationFrameRef.current);
                        gaugeAnimationFrameRef.current = 0;
                    }
                };
            }, [engineState.CurSpd, engineState.WaterTemp, engineState.ExhaustTemp, engineState.OilPressure, isMobileView]);

            useEffect(() => {
                const now = Date.now();
                const historySampleMs = isMobileView ? 320 : 180;
                const maxHistoryPoints = isMobileView ? 72 : 180;
                if (now - lastHistorySampleRef.current < historySampleMs) return;
                lastHistorySampleRef.current = now;

                setGaugeHistory((prev) => {
                    const next = {};
                    Object.keys(smoothedGauges).forEach((key) => {
                        const series = Array.isArray(prev[key]) ? prev[key] : [];
                        next[key] = [...series.slice(-(maxHistoryPoints - 1)), smoothedGauges[key]];
                    });
                    return next;
                });
            }, [smoothedGauges, isMobileView]);

            useEffect(() => {
                if (!isSimulating && phaseRef.current !== 'STOP') return;
                if (!isSimulating) return;

                lastHistorySampleRef.current = 0;
                const resetHistory = {
                    rpm: [smoothedGaugesRef.current.rpm],
                    water: [smoothedGaugesRef.current.water],
                    exhaust: [smoothedGaugesRef.current.exhaust],
                    oil: [smoothedGaugesRef.current.oil]
                };
                setGaugeHistory(resetHistory);
            }, [isSimulating, simMode]);

            // --- 21 种硬核推演模式智库 ---
            const getSimModes = (l) => {
                const isZH = l === 'zh';
                const isEN = l === 'en';
                return {
                    NORMAL: { label: isZH?'[00] 标准运行 (STD)':'[00] Normal (STD)', desc: '', sol: '' },
                    START_FAIL: { 
                        label: isZH?'[01] 启动失败 (ERR_START)':(isEN?'[01] Start Fail':'[01] Ошибка запуска'), 
                        desc: isZH?'马达拖动转速无法突破200RPM，无法进入怠速。':(isEN?'RPM stuck < 200 during crank, cannot idle.':'Обороты застряли < 200, нет холостого хода.'), 
                        sol: isZH?'检查启动马达供电电压；检查燃气主阀是否打开。':(isEN?'Check starter voltage; check main gas valve.':'Проверьте напряжение стартера; газовый клапан.') 
                    },
                    OVERSPEED: { 
                        label: isZH?'[02] 飞车失控 (ERR_SPD)':(isEN?'[02] Overspeed':'[02] Разнос двигателя'), 
                        desc: isZH?'节气门执行器卡死全开，转速失去控制瞬间飙升。':(isEN?'Throttle actuator jammed fully open, RPM spiking.':'Привод дросселя заклинил, скачок оборотов.'), 
                        sol: isZH?'危险！立即手动切断燃气总阀！':(isEN?'DANGER! Manually shut off gas valve NOW!':'ОПАСНО! Немедленно перекройте газ!') 
                    },
                    HIGH_TEMP_OIL: { 
                        label: isZH?'[03] 高温低压 (ERR_TEMP)':(isEN?'[03] High Temp/Low Press':'[03] Выс. темп / Низк. давл'), 
                        desc: isZH?'水温异常攀升引起机油变稀，机油压力随之下降。':(isEN?'Coolant temp rising, thinning oil and dropping pressure.':'Рост температуры ОЖ, падение давления масла.'), 
                        sol: isZH?'检查冷却液循环（水泵、节温器）及机油泵。':(isEN?'Check coolant circulation and oil pump.':'Проверьте насосы ОЖ и масла.') 
                    },
                    COOLANT_LEAK: { 
                        label: isZH?'[04] 冷却液暴漏 (ERR_LEAK)':(isEN?'[04] Coolant Leak':'[04] Утечка ОЖ'), 
                        desc: isZH?'水温极速攀升，系统极短时间内触发高温极限停机。':(isEN?'Extreme rapid temp rise causing instant trip.':'Резкий скачок температуры, аварийная остановка.'), 
                        sol: isZH?'立刻停机检查散热器、水管接头是否破裂。':(isEN?'Check radiator and hose joints for burst.':'Проверьте радиатор и шланги на прорыв.') 
                    },
                    OIL_PUMP_FAIL: {

            // --- 物理模拟器核心引擎 (增强版) ---
            useEffect(() => {
                let interval;
                if (isSimulating) {
                    if (phaseRef.current === 'STOP') {
                        phaseRef.current = 'CRANK'; tickRef.current = 0;
                        setEngineState(p => ({ ...p, FaultMsg: '', StopKey: 0 }));
                    }

                    interval = setInterval(() => {
                        tickRef.current += 1;
                        const ticks = tickRef.current;
                        const mode = simMode;

                        setEngineState(prev => {
                            let nextState = { ...prev };
                            let nextSpd = prev.CurSpd; let nextOil = prev.OilPressure; let nextWater = prev.WaterTemp;
                            
                            if (phaseRef.current === 'CRANK') {
                                nextState.SpdState = 'CRANK';
                                if (mode === 'START_FAIL') {
                                    nextSpd = 150 + Math.random() * 30;
                                    nextOil = Math.min(50, nextOil + 5);
                                } else {
                                    nextSpd += 80; nextOil = Math.min(100, nextOil + 20);
                                    if (nextSpd >= 400) phaseRef.current = 'IDLE';
                                }
                            } else if (phaseRef.current === 'IDLE') {
                                nextState.SpdState = 'IDLE'; nextSpd = 800 + (Math.random() * 10 - 5);
                                nextOil = Math.min(300, nextOil + 15); nextState.IdleKey = 1; nextWater += 0.5;
                                if (ticks > 15) phaseRef.current = 'RAMP';
                            } else if (phaseRef.current === 'RAMP') {
                                nextState.SpdState = 'RAMP'; nextSpd += 100;
                                nextOil = mode === 'HIGH_TEMP_OIL' ? Math.min(130, nextOil + 2) : Math.min(450, nextOil + 20);
                                nextWater += 0.8;
                                if (nextSpd >= 1500) phaseRef.current = 'RATED';
                            } else if (phaseRef.current === 'RATED') {
                                nextState.SpdState = 'RATED'; nextSpd = 1500 + (Math.random() * 4 - 2);
                                let load = 250 + Math.sin(ticks / 5) * 50;
                                
                                // --- 21大物理模式逻辑分发 ---
                                if (mode === 'CAN_BUS_OFF') {
                                    nextState.MAP = 'ERR'; nextState.lambda = 'ERR'; nextState.LoadI = 'ERR';
                                    nextState.SyncVolt = 'ERR'; nextState.AState = 'ERR'; nextState.CurPos2 = 'ERR';
                                } else {
                                    nextState.LoadI = Math.round(load); nextState.BaseI = 380;
                                    nextState.SyncVolt = (2.45 + Math.random() * 0.1).toFixed(2);
                                    nextState.AState = 'PID'; nextState.lambda = load > 200 ? '1.30' : '1.25';
                                    nextState.MAP = (140 + load * 0.1).toFixed(1);
                                    nextState.CurPos1 = Math.round(400 + Math.random() * 10); nextState.SetPos1 = 405;
                                    nextState.CurPos2 = Math.round(300 + load * 0.2); nextState.SetPos2 = nextState.CurPos2;
                                    nextState.ExhaustTemp = Math.round(450 + load * 0.3);

                                    if (mode === 'HIGH_TEMP_OIL') { nextOil = 130 + (Math.random() * 5); nextWater += 1.5; }
                                    else if (mode === 'COOLANT_LEAK') { nextOil = 400 + (Math.random()*10-5); nextWater += 3.5; }
                                    else if (mode === 'OIL_PUMP_FAIL') { nextOil = Math.max(0, nextOil - 100); nextWater += 1.0; }
                                    else if (mode === 'WATER_IN_OIL') { nextOil = 200 + Math.random()*50; nextWater += 0.8; }
                                    else {
                                        nextOil = 450 + (Math.random() * 10 - 5); nextWater = Math.min(82, nextWater + 0.1); 
                                        
                                        if (mode === 'OVERSPEED') {
                                            nextState.CurPos1 = 1000; nextState.SetPos1 = 1000; nextSpd += 120 + Math.random() * 50; 
                                        } else if (mode === 'SENSOR_FAIL_MAP') {
                                            nextState.MAP = 'ERR'; nextState.lambda = '0.00'; nextState.AState = 'FLT'; nextState.SyncVolt = '0.00'; nextSpd += (Math.random() * 100 - 50);
                                        } else if (mode === 'SYNC_LOSS') {
                                            nextState.SyncVolt = '0.00';
                                        } else if (mode === 'IGNITION_COIL_SHORT') {
                                            nextState.SyncVolt = (Math.random() * 5).toFixed(2); nextSpd -= 50; 
                                        } else if (mode === 'LOAD_SURGE') {
                                            if (ticks % 8 < 4) { nextState.LoadI = Math.round(load + 400); nextSpd -= 60; nextState.ExhaustTemp += 20; nextState.MAP = (190 + Math.random() * 10).toFixed(1); }
                                            else { nextState.LoadI = 0; nextSpd += 80; nextState.ExhaustTemp -= 10; nextState.MAP = '105.0'; }
                                        } else if (mode === 'OVERLOAD') {
                                            nextState.LoadI = 850 + Math.random() * 50; nextSpd -= 150; nextState.ExhaustTemp += 50;
                                        } else if (mode === 'MISFIRE') {
                                            if (ticks % 4 === 0) nextSpd -= 80; nextState.ExhaustTemp = Math.max(300, nextState.ExhaustTemp - 30); nextState.lambda = (parseFloat(nextState.lambda) + 0.15).toFixed(2);
                                        } else if (mode === 'RICH_MIXTURE') {
                                            nextState.lambda = '0.88'; nextState.ExhaustTemp += 25; nextState.CurPos2 = Math.min(450, nextState.CurPos2 + 80);
                                        } else if (mode === 'LEAN_BURN_LIMIT') {
                                            nextState.lambda = '1.68'; nextSpd += (Math.random() * 80 - 40); nextState.ExhaustTemp -= 10;
                                        } else if (mode === 'KNOCK_DETECTED') {
                                            nextState.MAP = '180.5'; nextSpd -= 40; 
                                        } else if (mode === 'LOW_GAS_PRESS') {
                                            nextState.CurPos2 = 450; nextSpd -= 80; nextState.lambda = '1.55'; 
                                        } else if (mode === 'EXHAUST_BLOCK') {
                                            nextState.ExhaustTemp += 100; nextState.MAP = '180.0'; nextSpd -= 60;
                                        } else if (mode === 'ACTUATOR_JAM') {
                                            nextState.CurPos2 = 180; if (load > 200) nextSpd -= 40;
                                        } else if (mode === 'THROTTLE_LAG') {
                                            nextState.CurPos1 = prev.CurPos1 + (nextState.SetPos1 - prev.CurPos1) * 0.05; if (Math.abs(nextState.SetPos1 - nextState.CurPos1) > 50) nextSpd -= 50;
                                        }
                                    }
                                }
                            } else if (phaseRef.current === 'FAULT') {
                                nextState.SpdState = 'STOP'; nextState.StopKey = 1; nextSpd = Math.max(0, prev.CurSpd - 200);
                                nextOil = Math.max(0, nextOil - 50); nextState.LoadI = 0; nextState.BaseI = 0;
                                nextState.SyncVolt = '0.00'; nextState.AState = 'OPEN'; nextState.MAP = '101.3';
                                nextState.CurPos1 = 185; nextState.CurPos2 = 162;
                                if (nextSpd === 0) setIsSimulating(false);
                            }

                            let faultMsg = '';
                            if (phaseRef.current === 'RATED' || (phaseRef.current === 'IDLE' && ticks > 25)) {
                                if (nextWater > 95) faultMsg = t('errPrefix') + ' T>95℃';
                                else if (nextOil < 150 && mode !== 'START_FAIL') faultMsg = t('errPrefix') + ' P<150kPa';
                                else if (nextSpd > 1750) faultMsg = t('errPrefix') + ' OVERSPEED';
                                else if (nextState.ExhaustTemp > 650) faultMsg = t('errPrefix') + ' EXH>650℃';
                                else if (mode === 'SYNC_LOSS' && ticks % 4 === 0) faultMsg = t('errPrefix') + ' NO SYNC';
                                else if (mode === 'CAN_BUS_OFF' && ticks % 5 === 0) faultMsg = t('errPrefix') + ' CAN FLT';
                                else if (mode === 'SENSOR_FAIL_MAP' && ticks % 12 === 0) faultMsg = t('errPrefix') + ' COM LOST';
                                else if ((mode === 'LOAD_SURGE' || mode === 'OVERLOAD') && nextState.LoadI > 650 && ticks % 8 === 0) faultMsg = t('errPrefix') + ' OVERLOAD';
                                else if (mode === 'IGNITION_COIL_SHORT' && ticks % 10 === 0) faultMsg = t('errPrefix') + ' COIL FLT';
                            }
                            if (faultMsg && phaseRef.current !== 'FAULT') {
                                phaseRef.current = 'FAULT'; nextState.FaultMsg = faultMsg;
                            }

                            return { ...nextState, CurSpd: Math.round(nextSpd), IgtSpd: Math.round(nextSpd), fltrSpd: Math.round(nextSpd), OilPressure: Math.round(nextOil), WaterTemp: Number(nextWater.toFixed(1)) };
                        });
                    }, 500);
                } else {
                    phaseRef.current = 'STOP';
                    interval = setInterval(() => {
                        setEngineState(prev => {
                            if (prev.CurSpd === 0) return prev;
                            const nextSpd = Math.max(0, prev.CurSpd - 150);
                            return { ...prev, CurSpd: nextSpd, IgtSpd: nextSpd, fltrSpd: nextSpd, SpdState: getStopStateText(), StopKey: 1, LoadI: 0, OilPressure: Math.max(0, prev.OilPressure - 100), MAP: 101.3, AState: 'OPEN' };
                        });
                    }, 500);
                }
                return () => clearInterval(interval);
            }, [isSimulating, simMode, lang]);

            const handleSimulationToggle = () => {
                if (!isSimulating) {
                    setEngineState({...INITIAL_ENGINE_STATE, SpdState: getStopStateText()});
                    tickRef.current = 0; phaseRef.current = 'STOP';
                }
                setIsSimulating(!isSimulating);
            };

            const isAlarm = (key, val) => {
                if (val === 'ERR' || val === 'FLT') return true;
                if (key === 'WaterTemp' && val >= 90) return true;
                if (key === 'OilPressure' && val <= 200 && engineState.CurSpd > 600 && phaseRef.current !== 'FAULT') return true;
                if (key === 'CurSpd' && val >= 1750) return true;
                if (key === 'SyncVolt' && val === '0.00' && engineState.CurSpd > 600) return true;
                if (key === 'ExhaustTemp' && val > 650) return true;
                if (key === 'lambda' && val !== 'ERR' && (parseFloat(val) > 1.6 || parseFloat(val) < 0.95) && engineState.CurSpd > 1400) return true;
                return false;
            };

            // --- 全面翻译的参数标定表 ---
            const tabConfigs = {
                speed: {
                    params: [
                        [ { l: { en:'Speed P', zh:'比例参数P', ru:'Пропорц. P' }, v: '1500' }, { l: { en:'Speed I', zh:'积分参数I', ru:'Интеграл. I' }, v: '300' }, { l: { en:'Speed D', zh:'微分参数D', ru:'Производн. D' }, v: '200' }, { l: { en:'Rated RPM', zh:'额定转速', ru:'Номин. RPM' }, v: '1500' } ],
                        [ { l: { en:'Idle RPM', zh:'怠速转速', ru:'RPM Холост.' }, v: '800' }, { l: { en:'Overspeed', zh:'超速保护', ru:'Превыш. Скор' }, v: '1750' }, { l: { en:'Start Fuel', zh:'启动油量', ru:'Старт. Топл.' }, v: '25' }, { l: { en:'Droop %', zh:'调速率', ru:'Статизм %' }, v: '0' } ],
                        [ { l: { en:'Pos Src', zh:'位置反馈源', ru:'Ист. Поз.' }, v: 'ADC1', type: 'select' }, { l: { en:'Max Pos', zh:'最大开度', ru:'Макс. Откр' }, v: '100' }, { l: { en:'Min Pos', zh:'最小开度', ru:'Мин. Откр' }, v: '5' } ],
                        [ { l: { en:'Teeth', zh:'齿数', ru:'Зубья' }, v: '118' }, { l: { en:'Sync Mode', zh:'同步模式', ru:'Режим Синх.' }, v: 'Auto', type: 'select' } ]
                    ],
                    tableHeaders: ['RPM Set', 'P', 'I', 'D', 'Limit'],
                    tableData: [['800', '1200', '200', '100', '60'], ['1000', '1300', '250', '150', '70'], ['1200', '1400', '280', '180', '80'], ['1500', '1500', '300', '200', '100']]
                },
                ignition: {
                    params: [
                        [ { l: { en:'Global Adv', zh:'全局提前角', ru:'Общий УОЗ' }, v: '15' }, { l: { en:'Energy %', zh:'点火能量', ru:'Энергия %' }, v: '85' }, { l: { en:'Min Cyl', zh:'最少缸数', ru:'Мин. Цил.' }, v: '6' } ],
                        [ { l: { en:'Start Adv', zh:'启动提前角', ru:'УОЗ Старт' }, v: '5' }, { l: { en:'Idle Adv', zh:'怠速提前角', ru:'УОЗ Холост.' }, v: '10' }, { l: { en:'Max Adv', zh:'最大提前角', ru:'Макс. УОЗ' }, v: '35' } ],
                        [ { l: { en:'Knock Thr', zh:'爆震阈值', ru:'Порог Детон.' }, v: '2.5' }, { l: { en:'Retard Step', zh:'退角步长', ru:'Шаг Задерж.' }, v: '1.0' }, { l: { en:'Recov Dly', zh:'恢复延迟', ru:'Задерж. Восст' }, v: '50' } ],
