                    case 'OVERLOAD':
                        summary = textPair(`当前负载 ${load} A 已显著超过额定余量，转速正被强行拖低到 ${rpm} RPM。`, `The present load ${load} A is well beyond rated margin, dragging speed down to ${rpm} RPM.`);
                        observation = textPair('过载的第一个稳定特征不是停机，而是发电电流先顶住、转速先被拖垮。', 'The first stable sign of overload is not shutdown, but current pegging while speed gets dragged down.');
                        amplification = textPair('继续带载后，排温和缸压都会跟着上升，保护逻辑会优先按过流/过温接管。', 'As load continues, exhaust temperature and cylinder pressure both rise, so protection tends to trip on current or thermal limit first.');
                        result = phase === 'FAULT'
                            ? tripText
                            : textPair('当前结果：严重过载趋势明确，系统会以限载失败或停机保护结束这轮推演。', 'Current outcome: the overload trend is clear, and the run will end in load-limit failure or protective shutdown.');
                        metrics = metricKeysToItems(['LoadI', 'CurSpd', 'ExhaustTemp']);
                        break;
                    case 'MISFIRE':
                        summary = textPair(`当前空燃比 ${lambda}、转速 ${rpm} RPM、排温 ${exhaust}°C，典型缺火指征已经成形。`, `With lambda ${lambda}, speed ${rpm} RPM and exhaust ${exhaust}°C, the classic misfire signature is already visible.`);
                        observation = textPair('缺火先表现为周期性掉速，而氧传感器会把未燃氧误判成“更稀”的混合气。', 'Misfire first appears as cyclic speed dips, while the O2 sensor misreads unburned oxygen as a leaner mixture.');
                        amplification = textPair('进入升速后，掉火会让排温反常下降，但整机振动和输出波动会明显上升。', 'During ramp, misfire can make exhaust temperature fall abnormally while vibration and power fluctuation rise.');
                        result = phase === 'FAULT'
                            ? tripText
                            : textPair('当前结果：缺火链路已经成立，优先应回到点火波形、火花塞和线圈逐缸排查。', 'Current outcome: the misfire chain is established, so diagnosis should return to ignition waveform, plugs and coils cylinder by cylinder.');
                        metrics = metricKeysToItems(['lambda', 'CurSpd', 'ExhaustTemp']);
                        break;
                    case 'IGNITION_COIL_SHORT':
                        summary = textPair(`同步/驱动噪声已抬头，当前同步电压 ${sync} V，线圈级联短路特征正在放大。`, `Drive noise is rising and sync voltage is ${sync} V, so the coil short-circuit signature is being amplified.`);
                        observation = textPair('这类故障通常先从电气噪声开始，表现为同步电压杂波和点火驱动异常发热。', 'This fault usually begins as electrical noise, visible first in sync-voltage ripple and ignition-driver stress.');
                        amplification = textPair('带载后，高压侧噪声会进一步污染同步参考，整机表现会比普通缺火更“电气化”。', 'Under load, high-voltage noise contaminates sync reference even more, making the behavior feel more electrical than a normal misfire.');
                        result = phase === 'FAULT'
                            ? tripText
                            : textPair('当前结果：线圈/驱动短路趋势明显，继续推演会落到同步异常或点火故障停机。', 'Current outcome: coil or driver short-circuit is strongly indicated, and continued simulation will end in sync or ignition-fault shutdown.');
                        metrics = metricKeysToItems(['SyncVolt', 'CurSpd', 'MAP']);
                        break;
                    case 'RICH_MIXTURE':
                        summary = textPair(`当前 Lambda ${lambda}，混合气已经明显过浓，排温 ${exhaust}°C 也在跟着抬高。`, `Current lambda is ${lambda}, showing a rich mixture, and exhaust temperature ${exhaust}°C is rising with it.`);
                        observation = textPair('过浓先把 Lambda 拉低，同时多余燃气会让排气歧管后燃风险迅速增加。', 'A rich mixture first drags lambda low, while excess gas sharply increases the chance of afterburn in the exhaust.');
                        amplification = textPair('进入额定区后，后燃会把排温继续推高，热负荷会比表面看到的功率波动更危险。', 'At rated condition, afterburn keeps pushing exhaust temperature upward, making heat load more dangerous than the apparent power fluctuation.');
                        result = phase === 'FAULT'
                            ? tripText
                            : textPair('当前结果：浓混合气趋势已经稳定，继续运行会优先走向排温超限保护。', 'Current outcome: the rich-mixture trend is stable, and continued running will most likely trip on exhaust over-temperature.');
                        metrics = metricKeysToItems(['lambda', 'ExhaustTemp', 'CurPos2']);
                        break;
                    case 'LEAN_BURN_LIMIT':
                        summary = textPair(`当前 Lambda ${lambda} 已越过稳定稀燃极限，转速 ${rpm} RPM 呈现明显波动。`, `Lambda ${lambda} has crossed the stable lean-burn limit, and speed ${rpm} RPM is already fluctuating visibly.`);
                        observation = textPair('稀燃极限先表现为燃烧边界不稳定，机组会先出现轻微喘振和掉转。', 'The lean limit first shows up as unstable combustion, causing light surge and speed drop.');
                        amplification = textPair('继续升速后，燃烧裕量更薄，任何进气或供气小扰动都会被放大成明显失稳。', 'As speed rises, combustion margin gets thinner, so any small intake or fuel disturbance grows into obvious instability.');
                        result = phase === 'FAULT'
                            ? tripText
                            : textPair('当前结果：稀燃越界已经成立，优先检查进气漏气点和燃气滤清链路。', 'Current outcome: lean-burn limit exceedance is established, so intake leaks and gas filtration should be checked first.');
                        metrics = metricKeysToItems(['lambda', 'CurSpd', 'ExhaustTemp']);
                        break;
                    case 'KNOCK_DETECTED':
                        summary = textPair(`当前 MAP ${map} kPa 下仍伴随爆震趋势，ECU 退角后转速只剩 ${rpm} RPM，动力被明显压制。`, `At MAP ${map} kPa the knock trend persists, and after timing retard the engine is down to ${rpm} RPM with noticeably reduced power.`);
                        observation = textPair('爆震通常先在高负荷、高缸压工况冒头，控制器会先通过退角来救场。', 'Knock usually emerges under high load and high cylinder pressure, and the controller first tries to save the engine by retarding timing.');
                        amplification = textPair('如果退角之后转速和输出仍继续掉，说明根因不是点火策略本身，而是燃气品质或进气冷却能力。', 'If speed and power still fall after timing retard, the root cause is likely not the timing map itself but gas quality or intake cooling capacity.');
                        result = phase === 'FAULT'
                            ? tripText
                            : textPair('当前结果：爆震抑制正在用功率损失换安全边界，这轮结论会指向燃气甲烷值或中冷问题。', 'Current outcome: knock suppression is trading power for safety margin, pointing this scenario toward methane number or intercooler issues.');
                        metrics = metricKeysToItems(['MAP', 'CurSpd', 'ExhaustTemp']);
                        break;
                    case 'LOW_GAS_PRESS':
                        summary = textPair(`燃气阀已拉到 ${gasPos}，但转速仍跌到 ${rpm} RPM，Lambda=${lambda}，供气不足特征非常典型。`, `Gas valve position is already ${gasPos}, but speed still falls to ${rpm} RPM with lambda=${lambda}, which is a classic low-gas-pressure signature.`);
                        observation = textPair('这类故障先表现为执行器“已经很努力”，但转速和混合气仍然持续变稀。', 'This fault first appears as the actuator doing everything it can while speed and mixture still keep leaning out.');
                        amplification = textPair('进入带载区后，供气侧的压降会比怠速阶段更明显，掉速会持续放大。', 'Once the unit moves into load, supply-side pressure drop becomes much more obvious than at idle, so speed decay grows.');
                        result = phase === 'FAULT'
                            ? tripText
                            : textPair('当前结果：供气不足链路已成立，应优先回查外部管网压力和阻火/过滤部件。', 'Current outcome: the low-gas-pressure chain is established, so external gas pressure and arrestor/filter hardware should be checked first.');
                        metrics = metricKeysToItems(['CurPos2', 'lambda', 'CurSpd']);
                        break;
                    case 'EXHAUST_BLOCK':
                        summary = textPair(`排气温度 ${exhaust}°C 与 MAP ${map} kPa 同时异常，排气背压抬高的链路已经成形。`, `Exhaust temperature ${exhaust}°C and MAP ${map} kPa are abnormal together, forming a clear exhaust-backpressure signature.`);
                        observation = textPair('背压增大时，最早能看到的是排温抬升和发动机“发闷”，但进气负荷并不会同步改善。', 'When backpressure rises, the earliest signs are higher exhaust temperature and a struggling engine, without a matching improvement in intake load.');
                        amplification = textPair('带载后，排气阻塞会直接吞掉有效充量，动力下降会比普通过载更像“憋住了”。', 'Under load, exhaust blockage directly steals effective charge, making the power drop feel more like suffocation than simple overload.');
                        result = phase === 'FAULT'
                            ? tripText
                            : textPair('当前结果：排气受阻趋势非常明确，最终会落到排温超限或带载无力的结果。', 'Current outcome: the exhaust-block trend is clear and will ultimately end in exhaust over-temperature or severe power loss under load.');
                        metrics = metricKeysToItems(['ExhaustTemp', 'MAP', 'CurSpd']);
                        break;
                    case 'ACTUATOR_JAM':
                        summary = textPair(`燃气阀反馈 ${gasPos} 与目标 ${gasSet} 已经明显脱节，执行器卡滞正在主导整个推演。`, `Gas-valve feedback ${gasPos} is now clearly detached from the target ${gasSet}, so actuator jamming is dominating the scenario.`);
                        observation = textPair('这类故障最先看的不是转速，而是目标变化了，反馈却像被卡住一样不跟。', 'The first thing to watch here is not speed but the fact that the target moves while feedback stays stuck.');
                        amplification = textPair('一旦进入带载，实际开度跟不上目标开度，转速和空燃比都会同步偏离。', 'Once load is applied, actual opening cannot follow the target, so speed and mixture both drift away together.');
                        result = phase === 'FAULT'
                            ? tripText
                            : textPair('当前结果：执行器卡滞趋势已经成立，这轮诊断会指向机构阻滞或驱动线圈异常。', 'Current outcome: actuator jamming is established, pointing this diagnosis toward mechanical sticking or drive-coil issues.');
                        metrics = metricKeysToItems(['CurPos2', 'SetPos2', 'CurSpd']);
                        break;
                    case 'THROTTLE_LAG':
                        summary = textPair(`节气门反馈 ${throttle} 仍落后于目标 ${throttleSet}，响应迟滞已经明显。`, `Throttle feedback ${throttle} is still lagging the target ${throttleSet}, showing obvious response delay.`);
                        observation = textPair('迟滞类问题最典型的感觉是“命令先到了，机械动作过一会儿才慢慢跟上”。', 'The signature of lag is that the command arrives first, while the mechanical motion trails behind slowly.');
                        amplification = textPair('带载扰动一来，控制器已经开始修正下一步，但节气门还停留在上一拍，所以转速很容易被拖垮。', 'When load disturbances arrive, the controller is already issuing the next correction while the throttle is still on the last one, so speed gets dragged down easily.');
                        result = phase === 'FAULT'
                            ? tripText
                            : textPair('当前结果：节气门迟滞链路已成立，后续应重点查积碳、摩擦阻尼和驱动供电衰减。', 'Current outcome: the throttle-lag chain is established, so carbon buildup, mechanical drag and weak drive voltage should be checked next.');
                        metrics = metricKeysToItems(['CurPos1', 'SetPos1', 'CurSpd']);
                        break;
                    case 'WATER_IN_OIL':
                        summary = textPair(`机油压力 ${oil} kPa 偏低且不稳，水温 ${water}°C 还在继续走高，乳化进水的复合特征已经出现。`, `Oil pressure at ${oil} kPa is low and unstable while water temperature ${water}°C keeps rising, matching a water-in-oil/emulsion pattern.`);
                        observation = textPair('这类故障不是单一低油压，而是润滑与冷却两个系统同时慢慢偏离。', 'This fault is not just low oil pressure; lubrication and cooling both drift away together.');
                        amplification = textPair('进入持续运行后，油膜稳定性会越来越差，低油压与升温会相互推高风险。', 'Under continued running, oil-film stability keeps worsening, and low pressure plus rising temperature reinforce each other.');
                        result = phase === 'FAULT'
                            ? tripText
                            : textPair('当前结果：油水串通趋势已经形成，后续应优先核查乳化和缸垫/换热部件密封。', 'Current outcome: the oil-water crossover trend is formed, so emulsion and gasket or heat-exchanger sealing should be checked first.');
                        metrics = metricKeysToItems(['OilPressure', 'WaterTemp', 'CurSpd']);
                        break;
                    default:
                        summary = textPair(`当前阶段 ${phaseInfo.label} 已经把 ${modeInfo.label} 的主要异常链路拉出来了。`, `The current phase ${phaseInfo.label} has already pulled the main abnormal chain of ${modeInfo.label} into view.`);
                        observation = textPair('先看第一批偏离基线的关键量，它们通常比最终告警更早说明问题。', 'Watch the first variables that drift away from baseline. They usually explain the problem before the final alarm does.');
                        amplification = textPair('随着升速和带载推进，最早的征兆会演化成更稳定的故障结果。', 'As ramp and load continue, the earliest symptoms evolve into a more stable fault outcome.');
                        result = phase === 'FAULT' ? tripText : textPair('当前结果已经接近最终判定，可以结合原因和排查方案同步回看。', 'The current result is close to final assessment and can already be read together with the cause and solution.');
                        break;
                }

                const steps = [
                    {
                        title: textPair('基线装载', 'Baseline Armed'),
                        detail: phase === 'STOP'
                            ? textPair('诊断模式已切入，等待启动后开始采集异常演化。', 'Scenario is armed and waiting for startup to begin abnormal tracing.')
                            : phaseInfo.summary
                    },
                    {
                        title: textPair('异常征兆', 'Early Symptom'),
                        detail: observation
                    },
                    {
                        title: textPair('过程放大', 'Escalation'),
                        detail: amplification
                    },
                    {
                        title: textPair('结果判定', 'Outcome'),
                        detail: result
                    }
                ].map((step, index) => ({
                    ...step,
                    state: index < activeStepIndex ? 'done' : (index === activeStepIndex ? 'active' : 'pending')
                }));

                return {
                    title: modeInfo.label,
                    phaseLabel: phaseInfo.label,
                    phaseBadge: phaseInfo.badge,
                    summary,
                    result,
                    tripText,
                    metrics,
                    steps
                };
            };

            const diagnosticNarrative = buildDiagnosticNarrative();

            const CurveChart = ({ def }) => {
                if (!def) return null;
                const { points, xMax, yMax, color, xLabel, yLabel } = def;
                const w = 300, h = 120, padding = 25;
                const mapX = (x) => padding + ((x - (def.xLabel==='Ω'?90:0)) / (xMax - (def.xLabel==='Ω'?90:0))) * (w - padding * 2);
                const mapY = (y) => h - padding - (y / yMax) * (h - padding * 2);
                const pathD = `M ${points.map(p => `${mapX(p[0])},${mapY(p[1])}`).join(' L ')}`;
                return (
                    <div className="h-[160px] gx-bg-main gx-border border-b flex flex-col p-2 relative">
                        <span className="text-[11px] gx-text-secondary font-bold absolute top-2 left-3 flex items-center gap-1">
                            <Activity size={12} style={{color}} /> {yLabel} / {xLabel} {t('chartMap')}
                        </span>
                        <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-full mt-3">
                            {[0.25, 0.5, 0.75, 1].map(r => (
                                <line key={`h${r}`} x1={padding} y1={h - padding - (h - padding*2)*r} x2={w-padding} y2={h - padding - (h - padding*2)*r} stroke="var(--border-line)" strokeWidth="1" strokeDasharray="4,4"/>
                            ))}
                            <line x1={padding} y1={padding} x2={padding} y2={h-padding} stroke="var(--text-secondary)" strokeWidth="1"/>
                            <line x1={padding} y1={h-padding} x2={w-padding} y2={h-padding} stroke="var(--text-secondary)" strokeWidth="1"/>
                            <path d={pathD} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
                            {points.map((p, i) => <circle key={i} cx={mapX(p[0])} cy={mapY(p[1])} r="3" fill="var(--bg-card)" stroke={color} strokeWidth="2"/>)}
                        </svg>
                    </div>
                );
            };

            const GaugeCard = ({ gauge }) => {
                const cx = 118;
                const cy = 98;
                const radius = 56;
                const startAngle = -210;
                const endAngle = 30;
                const ratio = (gauge.value - gauge.min) / (gauge.max - gauge.min || 1);
                const clampedRatio = Math.max(0, Math.min(1, ratio));
                const currentAngle = startAngle + (endAngle - startAngle) * clampedRatio;
                const toPoint = (angle, r = radius) => {
                    const rad = angle * Math.PI / 180;
                    return {
                        x: cx + Math.cos(rad) * r,
                        y: cy + Math.sin(rad) * r
                    };
                };
                const start = toPoint(startAngle);
                const end = toPoint(endAngle);
                const progress = toPoint(currentAngle);
                const trackLargeArc = endAngle - startAngle > 180 ? 1 : 0;
                const progressLargeArc = currentAngle - startAngle > 180 ? 1 : 0;
                const trackPath = `M ${start.x} ${start.y} A ${radius} ${radius} 0 ${trackLargeArc} 1 ${end.x} ${end.y}`;
                const progressPath = `M ${start.x} ${start.y} A ${radius} ${radius} 0 ${progressLargeArc} 1 ${progress.x} ${progress.y}`;
                const needleBaseLeft = toPoint(currentAngle - 90, 5);
                const needleBaseRight = toPoint(currentAngle + 90, 5);
                const needleTip = toPoint(currentAngle, radius - 10);
                const history = Array.isArray(gauge.history) && gauge.history.length ? gauge.history : [gauge.value];
                const sparkWidth = 220;
                const sparkHeight = 128;
                const sparkMax = gauge.max - gauge.min || 1;
                const sparkPoints = history.map((point, index) => {
                    const x = history.length === 1 ? sparkWidth : (index / (history.length - 1)) * sparkWidth;
                    const normalized = Math.max(0, Math.min(1, (point - gauge.min) / sparkMax));
                    const y = sparkHeight - normalized * (sparkHeight - 6) - 3;
                    return { x, y };
                });
                const sparkPath = sparkPoints.map((point, index) => `${index === 0 ? 'M' : 'L'} ${point.x.toFixed(2)} ${point.y.toFixed(2)}`).join(' ');
                const sparkAreaPath = sparkPoints.length
                    ? `${sparkPath} L ${sparkPoints[sparkPoints.length - 1].x.toFixed(2)} ${sparkHeight} L ${sparkPoints[0].x.toFixed(2)} ${sparkHeight} Z`
                    : '';

                return (
                    <div className="relative overflow-hidden rounded-2xl gx-border border px-3 py-3 gx-bg-card shadow-[0_18px_40px_rgba(0,0,0,0.24)] min-h-[392px]">
                        <div className="absolute inset-x-0 top-0 h-16 opacity-90" style={{ background: 'linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.01) 48%, transparent 100%)' }}></div>
                        <div className="relative flex items-center justify-between mb-0.5">
                            <span className="text-[11px] uppercase tracking-[0.28em] gx-text-secondary">{gauge.label}</span>
                            <span className="data-numbers text-[11px] px-2 py-1 rounded-full border" style={{ color: gauge.color, borderColor: `${gauge.color}66`, backgroundColor: `${gauge.color}12` }}>{gauge.unit}</span>
                        </div>
                        <svg viewBox="0 0 236 154" className="w-full h-[138px] -mt-2">
                            <path d={trackPath} fill="none" stroke="rgba(255,255,255,0.08)" strokeWidth="12" strokeLinecap="round" />
                            <path d={progressPath} fill="none" stroke={gauge.color} strokeWidth="12" strokeLinecap="round" />
                            {gauge.ticks.map((tick, index) => {
                                const tickRatio = (tick - gauge.min) / (gauge.max - gauge.min || 1);
                                const tickAngle = startAngle + (endAngle - startAngle) * tickRatio;
                                const outer = toPoint(tickAngle, radius + 7);
                                const inner = toPoint(tickAngle, radius - 9);
                                const labelPoint = toPoint(tickAngle, radius + 18);
                                return (
                                    <g key={`${gauge.id}-${index}`}>
                                        <line x1={inner.x} y1={inner.y} x2={outer.x} y2={outer.y} stroke="rgba(255,255,255,0.30)" strokeWidth="2" strokeLinecap="round" />
                                        <text x={labelPoint.x} y={labelPoint.y} fill="var(--text-secondary)" fontSize="9" textAnchor="middle" dominantBaseline="middle" className="data-numbers">
                                            {tick}
                                        </text>
                                    </g>
                                );
                            })}
                            <polygon points={`${needleBaseLeft.x},${needleBaseLeft.y} ${needleBaseRight.x},${needleBaseRight.y} ${needleTip.x},${needleTip.y}`} fill={gauge.color} />
                            <circle cx={cx} cy={cy} r="10" fill="var(--bg-card)" stroke={gauge.color} strokeWidth="4" />
                            <circle cx={cx} cy={cy} r="3" fill={gauge.color} />
                        </svg>
                        <div className="relative -mt-4 text-center">
                            <div className="data-numbers text-[30px] leading-none font-semibold" style={{ color: gauge.color }}>
                                {Math.round(gauge.value)}
                            </div>
                            <div className="text-[11px] mt-1 gx-text-secondary tracking-[0.24em] uppercase">
                                {isSimulating ? phaseRef.current : 'Standby'}
                            </div>
                        </div>
                        <div className="relative mt-4 pointer-events-none">
                            <div className="flex items-center justify-between mb-1">
                                <span className="text-[9px] uppercase tracking-[0.24em] gx-text-secondary">Trend</span>
                                <span className="text-[9px] gx-text-secondary">{history.length} pts</span>
                            </div>
                            <div className="rounded-xl border overflow-hidden" style={{ borderColor: `${gauge.color}33`, background: 'linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015))' }}>
                                <svg viewBox={`0 0 ${sparkWidth} ${sparkHeight}`} preserveAspectRatio="none" className="w-full h-[128px]">
                                    <defs>
                                        <linearGradient id={`trend-fill-${gauge.id}`} x1="0" y1="0" x2="0" y2="1">
                                            <stop offset="0%" stopColor={gauge.color} stopOpacity="0.28" />
                                            <stop offset="100%" stopColor={gauge.color} stopOpacity="0.02" />
                                        </linearGradient>
                                    </defs>
                                    <path d={`M 0 ${(sparkHeight * 0.5).toFixed(2)} L ${sparkWidth} ${(sparkHeight * 0.5).toFixed(2)}`} stroke="rgba(255,255,255,0.08)" strokeWidth="1" strokeDasharray="3 3" fill="none" />
                                    <path d={sparkAreaPath} fill={`url(#trend-fill-${gauge.id})`} />
                                    <path d={sparkPath} stroke={gauge.color} strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round" fill="none" />
                                </svg>
                            </div>
                        </div>
                    </div>
                );
            };

            const InputRow = ({ item, type = 'text' }) => {
                const displayLabel = item.l[lang] || item.l['en'];
                return (
                    <div className="flex items-center justify-between py-1.5 px-2 gx-border border-b last:border-0 hover:bg-[rgba(var(--accent-rgb),0.05)] transition-colors gap-2">
                        <span className="text-[12px] gx-text-primary mr-2 leading-tight">{displayLabel}</span>
                        <div className="flex-shrink-0">
                            {type === 'select' ? (
                                <select className="data-numbers w-[74px] sm:w-[65px] px-1 py-0.5 text-[12px] gx-bg-main gx-border border gx-text-accent gx-shadow-inner rounded focus:outline-none focus:border-[var(--accent)] transition-colors">
                                    <option>{item.v}</option>
                                    <option>{item.v === 'ON' ? 'OFF' : 'ON'}</option>
                                </select>
                            ) : (
                                <input type="text" defaultValue={item.v} className="data-numbers w-[74px] sm:w-[65px] px-1.5 py-0.5 text-[12px] text-right gx-bg-main gx-border border gx-text-primary gx-shadow-inner rounded focus:outline-none focus:border-[var(--accent)] transition-colors" />
                            )}
                        </div>
                    </div>
                );
            };

            return (
                <div className="ecm-page flex flex-col min-h-[calc(100vh-12rem)] w-full max-w-[1800px] mx-auto p-1 sm:p-2 gap-2 gx-bg-main transition-colors duration-300">
                    <GlobalStyles />
                    <div className="flex flex-col gx-bg-card gx-border border rounded-lg shadow-lg overflow-hidden shrink-0">
                        <div className="px-3 sm:px-4 py-2 gx-border border-b flex flex-col md:flex-row md:items-center md:justify-between gap-2 select-none">
                            <div className="flex items-center gap-3">
                                <div className="p-1.5 bg-[rgba(var(--accent-rgb),0.2)] rounded border gx-border-accent">
                                    <Settings2 size={16} className="gx-text-accent" />
                                </div>
                                <span className="font-semibold text-xs sm:text-sm tracking-wide sm:tracking-widest gx-text-primary">{t('appTitle')} <span className="gx-text-secondary font-normal text-[10px] sm:text-xs ml-2">PRO</span></span>
                            </div>
                            
                            <div className="flex items-center gap-2 sm:gap-4 flex-wrap">
                                <div className="flex items-center gap-1.5 ml-2">
                                    <div className={`w-2 h-2 rounded-full ${isSimulating ? 'bg-[var(--accent)] shadow-[0_0_8px_var(--accent)]' : 'bg-[#555555]'}`}></div>
                                    <span className="data-numbers text-[10px] gx-text-secondary">{t('sysSts')}</span>
                                </div>
                                <span className={`data-numbers text-[11px] px-2 py-0.5 border rounded ${isSimulating ? 'bg-[rgba(var(--accent-rgb),0.15)] gx-text-accent gx-border-accent' : 'bg-[rgba(128,128,128,0.1)] gx-text-secondary gx-border'}`}>
                                    {t('phase')}: {phaseRef.current}
                                </span>
                            </div>
                        </div>

                        <div className="px-3 sm:px-4 py-2 flex flex-col xl:flex-row xl:items-center xl:justify-between gap-3">
                            <div className="flex flex-wrap items-center gap-3 sm:gap-4">
                                <div className="flex items-center gap-2">
                                    <label className="text-[12px] gx-text-secondary">{t('port')}</label>
                                    <select className="data-numbers gx-bg-main gx-border border gx-text-primary rounded px-2 py-0.5 text-[12px] w-[80px] gx-shadow-inner"><option>COM4</option></select>
                                </div>
                                <div className="flex items-center gap-2">
                                    <label className="text-[12px] gx-text-secondary">{t('baud')}</label>
                                    <select 
                                        value={baudRate} onChange={(e) => setBaudRate(e.target.value)}
                                        className="data-numbers gx-bg-main gx-border border gx-text-primary rounded px-2 py-0.5 text-[12px] w-[80px] gx-shadow-inner hover:border-[var(--accent)] transition-colors cursor-pointer"
                                    >
                                        <option value="9600">9600</option><option value="19200">19200</option><option value="38400">38400</option><option value="57600">57600</option><option value="115200">115200</option>
                                    </select>
                                </div>
                            </div>

                            <div className="flex flex-col sm:flex-row sm:items-center gap-3 sm:gap-4 w-full xl:w-auto">
                                <div className="flex flex-wrap items-center gap-2 bg-[rgba(128,128,128,0.1)] gx-border border rounded-md px-2 py-1 w-full sm:w-auto">
                                    <label className="text-[12px] gx-text-secondary flex items-center gap-1">
                                        <Activity size={14}/> {t('mode')}
                                    </label>
                                    <select 
                                        value={simMode} onChange={(e) => setSimMode(e.target.value)}
                                        className={`data-numbers gx-bg-main border rounded-sm px-2 py-0.5 text-[11px] focus:outline-none transition-colors gx-shadow-inner w-full sm:w-auto ${
                                            simMode === 'NORMAL' ? 'gx-border gx-text-accent' : 'border-[var(--status-warning)] text-[var(--status-warning)]'
                                        }`}
                                    >
                                        {Object.entries(activeSimModes).map(([key, info]) => (
                                            <option key={key} value={key}>{info.label}</option>
                                        ))}
                                    </select>
                                </div>
                                <button 
                                    onClick={handleSimulationToggle}
                                    className={`flex items-center justify-center gap-1.5 px-4 py-2 sm:py-1 border rounded text-[12px] font-bold transition-all w-full sm:w-auto ${
                                        isSimulating ? 'bg-[rgba(255,51,102,0.1)] border-[var(--status-danger)] text-[var(--status-danger)] hover:bg-[rgba(255,51,102,0.2)]' : 'bg-[rgba(var(--accent-rgb),0.1)] border-[var(--accent)] text-[var(--accent)] hover:bg-[rgba(var(--accent-rgb),0.2)]'
                                    }`}
                                >
                                    {isSimulating ? <PowerOff size={14} /> : <Play size={14} />}
                                    {isSimulating ? t('stop') : t('start')}
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 2xl:grid-cols-4 gap-2 shrink-0">
                        {gaugeData.map((gauge) => (
                            <GaugeCard key={gauge.id} gauge={gauge} />
                        ))}
                    </div>

                    {diagnosticNarrative && (
                        <div className="ecm-diagnostic-panel gx-bg-card rounded-2xl p-3 sm:p-4 mx-0 flex flex-col gap-3 shrink-0">
                            <div className="flex flex-col xl:flex-row xl:items-start xl:justify-between gap-3">
                                <div className="flex items-start gap-3 min-w-0">
                                    <div className="mt-0.5 p-2 rounded-xl bg-[rgba(255,90,90,0.12)] text-[var(--status-danger)] border border-[rgba(255,90,90,0.4)] shadow-[0_0_18px_rgba(255,70,70,0.12)]">
                                        <AlertTriangle size={18} />
                                    </div>
                                    <div className="min-w-0">
                                        <div className="text-[12px] sm:text-[13px] font-bold text-[var(--status-warning)] tracking-wide break-words">
                                            {t('expert')}: {diagnosticNarrative.title}
                                        </div>
                                        <div className="mt-1 text-[12px] sm:text-[13px] gx-text-primary leading-relaxed">
                                            {diagnosticNarrative.summary}
                                        </div>
                                    </div>
                                </div>
                                <div className="flex flex-wrap items-center gap-2 shrink-0">
                                    <span className="data-numbers text-[11px] px-2.5 py-1 rounded-full border border-[rgba(255,90,90,0.45)] bg-[rgba(255,70,70,0.14)] text-[var(--status-danger)]">
                                        {textPair('当前阶段', 'Phase')}: {diagnosticNarrative.phaseLabel}
                                    </span>
                                    <span className="data-numbers text-[11px] px-2.5 py-1 rounded-full border border-[rgba(255,153,0,0.38)] bg-[rgba(255,153,0,0.12)] text-[var(--status-warning)]">
                                        {diagnosticNarrative.phaseBadge}
                                    </span>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 xl:grid-cols-[1.35fr_0.95fr] gap-3">
                                <div className="rounded-2xl border border-[rgba(255,255,255,0.08)] bg-[rgba(255,255,255,0.02)] p-3">
                                    <div className="flex items-center justify-between gap-2 mb-2">
                                        <span className="text-[11px] uppercase tracking-[0.24em] text-[rgba(255,255,255,0.72)]">
                                            {textPair('过程解说', 'Process Narrative')}
                                        </span>
                                        <span className="text-[11px] text-[var(--status-danger)] data-numbers">
                                            {diagnosticNarrative.tripText}
                                        </span>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-2">
                                        {diagnosticNarrative.steps.map((step, index) => (
                                            <div
                                                key={`${simMode}-step-${index}`}
                                                className={`ecm-diagnostic-step rounded-2xl p-3 flex flex-col gap-2 ${
                                                    step.state === 'active' ? 'is-active' : (step.state === 'done' ? 'is-done' : '')
                                                }`}
                                            >
                                                <div className="flex items-center justify-between gap-2">
                                                    <span className="data-numbers text-[11px] font-semibold tracking-[0.14em] text-[rgba(255,255,255,0.72)]">
                                                        {textPair('阶段', 'Step')} {index + 1}
                                                    </span>
                                                    <span className={`w-2.5 h-2.5 rounded-full ${
                                                        step.state === 'active'
                                                            ? 'bg-[var(--status-danger)] shadow-[0_0_10px_rgba(255,60,60,0.85)]'
                                                            : (step.state === 'done'
                                                                ? 'bg-[var(--status-warning)] shadow-[0_0_8px_rgba(255,153,0,0.45)]'
                                                                : 'bg-[rgba(255,255,255,0.18)]')
                                                    }`}></span>
                                                </div>
                                                <div className="text-[12px] font-semibold gx-text-primary">{step.title}</div>
                                                <div className="text-[12px] leading-relaxed gx-text-secondary">{step.detail}</div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="rounded-2xl border border-[rgba(255,255,255,0.08)] bg-[rgba(255,255,255,0.02)] p-3 flex flex-col gap-3">
                                    <div>
                                        <div className="text-[11px] uppercase tracking-[0.24em] text-[rgba(255,255,255,0.72)] mb-1">
                                            {textPair('当前结果', 'Current Outcome')}
                                        </div>
                                        <div className="text-[13px] sm:text-[14px] leading-relaxed text-[var(--status-danger)] font-semibold">
                                            {diagnosticNarrative.result}
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                                        {diagnosticNarrative.metrics.map((metric) => (
                                            <div key={metric.key} className="ecm-diagnostic-metric rounded-xl p-2">
                                                <div className="text-[10px] uppercase tracking-[0.16em] gx-text-secondary">{metric.label}</div>
                                                <div className="mt-1 data-numbers text-[15px] font-semibold gx-text-primary">
                                                    {metric.value}
                                                    {metric.unit && <span className="ml-1 text-[11px] gx-text-secondary">{metric.unit}</span>}
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="rounded-xl border border-[rgba(255,153,0,0.28)] bg-[rgba(255,153,0,0.05)] p-3">
                                        <div className="text-[11px] font-semibold text-[var(--status-warning)] mb-1">{t('cause')}</div>
                                        <div className="text-[12px] leading-relaxed gx-text-primary">{activeSimModes[simMode].desc}</div>
                                    </div>

                                    <div className="rounded-xl border border-[rgba(var(--accent-rgb),0.26)] bg-[rgba(var(--accent-rgb),0.06)] p-3">
                                        <div className="text-[11px] font-semibold gx-text-accent mb-1">{t('sol')}</div>
                                        <div className="text-[12px] leading-relaxed gx-text-primary">{activeSimModes[simMode].sol}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="flex-1 flex flex-col xl:flex-row gap-2">
                        <div className="w-full xl:w-[65%] flex flex-col gx-bg-card gx-border border rounded-lg overflow-hidden min-h-[320px]">
                            <div className="flex gx-border border-b gx-bg-tab overflow-x-auto">
                                {Object.entries(t('tabs')).map(([key, name]) => (
                                    <button
                                        key={key} onClick={() => setActiveTab(key)}
                                        className={`px-3 sm:px-5 py-2 text-[12px] transition-colors gx-border border-r whitespace-nowrap shrink-0 ${
                                            activeTab === key ? 'gx-bg-card gx-text-accent font-semibold border-t-2 border-t-[var(--accent)]' : 'gx-text-secondary hover:gx-text-primary hover:bg-[rgba(128,128,128,0.1)]'
                                        }`}
                                    >
                                        {name}
                                    </button>
                                ))}
                            </div>
                            <div className="flex-1 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 lg:divide-x divide-[var(--border-line)] overflow-y-auto">
                                {currentConfig.params.map((col, colIdx) => (
                                    <div key={colIdx} className="p-1 flex flex-col border-b sm:border-b-0 border-[var(--border-line)]">
                                        {col.map((p, pIdx) => (
                                            <InputRow key={pIdx} item={p} type={p.type} />
                                        ))}
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="w-full xl:w-[35%] flex flex-col gx-bg-card gx-border border rounded-lg overflow-hidden min-h-[320px]">
                            <CurveChart def={currentConfig.chartDef} />
                            <div className="flex-1 overflow-auto">
                                <table className="min-w-[460px] w-full text-[12px] text-center border-collapse">
                                    <thead className="gx-bg-tab gx-text-secondary sticky top-0 shadow-sm">
                                        <tr>
                                            {currentConfig.tableHeaders.map((header, idx) => (
                                                <th key={idx} className="gx-border border-b py-2 px-1 font-medium whitespace-pre-line">{header}</th>
                                            ))}
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {currentConfig.tableData.map((row, idx) => (
                                            <tr key={idx} className="gx-border border-b hover:bg-[rgba(var(--accent-rgb),0.1)] transition-colors group">
                                                {row.map((cell, cellIdx) => (
                                                    <td key={cellIdx} className="data-numbers py-1.5 px-1 gx-border border-r gx-text-primary group-hover:gx-text-accent">{cell}</td>
                                                ))}
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <div className="shrink-0 gx-border border rounded-lg p-2 sm:p-3 overflow-x-auto" style={{ backgroundColor: 'var(--glass-bg)', backdropFilter: 'blur(12px)' }}>
                        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-x-3 sm:gap-x-4 gap-y-1.5 min-w-[760px] sm:min-w-0">
                            {[
                                { l: { en:'CurSpd', zh:'当前转速', ru:'Тек.Скор' }, k: 'CurSpd' }, { l: { en:'SetSpd', zh:'目标转速', ru:'Зад.Скор' }, k: 'SetSpd' },
                                { l: { en:'IgtSpd', zh:'点火转速', ru:'Скор.Зажиг' }, k: 'IgtSpd' }, { l: { en:'SyncVolt', zh:'同步电压', ru:'Напр.Синх' }, k: 'SyncVolt' },
                                { l: { en:'SpdState', zh:'调速状态', ru:'Стат.Скор' }, k: 'SpdState' }, { l: { en:'BaseI', zh:'基准电流', ru:'Баз.Ток' }, k: 'BaseI' },
                                
                                { l: { en:'CurPos1', zh:'调速位置', ru:'Поз.Скор' }, k: 'CurPos1' }, { l: { en:'SetPos1', zh:'调速目标', ru:'Зад.Поз1' }, k: 'SetPos1' },
                                { l: { en:'StopKey', zh:'启停开关', ru:'КлючОст' }, k: 'StopKey' }, { l: { en:'IdleKey', zh:'高低开关', ru:'КлючХХ' }, k: 'IdleKey' },
                                { l: { en:'MAP', zh:'歧管压力', ru:'ДАД(MAP)' }, k: 'MAP' }, { l: { en:'MAT', zh:'歧管温度', ru:'ДТВ(MAT)' }, k: 'MAT' },
                                
                                { l: { en:'CurPos2', zh:'燃气位置', ru:'Поз.Газ' }, k: 'CurPos2' }, { l: { en:'SetPos2', zh:'燃气目标', ru:'Зад.Поз2' }, k: 'SetPos2' },
                                { l: { en:'Lambda', zh:'空燃比', ru:'Лямбда' }, k: 'lambda' }, { l: { en:'FltrSpd', zh:'滤波转速', ru:'Филтр.Скор' }, k: 'fltrSpd' },
                                { l: { en:'AState', zh:'空燃比状态', ru:'Стат.Лямб' }, k: 'AState' }, { l: { en:'LoadI', zh:'发电电流', ru:'ТокНагр' }, k: 'LoadI' },
                                
                                { l: { en:'OilPress', zh:'机油压力', ru:'Давл.Мас' }, k: 'OilPressure' }, { l: { en:'WaterTemp', zh:'冷却水温', ru:'Темп.Вод' }, k: 'WaterTemp' },
                                { l: { en:'Exhaust', zh:'排气温度', ru:'Выхлоп' }, k: 'ExhaustTemp' }, null, null, null
                            ].map((item, index) => {
                                if (!item) return <div key={index} className="py-1"></div>;
                                const val = engineState[item.k];
                                const alarm = isAlarm(item.k, val);
                                const highlight = isSimulating && !alarm && ['CurSpd','MAP','lambda','LoadI','OilPressure','WaterTemp','ExhaustTemp'].includes(item.k);
                                
                                let valClass = "gx-text-primary"; 
                                if (alarm) valClass = "text-[var(--status-danger)] drop-shadow-[0_0_6px_rgba(255,51,102,0.6)] animate-pulse font-bold";
                                else if (highlight) valClass = "gx-text-accent font-medium";

                                return (
                                    <div key={index} className="flex items-center justify-between py-0.5 border-b border-[var(--border-line)] group">
                                        <div className="flex items-baseline overflow-hidden">
                                            <span className="text-[12px] gx-text-secondary whitespace-nowrap group-hover:text-[var(--text-primary)] transition-colors">
                                                {item.l[lang] || item.l['en']}
                                            </span>
                                        </div>
                                        <div className={`data-numbers text-[13px] ml-2 transition-all duration-300 ${valClass}`}>{val}</div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        const syncEcmHeaderBrand = () => {
            const brandTextNode = document.getElementById('ggx-header-brand-text');
            if (brandTextNode && !brandTextNode.classList.contains('ggx-header-brand-custom')) {
                brandTextNode.textContent = 'GasGx';
            }

            const homeLink = document.getElementById('ggx-header-home-link');
            if (homeLink) {
                homeLink.setAttribute('href', '/index.html');
            }
        };

        document.addEventListener('gasgx:shared-ui-ready', syncEcmHeaderBrand);
        document.addEventListener('gasgx:site-shell-config-updated', syncEcmHeaderBrand);
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', syncEcmHeaderBrand, { once: true });
        } else {
            syncEcmHeaderBrand();
        }
    </script>
    <script src="/shared/ui/site-shell.config.js"></script>
    <script src="/shared/ui/site-shell.shared.js"></script>
</body>
</html>
