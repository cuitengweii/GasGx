            const value = String(langCandidate || '').toLowerCase();

            try {
                const primary = window.localStorage.getItem('gasgx-lang');
                if (primary) return normalizeShellLang(primary);
                const fallback = window.localStorage.getItem('gas_lang');
                if (fallback) return normalizeShellLang(fallback);
            } catch (error) {
                // Ignore localStorage failures in restricted environments.
            }
            return normalizeShellLang(document.documentElement.lang || 'zh-CN');
        };

            const [theme, setTheme] = useState('dark');
            const [activeTab, setActiveTab] = useState('lambda');
            const [baudRate, setBaudRate] = useState('9600');
            
            const [isSimulating, setIsSimulating] = useState(false);
            const [simMode, setSimMode] = useState('NORMAL');
            
            const tickRef = useRef(0);
            const phaseRef = useRef('STOP');

            const getStopStateText = () => lang === 'en' ? 'STOP' : (lang === 'zh' ? '鍋滄満' : '小孝袨袩');

            const INITIAL_ENGINE_STATE = {
                CurSpd: 0, SetSpd: 1500, IgtSpd: 0, SyncVolt: 0.0,
                SpdState: getStopStateText(), BaseI: 0, CurPos1: 185, SetPos1: 185,
                StopKey: 1, IdleKey: 0, MAP: 101.3, MAT: 25.0,
                CurPos2: 162, SetPos2: 162, lambda: 1.0, fltrSpd: 0,

                FaultMsg: ''

            const [engineState, setEngineState] = useState(INITIAL_ENGINE_STATE);
            const t = (key) => dict[lang][key] || key;

            useEffect(() => {
                const app = (window.app && typeof window.app === 'object') ? window.app : {};
                app.currentLang = normalizeShellLang(lang);
                app.setLanguage = function (langCandidate) {
                    const nextLang = normalizeShellLang(langCandidate || this.currentLang);
                    this.currentLang = nextLang;
                    setLang((prev) => (prev === nextLang ? prev : nextLang));
                    return this.currentLang;
                };
                app.init = function () {
                    this.setLanguage(this.currentLang || resolveInitialLang());
                };
                window.app = app;

                const handleLangChanged = (event) => {
                    const nextLang = normalizeShellLang(event && event.detail ? event.detail.lang : undefined);
                    app.setLanguage(nextLang);
                };

                document.addEventListener('gasgx:lang-changed', handleLangChanged);
                return () => {
                    document.removeEventListener('gasgx:lang-changed', handleLangChanged);
                };
            }, []);

            useEffect(() => {
                const normalized = normalizeShellLang(lang);
                if (normalized !== lang) {
                    setLang(normalized);
                    return;
                }

                if (window.app && typeof window.app === 'object') {
                    window.app.currentLang = normalized;
                }
                document.documentElement.lang = normalized === 'zh' ? 'zh-CN' : 'en';
            }, [lang]);

            // --- 21 绉嶇‖鏍告帹婕旀ā寮忔櫤搴?---

                        sol: isZH?'妫€鏌ュ惎鍔ㄩ┈杈句緵鐢电數鍘嬶紱妫€鏌ョ噧姘斾富闃€鏄惁鎵撳紑銆?:(isEN?'Check starter voltage; check main gas valve.':'袩褉芯胁械褉褜褌械 薪邪锌褉褟卸械薪懈械 褋褌邪褉褌械褉邪; 谐邪蟹芯胁褘泄 泻谢邪锌邪薪.')

                    },

                        sol: isZH?'绔嬪埢鍋滄満妫€鏌ユ暎鐑櫒銆佹按绠℃帴澶存槸鍚︾牬瑁傘€?:(isEN?'Check radiator and hose joints for burst.':'袩褉芯胁械褉褜褌械 褉邪写懈邪褌芯褉 懈 褕谢邪薪谐懈 薪邪 锌褉芯褉褘胁.') 
                    },
                    OIL_PUMP_FAIL: { 
                        label: isZH?'[05] 鏈烘补娉靛け鏁?(ERR_OIL_PUMP)':(isEN?'[05] Oil Pump Fail':'[05] 袨褌泻邪蟹 屑邪褋谢褟薪芯谐芯 薪邪褋芯褋邪'), 
                        desc: isZH?'鏈烘补鍘嬪姏鏂礀寮忎笅璺岃嚦 0锛屽瓨鍦ㄤ弗閲嶆媺缂搁闄┿€?:(isEN?'Oil pressure drops to zero instantly. High friction risk.':'袛邪胁谢械薪懈械 屑邪褋谢邪 锌邪写邪械褌 写芯 薪褍谢褟. 袪懈褋泻 蟹邪写懈褉芯胁.'),

                    SENSOR_FAIL_MAP: { 
                        label: isZH?'[06] 姝х浼犳劅鏂嚎 (ERR_MAP)':(isEN?'[06] MAP Sensor Fail':'[06] 袨褌泻邪蟹 写邪褌褔懈泻邪 袛袗袛'), 
                        desc: isZH?'MAP淇″彿涓㈠け瀵艰嚧閫€鍥炲紑鐜紝杞€熷墽鐑堟父杞﹂渿鑽°€?:(isEN?'MAP signal lost, system open-loop, severe hunting.':'袩芯褌械褉褟 褋懈谐薪邪谢邪 袛袗袛, 褉邪褋泻邪褔泻邪 芯斜芯褉芯褌芯胁.'), 
                        sol: isZH?'妫€鏌AP浼犳劅鍣ㄧ嚎鏉熻繛鎺ヤ笌5V鍙傝€冧緵鐢点€?:(isEN?'Check sensor wiring and 5V reference.':'袩褉芯胁械褉褜褌械 锌褉芯胁芯写泻褍 写邪褌褔懈泻邪 懈 锌懈褌邪薪懈械 5袙.')

                                        } else if (mode === 'MISFIRE') {
                                            if (ticks % 4 === 0) nextSpd -= 80; nextState.ExhaustTemp = Math.max(300, nextState.ExhaustTemp - 30); nextState.lambda = (parseFloat(nextState.lambda) + 0.15).toFixed(2);
                                        } else if (mode === 'RICH_MIXTURE') {
                                            nextState.lambda = '0.88'; nextState.ExhaustTemp += 25; nextState.CurPos2 = Math.min(450, nextState.CurPos2 + 80);
                                        } else if (mode === 'LEAN_BURN_LIMIT') {
                                            nextState.lambda = '1.68'; nextSpd += (Math.random() * 80 - 40); nextState.ExhaustTemp -= 10;
                                        } else if (mode === 'KNOCK_DETECTED') {
                                            nextState.MAP = '180.5'; nextSpd -= 40; 
                                        } else if (mode === 'LOW_GAS_PRESS') {
                                            nextState.CurPos2 = 450; nextSpd -= 80; nextState.lambda = '1.55'; 
                                        } else if (mode === 'EXHAUST_BLOCK') {
                                            nextState.ExhaustTemp += 100; nextState.MAP = '180.0'; nextSpd -= 60;
                                        } else if (mode === 'ACTUATOR_JAM') {
                                            nextState.CurPos2 = 180; if (load > 200) nextSpd -= 40;
                                        } else if (mode === 'THROTTLE_LAG') {
                                            nextState.CurPos1 = prev.CurPos1 + (nextState.SetPos1 - prev.CurPos1) * 0.05; if (Math.abs(nextState.SetPos1 - nextState.CurPos1) > 50) nextSpd -= 50;
                                        }
                                    }
                                }
                            } else if (phaseRef.current === 'FAULT') {
                                nextState.SpdState = 'STOP'; nextState.StopKey = 1; nextSpd = Math.max(0, prev.CurSpd - 200);
                                nextOil = Math.max(0, nextOil - 50); nextState.LoadI = 0; nextState.BaseI = 0;
                                nextState.SyncVolt = '0.00'; nextState.AState = 'OPEN'; nextState.MAP = '101.3';
                                nextState.CurPos1 = 185; nextState.CurPos2 = 162;
                                if (nextSpd === 0) setIsSimulating(false);
                            }

                            let faultMsg = '';
                            if (phaseRef.current === 'RATED' || (phaseRef.current === 'IDLE' && ticks > 25)) {
                                if (nextWater > 95) faultMsg = t('errPrefix') + ' T>95鈩?;
                                else if (nextOil < 150 && mode !== 'START_FAIL') faultMsg = t('errPrefix') + ' P<150kPa';
                                else if (nextSpd > 1750) faultMsg = t('errPrefix') + ' OVERSPEED';
                                else if (nextState.ExhaustTemp > 650) faultMsg = t('errPrefix') + ' EXH>650鈩?;
                                else if (mode === 'SYNC_LOSS' && ticks % 4 === 0) faultMsg = t('errPrefix') + ' NO SYNC';
                                else if (mode === 'CAN_BUS_OFF' && ticks % 5 === 0) faultMsg = t('errPrefix') + ' CAN FLT';
                                else if (mode === 'SENSOR_FAIL_MAP' && ticks % 12 === 0) faultMsg = t('errPrefix') + ' COM LOST';
                                else if ((mode === 'LOAD_SURGE' || mode === 'OVERLOAD') && nextState.LoadI > 650 && ticks % 8 === 0) faultMsg = t('errPrefix') + ' OVERLOAD';

                                    >
                                        <option value="9600">9600</option><option value="19200">19200</option><option value="38400">38400</option><option value="57600">57600</option><option value="115200">115200</option>
                                    </select>
                                </div>
                            </div>

                            <div className="flex flex-col sm:flex-row sm:items-center gap-3 sm:gap-4 w-full xl:w-auto">
                                <div className="flex flex-wrap items-center gap-2 bg-[rgba(128,128,128,0.1)] gx-border border rounded-md px-2 py-1 w-full sm:w-auto">
                                    <label className="text-[12px] gx-text-secondary flex items-center gap-1">
                                        <Activity size={14}/> {t('mode')}
                                    </label>
                                    <select 
                                        value={simMode} onChange={(e) => setSimMode(e.target.value)}
                                        className={`data-numbers gx-bg-main border rounded-sm px-2 py-0.5 text-[11px] focus:outline-none transition-colors gx-shadow-inner w-full sm:w-auto ${
                                            simMode === 'NORMAL' ? 'gx-border gx-text-accent' : 'border-[var(--status-warning)] text-[var(--status-warning)]'
                                        }`}
                                    >
                                        {Object.entries(activeSimModes).map(([key, info]) => (
                                            <option key={key} value={key}>{info.label}</option>
                                        ))}
                                    </select>
                                </div>
                                <button 
                                    onClick={handleSimulationToggle}
                                    className={`flex items-center justify-center gap-1.5 px-4 py-2 sm:py-1 border rounded text-[12px] font-bold transition-all w-full sm:w-auto ${
                                        isSimulating ? 'bg-[rgba(255,51,102,0.1)] border-[var(--status-danger)] text-[var(--status-danger)] hover:bg-[rgba(255,51,102,0.2)]' : 'bg-[rgba(var(--accent-rgb),0.1)] border-[var(--accent)] text-[var(--accent)] hover:bg-[rgba(var(--accent-rgb),0.2)]'
                                    }`}
                                >
                                    {isSimulating ? <PowerOff size={14} /> : <Play size={14} />}
                                    {isSimulating ? t('stop') : t('start')}
                                </button>
                            </div>
                        </div>
                    </div>

                    {simMode !== 'NORMAL' && activeSimModes[simMode] && (
                        <div className="gx-bg-card border border-[var(--status-warning)] rounded-lg p-3 mx-0 shadow-[0_0_15px_rgba(255,153,0,0.1)] flex flex-col gap-1.5 shrink-0">
                            <div className="flex items-center gap-2 mb-0.5">
                                <AlertTriangle size={16} className="text-[var(--status-warning)]" />
                                <span className="text-[12px] sm:text-[13px] font-bold text-[var(--status-warning)] tracking-wide break-words">
                                    {t('expert')}: {activeSimModes[simMode].label}
                                </span>
                            </div>
                            <div className="text-[12px] gx-text-primary sm:pl-6 flex items-start">
                                <span className="gx-text-secondary whitespace-nowrap mr-2">{t('cause')}</span> {activeSimModes[simMode].desc}
                            </div>
                            <div className="text-[12px] gx-text-accent sm:pl-6 flex items-start">
                                <span className="gx-text-secondary whitespace-nowrap mr-2">{t('sol')}</span> {activeSimModes[simMode].sol}
                            </div>
                        </div>
                    )}

                    <div className="flex-1 flex flex-col xl:flex-row gap-2">
                        <div className="w-full xl:w-[65%] flex flex-col gx-bg-card gx-border border rounded-lg overflow-hidden min-h-[320px]">
                            <div className="flex gx-border border-b gx-bg-tab overflow-x-auto">
                                {Object.entries(t('tabs')).map(([key, name]) => (
                                    <button
                                        key={key} onClick={() => setActiveTab(key)}
                                        className={`px-3 sm:px-5 py-2 text-[12px] transition-colors gx-border border-r whitespace-nowrap shrink-0 ${
                                            activeTab === key ? 'gx-bg-card gx-text-accent font-semibold border-t-2 border-t-[var(--accent)]' : 'gx-text-secondary hover:gx-text-primary hover:bg-[rgba(128,128,128,0.1)]'
                                        }`}
                                    >
                                        {name}
                                    </button>
                                ))}
                            </div>
                            <div className="flex-1 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 lg:divide-x divide-[var(--border-line)] overflow-y-auto">
                                {currentConfig.params.map((col, colIdx) => (
                                    <div key={colIdx} className="p-1 flex flex-col border-b sm:border-b-0 border-[var(--border-line)]">
                                        {col.map((p, pIdx) => (
                                            <InputRow key={pIdx} item={p} type={p.type} />
                                        ))}
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="w-full xl:w-[35%] flex flex-col gx-bg-card gx-border border rounded-lg overflow-hidden min-h-[320px]">
                            <CurveChart def={currentConfig.chartDef} />
                            <div className="flex-1 overflow-auto">
                                <table className="min-w-[460px] w-full text-[12px] text-center border-collapse">
                                    <thead className="gx-bg-tab gx-text-secondary sticky top-0 shadow-sm">
                                        <tr>
                                            {currentConfig.tableHeaders.map((header, idx) => (
                                                <th key={idx} className="gx-border border-b py-2 px-1 font-medium whitespace-pre-line">{header}</th>
                                            ))}
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {currentConfig.tableData.map((row, idx) => (
                                            <tr key={idx} className="gx-border border-b hover:bg-[rgba(var(--accent-rgb),0.1)] transition-colors group">
                                                {row.map((cell, cellIdx) => (
                                                    <td key={cellIdx} className="data-numbers py-1.5 px-1 gx-border border-r gx-text-primary group-hover:gx-text-accent">{cell}</td>
                                                ))}
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <div className="shrink-0 gx-border border rounded-lg p-2 sm:p-3 overflow-x-auto" style={{ backgroundColor: 'var(--glass-bg)', backdropFilter: 'blur(12px)' }}>
                        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-x-3 sm:gap-x-4 gap-y-1.5 min-w-[760px] sm:min-w-0">
                            {[
                                { l: { en:'CurSpd', zh:'褰撳墠杞€?, ru:'孝械泻.小泻芯褉' }, k: 'CurSpd' }, { l: { en:'SetSpd', zh:'鐩爣杞€?, ru:'袟邪写.小泻芯褉' }, k: 'SetSpd' },
                                { l: { en:'IgtSpd', zh:'鐐圭伀杞€?, ru:'小泻芯褉.袟邪卸懈谐' }, k: 'IgtSpd' }, { l: { en:'SyncVolt', zh:'鍚屾鐢靛帇', ru:'袧邪锌褉.小懈薪褏' }, k: 'SyncVolt' },
                                { l: { en:'SpdState', zh:'璋冮€熺姸鎬?, ru:'小褌邪褌.小泻芯褉' }, k: 'SpdState' }, { l: { en:'BaseI', zh:'鍩哄噯鐢垫祦', ru:'袘邪蟹.孝芯泻' }, k: 'BaseI' },
                                
                                { l: { en:'CurPos1', zh:'璋冮€熶綅缃?, ru:'袩芯蟹.小泻芯褉' }, k: 'CurPos1' }, { l: { en:'SetPos1', zh:'璋冮€熺洰鏍?, ru:'袟邪写.袩芯蟹1' }, k: 'SetPos1' },
                                { l: { en:'StopKey', zh:'鍚仠寮€鍏?, ru:'袣谢褞褔袨褋褌' }, k: 'StopKey' }, { l: { en:'IdleKey', zh:'楂樹綆寮€鍏?, ru:'袣谢褞褔啸啸' }, k: 'IdleKey' },
                                { l: { en:'MAP', zh:'姝х鍘嬪姏', ru:'袛袗袛(MAP)' }, k: 'MAP' }, { l: { en:'MAT', zh:'姝х娓╁害', ru:'袛孝袙(MAT)' }, k: 'MAT' },
                                
                                { l: { en:'CurPos2', zh:'鐕冩皵浣嶇疆', ru:'袩芯蟹.袚邪蟹' }, k: 'CurPos2' }, { l: { en:'SetPos2', zh:'鐕冩皵鐩爣', ru:'袟邪写.袩芯蟹2' }, k: 'SetPos2' },
                                { l: { en:'Lambda', zh:'绌虹噧姣?, ru:'袥褟屑斜写邪' }, k: 'lambda' }, { l: { en:'FltrSpd', zh:'婊ゆ尝杞€?, ru:'肖懈谢褌褉.小泻芯褉' }, k: 'fltrSpd' },
                                { l: { en:'AState', zh:'绌虹噧姣旂姸鎬?, ru:'小褌邪褌.袥褟屑斜' }, k: 'AState' }, { l: { en:'LoadI', zh:'鍙戠數鐢垫祦', ru:'孝芯泻袧邪谐褉' }, k: 'LoadI' },
                                
                                { l: { en:'OilPress', zh:'鏈烘补鍘嬪姏', ru:'袛邪胁谢.袦邪褋' }, k: 'OilPressure' }, { l: { en:'WaterTemp', zh:'鍐峰嵈姘存俯', ru:'孝械屑锌.袙芯写' }, k: 'WaterTemp' },
                                { l: { en:'Exhaust', zh:'鎺掓皵娓╁害', ru:'袙褘褏谢芯锌' }, k: 'ExhaustTemp' }, null, null, null
                            ].map((item, index) => {
                                if (!item) return <div key={index} className="py-1"></div>;
                                const val = engineState[item.k];
                                const alarm = isAlarm(item.k, val);
                                const highlight = isSimulating && !alarm && ['CurSpd','MAP','lambda','LoadI','OilPressure','WaterTemp','ExhaustTemp'].includes(item.k);
                                
                                let valClass = "gx-text-primary"; 
                                if (alarm) valClass = "text-[var(--status-danger)] drop-shadow-[0_0_6px_rgba(255,51,102,0.6)] animate-pulse font-bold";
                                else if (highlight) valClass = "gx-text-accent font-medium";

                                return (
                                    <div key={index} className="flex items-center justify-between py-0.5 border-b border-[var(--border-line)] group">
                                        <div className="flex items-baseline overflow-hidden">
                                            <span className="text-[12px] gx-text-secondary whitespace-nowrap group-hover:text-[var(--text-primary)] transition-colors">
                                                {item.l[lang] || item.l['en']}
                                            </span>
                                        </div>
                                        <div className={`data-numbers text-[13px] ml-2 transition-all duration-300 ${valClass}`}>{val}</div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        const syncEcmHeaderBrand = () => {
            const brandTextNode = document.getElementById('ggx-header-brand-text');
            if (brandTextNode) {
                brandTextNode.textContent = 'GasGx';
            }

            const homeLink = document.getElementById('ggx-header-home-link');
            if (homeLink) {
                homeLink.setAttribute('href', '/index.html');
            }
        };

        document.addEventListener('gasgx:shared-ui-ready', syncEcmHeaderBrand);
        document.addEventListener('gasgx:site-shell-config-updated', syncEcmHeaderBrand);
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', syncEcmHeaderBrand, { once: true });
        } else {
            syncEcmHeaderBrand();
        }
    </script>
    <script src="/shared/ui/site-shell.config.js"></script>
    <script src="/shared/ui/site-shell.shared.js"></script>
</body>
</html>
