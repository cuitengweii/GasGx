<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GasGx Mobile Feeder v23</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://mkpcliytqudclkwtewru.supabase.co" crossorigin>
    <script defer src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script>
        window.tailwind = window.tailwind || {};
        window.tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gas: { bg: '#050505', card: '#161616', green: '#5DD62C', border: '#333', text: '#ddd' }
                    },
                    boxShadow: {
                        'glow': '0 0 10px rgba(93, 214, 44, 0.3)'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050505; color: #eee; -webkit-tap-highlight-color: transparent; padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
        #appRoot { opacity: 1; transition: opacity 0.15s ease; }
        body.app-loading #appRoot { opacity: 0; pointer-events: none; }
        
        .input-gas { background: #111; border: 1px solid #333; color: white; padding: 14px; width: 100%; border-radius: 12px; outline: none; transition: all 0.2s; font-size: 15px; }
        .input-gas:focus { border-color: #5DD62C; background: #0a0a0a; }

        .capture-bar {
            position: sticky; top: 0; z-index: 20;
            background: rgba(5, 5, 5, 0.92);
            border-bottom: 1px solid #1e1e1e;
            backdrop-filter: blur(10px);
        }
        .capture-inner { max-width: 448px; margin: 0 auto; padding: calc(10px + env(safe-area-inset-top)) 16px 12px; }

        .app-header { transition: all 0.2s ease; }
        .app-subtitle { transition: opacity 0.2s ease; }
        .capture-bar.compact .app-subtitle { opacity: 0; height: 0; overflow: hidden; }
        .capture-bar.compact .app-header { margin-bottom: 6px; }
        .app-logo { width: 36px; height: 36px; }
        .capture-bar.compact .app-logo { width: 30px; height: 30px; }

        .sticky-url {
            position: relative;
            background: rgba(5, 5, 5, 0.88);
            border: 1px solid #1e1e1e; border-radius: 16px;
            padding: 10px; backdrop-filter: blur(10px);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
        }
        .url-shell {
            background: #0f0f0f; border: 1px solid #2a2a2a;
            border-radius: 14px; display: flex; align-items: center;
            overflow: hidden;
        }
        .url-input {
            background: transparent; border: 0; color: #f1f1f1;
            padding: 14px 14px; flex: 1; font-size: 15px;
        }
        .url-input:focus { outline: none; }
        .url-paste-btn {
            width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
            background: #151515; border-left: 1px solid #2a2a2a; color: #9aa0a6;
            transition: all 0.2s; cursor: pointer;
        }
        .url-paste-btn:hover { color: #5DD62C; background: #121a0f; }
        .url-paste-btn:active { transform: scale(0.92); }
        .url-send-btn {
            width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
            background: #5DD62C; color: #0a0a0a; border-left: 1px solid #2a2a2a;
            transition: all 0.2s; cursor: pointer; font-weight: 700;
        }
        .url-send-btn:hover { filter: brightness(0.95); }
        .url-send-btn:active { transform: scale(0.92); }
        
        .btn-gas { background: #5DD62C; color: black; font-weight: 800; padding: 16px; border-radius: 12px; width: 100%; text-transform: uppercase; letter-spacing: 1px; font-size: 16px; box-shadow: 0 4px 15px rgba(93, 214, 44, 0.2); transition: all 0.2s; }
        .btn-gas:active { transform: scale(0.96); opacity: 0.9; }

        .grid-select { display: grid; gap: 8px; }
        .grid-cols-3 { grid-template-columns: repeat(3, 1fr); }
        .secondary-groups { display: flex; flex-direction: column; gap: 12px; }
        .secondary-group {
            background: #0b0b0b;
            border: 1px solid #1f1f1f;
            border-radius: 10px;
            padding: 10px;
        }
        .secondary-group.active-group {
            border-color: #355929;
            box-shadow: inset 0 0 0 1px rgba(93, 214, 44, 0.15);
        }
        .secondary-group-title {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #8f959e;
            margin-bottom: 8px;
        }
        @media (max-width: 380px) {
            .grid-cols-3 { grid-template-columns: repeat(2, 1fr); }
        }
        
        /* Option cards */
        .option-card {
            background: #161616; border: 1px solid #333; border-radius: 8px;
            padding: 10px 4px; text-align: center; font-size: 12px; font-weight: 600; color: #888;
            cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center;
            min-height: 44px; word-break: break-word; line-height: 1.2;
            position: relative;
        }
        .option-card.manage-item { padding-left: 22px; padding-right: 22px; }
        .option-card.active {
            background: rgba(93, 214, 44, 0.15); border-color: #5DD62C; color: #5DD62C;
            box-shadow: 0 0 8px rgba(93, 214, 44, 0.1);
        }
        .option-card .edit-x,
        .option-card .delete-x {
            position: absolute; top: 4px; right: 4px;
            width: 16px; height: 16px; border-radius: 50%;
            border: 1px solid #2e2e2e; background: #101010; color: #9aa0a6;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; line-height: 1; cursor: pointer;
        }
        .option-card .edit-x {
            left: 4px;
            right: auto;
        }
        .option-card .delete-x:hover { color: #ff6b6b; border-color: #3a2a2a; }
        .option-card .edit-x:hover { color: #5DD62C; border-color: #294220; }
        .option-manage-btn {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            border: 1px solid #242424;
            background: #0f0f0f;
            color: #626b76;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            opacity: 0.68;
            transition: all 0.2s;
        }
        .option-manage-btn:hover {
            opacity: 1;
            color: #8a93a0;
            border-color: #343434;
        }
        .option-manage-btn.active {
            border-color: #5DD62C;
            color: #5DD62C;
            background: rgba(93, 214, 44, 0.12);
            opacity: 1;
        }
        
        /* DIY input animation */
        .custom-input-wrapper { display: none; margin-top: 8px; animation: slideDown 0.2s ease-out; }
        .custom-input-wrapper.show { display: block; }
        .custom-input-row { display: flex; gap: 8px; align-items: center; }
        .custom-input-row .input-gas { flex: 1; width: auto; }
        .custom-add-btn {
            display: none;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            border: 1px solid #2f2f2f;
            background: #121212;
            color: #5DD62C;
            font-size: 18px;
            font-weight: 700;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .manage-mode .custom-add-btn { display: inline-flex; }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="max-w-md mx-auto relative app-loading">
    <div id="appRoot">

    <div id="captureBar" class="capture-bar">
        <div class="capture-inner">
            <div id="appHeader" class="app-header flex items-center justify-between mb-2">
                <div class="flex items-center gap-3">
                    <div class="app-logo w-9 h-9 bg-gas-card rounded-full flex items-center justify-center border border-gas-border shadow-glow">
                        <i class="fa-solid fa-gas-pump text-gas-green text-sm"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold font-mono text-white tracking-tight">GasGx Feeder</h1>
                        <p class="app-subtitle text-[10px] text-gray-500 uppercase tracking-widest">Mobile Link Control</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <div class="text-xs text-gas-green font-mono bg-gas-green/10 px-2 py-1 rounded">v23.0</div>
                    <button type="button" id="optionManageBtn" class="option-manage-btn" onclick="toggleOptionManageMode()"></button>
                </div>
            </div>

            <div class="sticky-url">
                <label class="flex justify-between text-xs text-gray-500 mb-2 font-bold uppercase tracking-wider">
                    <span>Target URL</span>
                    <span class="text-gas-green text-[10px]"><i class="fa-solid fa-bolt"></i> <span>Ready</span></span>
                </label>
                <div class="url-shell">
                    <input type="url" id="link" class="url-input" placeholder="https://..." required form="taskForm" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false">
                    <button type="button" onclick="triggerPaste()" class="url-paste-btn" aria-label="Paste link">
                        <i class="fa-solid fa-link text-lg"></i>
                    </button>
                    <button type="button" id="aiQuickSubmitBtn" onclick="handleAiQuickSubmit()" class="url-send-btn" aria-label="AI quick submit" title="AI quick submit">
                        <i class="fa-solid fa-paper-plane text-base"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <form id="taskForm" class="px-4 pt-2 pb-6 space-y-6">
        <div>
            <label class="block text-xs text-gray-500 mb-2 font-bold uppercase tracking-wider">Category</label>
            <div class="grid-select grid-cols-3" id="category-container"></div>
            <div id="category-custom-wrapper" class="custom-input-wrapper">
                <div class="custom-input-row">
                    <input type="text" id="category-custom-input" class="input-gas border-gas-green" placeholder="Type custom Category..." oninput="syncCustomValue('category', this.value)" onkeydown="handleCustomInputKeydown(event, 'category')">
                    <button type="button" class="custom-add-btn" onclick="addCustomOptionFromInput('category')" aria-label="Add option">+</button>
                </div>
            </div>
            <input type="hidden" id="category" value="gas-energy">
        </div>

        <div id="publisher-section" class="hidden">
            <label class="block text-xs text-gray-500 mb-2 font-bold uppercase tracking-wider">Publisher</label>
            <div class="grid-select grid-cols-3" id="publisher-container"></div>
            <div id="publisher-custom-wrapper" class="custom-input-wrapper">
                <div class="custom-input-row">
                    <input type="text" id="publisher-custom-input" class="input-gas border-gas-green" placeholder="Type custom Publisher..." oninput="syncCustomValue('publisher', this.value)" onkeydown="handleCustomInputKeydown(event, 'publisher')">
                    <button type="button" class="custom-add-btn" onclick="addCustomOptionFromInput('publisher')" aria-label="Add option">+</button>
                </div>
            </div>
            <input type="hidden" id="publisher" value="GasGx-Researcher">
        </div>

        <div>
            <label class="block text-xs text-gray-500 mb-2 font-bold uppercase tracking-wider">Main Tag</label>
            <div class="grid-select grid-cols-3" id="tag-container"></div>
            <div id="tag-custom-wrapper" class="custom-input-wrapper">
                <div class="custom-input-row">
                    <input type="text" id="tag-custom-input" class="input-gas border-gas-green" placeholder="Type custom Tag..." oninput="syncCustomValue('tag', this.value)" onkeydown="handleCustomInputKeydown(event, 'tag')">
                    <button type="button" class="custom-add-btn" onclick="addCustomOptionFromInput('tag')" aria-label="Add option">+</button>
                </div>
            </div>
            <input type="hidden" id="tag" value="Hardware">
        </div>

        <div>
            <label class="block text-xs text-gray-500 mb-2 font-bold uppercase tracking-wider">Secondary Tag</label>
            <div id="secondary_tag-groups" class="secondary-groups"></div>
            <input type="hidden" id="secondary_tag" value="">
            <input type="hidden" id="secondary_tag_group" value="gas-energy">
        </div>

        <button type="submit" id="submitBtn" class="btn-gas mt-6 flex items-center justify-center gap-3">
            <span>SEND TO CLOUD</span>
            <i class="fa-solid fa-paper-plane"></i>
        </button>

    </form>

    <div class="px-4 mt-2 mb-8">
        <h3 class="text-xs text-gray-500 font-bold uppercase tracking-wider mb-3 border-b border-gray-800 pb-2">Recent Generated Links</h3>
        <div id="history-list" class="space-y-3"></div>
        <button onclick="clearHistory()" class="text-[10px] text-gray-600 mt-4 w-full text-center py-2 hover:text-red-500 transition-colors">Clear History</button>
    </div>

    <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 bg-[#111] border border-gas-green text-white px-6 py-3 rounded-full text-sm font-bold shadow-2xl opacity-0 transition-all pointer-events-none flex items-center gap-3 z-50 transform scale-90">
        <i class="fa-solid fa-circle-check text-gas-green text-lg"></i>
        <span id="toast-msg">Task Added!</span>
    </div>

    </div>
    <script defer src="./feeder.js?v=23.2"></script>
</body>
</html>
