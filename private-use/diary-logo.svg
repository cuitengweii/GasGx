<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Diary Mood Logo</title>
  <desc id="desc">A playful diary icon with smiley mood and handwritten lines.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f3eb"/>
      <stop offset="100%" stop-color="#e8e6df"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd85e"/>
      <stop offset="100%" stop-color="#f6b73e"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ddd9d0" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect x="12" y="12" width="488" height="488" rx="110" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="110" fill="url(#grid)" opacity=".55"/>

  <g filter="url(#shadow)">
    <rect x="94" y="78" width="324" height="356" rx="26" fill="#f9f7f0" stroke="#1f1f1f" stroke-width="10"/>
    <line x1="146" y1="112" x2="146" y2="400" stroke="#cf6363" stroke-width="8" stroke-linecap="round" opacity=".9"/>

    <rect x="170" y="64" width="172" height="24" rx="10" fill="#a8ddb5" opacity=".95"/>

    <circle cx="256" cy="164" r="52" fill="url(#sunGrad)" stroke="#e7a032" stroke-width="5"/>
    <circle cx="238" cy="152" r="5.5" fill="#2a2a2a"/>
    <circle cx="274" cy="152" r="5.5" fill="#2a2a2a"/>
    <path d="M232 178c11 11 37 11 48 0" fill="none" stroke="#2a2a2a" stroke-width="6" stroke-linecap="round"/>

    <rect x="176" y="232" width="170" height="20" rx="10" fill="#a8ddb5"/>
    <path d="M179 286h168M179 319h168M179 352h168" stroke="#404040" stroke-width="7.5" stroke-linecap="round" opacity=".88"/>

    <path d="M346 76l28 12-28 12z" fill="#2b2b2b"/>
  </g>
</svg>
