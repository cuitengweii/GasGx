<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diary Mood</title>
    <meta name="color-scheme" content="light">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Diary Mood">
    <link rel="icon" type="image/svg+xml" href="./diary-logo.png">
    <link rel="apple-touch-icon" href="./diary-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://script.google.com" crossorigin>
    <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --bg: #e9e9e5;
            --ink: #171717;
            --muted: #96918b;
            --accent-soft: #a3d8b1;
            --paper-grid: #e2e2de;
            --paper: #f0f0eb;
            --paper-border: #202020;
            --red-ink: #cf6363;
            --font-hand: "ZCOOL KuaiLe", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            --font-ui: "ZCOOL KuaiLe", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }

        * { box-sizing: border-box; }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: var(--font-ui);
            min-height: 100%;
        }

        .app {
            width: min(100%, 430px);
            height: 100dvh;
            min-height: 100dvh;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }

        .view {
            display: none;
            height: 100%;
            min-height: 0;
            padding: 4px 14px 22px;
        }

        .view.active {
            display: flex;
            flex-direction: column;
        }

        .picker-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 6px 0 2px;
        }

        .wheel-wrap {
            position: relative;
            width: min(100%, 404px);
            height: clamp(320px, 52vh, 410px);
            min-height: 320px;
            display: grid;
            place-items: center;
        }

        .mood-ring {
            width: min(100%, 390px);
            --ring-radius: 154px;
            --ring-rotation: 0deg;
            position: relative;
            aspect-ratio: 1 / 1;
            margin: 0;
            touch-action: none;
            cursor: grab;
        }

        .mood-ring.instant-rotate .mood-node {
            transition: none !important;
        }

        .mood-ring.dragging {
            cursor: grabbing;
        }

        .mood-ring::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: calc(var(--ring-radius) * 2);
            height: calc(var(--ring-radius) * 2);
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 2px solid rgba(130, 130, 130, 0.26);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16);
            pointer-events: none;
        }

        .mood-node {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 0;
            background: transparent;
            transform: translate(-50%, -50%) rotate(calc(var(--angle) + var(--ring-rotation))) translateY(calc(var(--ring-radius) * -1)) rotate(calc((var(--angle) + var(--ring-rotation)) * -1));
            transition: transform var(--ring-transition, 520ms) var(--ring-ease, cubic-bezier(0.2, 0.86, 0.32, 1)), filter 220ms ease;
            cursor: pointer;
            display: grid;
            place-items: center;
            color: #111;
            font-size: 68px;
            line-height: 1;
            padding: 0;
            box-shadow: none;
            isolation: isolate;
        }

        .mood-node.active {
            filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.14));
            transform: translate(-50%, -50%) rotate(calc(var(--angle) + var(--ring-rotation))) translateY(calc(var(--ring-radius) * -1)) rotate(calc((var(--angle) + var(--ring-rotation)) * -1)) scale(2);
        }

        .mood-node:active {
            transform: translate(-50%, -50%) rotate(calc(var(--angle) + var(--ring-rotation))) translateY(calc(var(--ring-radius) * -1)) rotate(calc((var(--angle) + var(--ring-rotation)) * -1)) scale(0.96);
        }

        .picker-confirm {
            margin: 0 auto;
            width: min(92%, 360px);
            text-align: center;
        }

        .picker-confirm .tape {
            font-size: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.16em;
            line-height: 1.15;
            padding: 6px 16px 4px;
            background: linear-gradient(180deg, transparent 62%, var(--accent-soft) 62%);
        }

        .picker-confirm .tape::before,
        .picker-confirm .tape::after {
            top: 62%;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
        }

        .picker-desc {
            margin: 8px 0 0;
            font-family: var(--font-hand);
            font-size: 20px;
            color: #6f6a64;
            line-height: 1.25;
        }

        .tape {
            font-family: var(--font-hand);
            font-size: 36px;
            line-height: 1;
            display: inline-block;
            padding: 4px 8px 2px;
            background: linear-gradient(180deg, transparent 48%, var(--accent-soft) 48%);
            position: relative;
        }

        .tape::before,
        .tape::after {
            content: "";
            position: absolute;
            width: 12px;
            top: 50%;
            transform: translateY(-50%);
            border-top: 13px solid transparent;
            border-bottom: 13px solid transparent;
        }

        .tape::before {
            left: -12px;
            border-right: 12px solid var(--accent-soft);
        }

        .tape::after {
            right: -12px;
            border-left: 12px solid var(--accent-soft);
        }

        .picker-bottom {
            margin-top: 16px;
            padding: 6px 0 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            line-height: 1;
        }

        .icon-btn {
            border: 0;
            background: transparent;
            color: #111;
            cursor: pointer;
            width: 62px;
            height: 62px;
            border-radius: 31px;
            display: grid;
            place-items: center;
        }

        .icon-btn.center-next {
            width: 72px;
            height: 72px;
            font-size: 58px;
        }

        .editor-view {
            background:
                linear-gradient(var(--paper-grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--paper-grid) 1px, transparent 1px);
            background-size: 22px 22px;
            position: relative;
            overflow: hidden;
        }

        .editor-dock {
            margin-top: 6px;
            display: flex;
            flex-direction: column;
            position: relative;
            padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 6px);
        }

        .editor-tools {
            margin-top: 10px;
            padding: 0 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid #c6c6c1;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.58);
        }

        .editor-tools .icon-btn {
            width: 56px;
            height: 56px;
            font-size: 0;
        }

        .editor-tools .icon-btn i {
            font-size: 42px;
            line-height: 1;
        }

        .editor-tools .icon-btn.plus-btn i {
            font-size: 38px;
        }

        .plus-menu {
            position: absolute;
            left: 14px;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 72px);
            width: min(84vw, 340px);
            background: #f4f4ef;
            border: 1px solid #d8d8d2;
            border-radius: 16px;
            box-shadow: 0 14px 26px rgba(0, 0, 0, 0.16);
            overflow: hidden;
            display: none;
            z-index: 48;
        }

        .plus-menu.show {
            display: block;
        }

        .plus-item {
            width: 100%;
            border: 0;
            border-bottom: 1px solid #dfdfda;
            background: transparent;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #131313;
            font-size: 34px;
            font-family: var(--font-hand);
            line-height: 1.05;
            cursor: pointer;
            text-align: left;
        }

        .plus-item:last-child {
            border-bottom: 0;
        }

        .plus-item:active {
            background: #ebebe5;
        }

        .plus-item i {
            font-size: 30px;
            color: #202020;
        }

        .paper {
            margin: 4px auto 0;
            width: 100%;
            flex: 1;
            min-height: 0;
            border: 3px solid var(--paper-border);
            background:
                linear-gradient(var(--paper-grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--paper-grid) 1px, transparent 1px),
                var(--paper);
            background-size: 22px 22px;
            position: relative;
            padding: 10px 14px 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .paper-header {
            display: grid;
            grid-template-columns: 132px 1fr 46px;
            align-items: start;
            gap: 6px;
        }

        .paper-date {
            font-family: var(--font-hand);
            font-size: 32px;
            line-height: 1.05;
            display: flex;
            flex-direction: column;
            gap: 2px;
            color: #181818;
            min-width: 102px;
            justify-self: start;
        }

        .paper-date .weekday {
            font-size: 24px;
            line-height: 1;
            letter-spacing: 0.02em;
        }

        .paper-date .solar {
            font-size: 46px;
            line-height: 0.92;
        }

        .paper-date .lunar {
            font-size: 22px;
            line-height: 1;
            color: #45413d;
            white-space: nowrap;
        }

        .weather-trigger {
            width: 46px;
            height: 46px;
            border: 0;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.35);
            color: #1f1f1f;
            display: grid;
            place-items: center;
            cursor: pointer;
            font-size: 31px;
            line-height: 1;
            transition: transform 120ms ease, background 120ms ease;
            justify-self: end;
        }

        .weather-trigger:hover {
            background: rgba(255, 255, 255, 0.6);
        }

        .weather-trigger:active {
            transform: scale(0.95);
        }

        .paper-hero {
            justify-self: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .paper-emoji {
            margin: 0;
            width: 138px;
            height: 138px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 68px;
            background: transparent;
            cursor: pointer;
            transition: transform 120ms ease;
        }

        .paper-emoji:active {
            transform: scale(0.96);
        }

        .paper-mood-title {
            text-align: center;
            margin-top: 2px;
            font-size: 34px;
        }

        .paper-mood-title .tape {
            cursor: pointer;
            background: transparent;
            padding: 0;
            display: inline-flex;
            align-items: center;
            gap: 0.12em;
            white-space: nowrap;
        }

        .paper-mood-title .tape::before,
        .paper-mood-title .tape::after {
            display: none;
        }

        .write-block {
            margin-top: 8px;
            color: #1d1d1d;
            font-family: var(--font-hand);
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .time-mark {
            font-size: 31px;
            line-height: 1;
            margin-bottom: 6px;
            color: #1b1b1b;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .time-mark i {
            font-size: 24px;
            opacity: 0.92;
        }

        .time-mark .time-value {
            line-height: 1;
        }

        .template-fields {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-right: 2px;
        }

        .quick-fields {
            position: sticky;
            top: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 6px;
            background:
                linear-gradient(var(--paper-grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--paper-grid) 1px, transparent 1px),
                var(--paper);
            background-size: 22px 22px;
        }

        .quick-fields.missing {
            animation: required-shake 360ms ease-in-out 1;
            box-shadow: inset 0 0 0 2px rgba(209, 103, 103, 0.26);
            border-radius: 8px;
        }

        .field-label {
            font-size: 21px;
            line-height: 1;
            color: #7a746e;
        }

        .field-label.required::after {
            content: " *";
            color: #d16767;
            font-size: 0.9em;
        }

        .tag-chips {
            margin-top: 6px;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px;
        }

        .tag-chip {
            border: 2px solid #c8c4be;
            background: #fff;
            color: #46413d;
            border-radius: 12px;
            font-family: var(--font-hand);
            font-size: 19px;
            line-height: 1;
            padding: 9px 4px;
            cursor: pointer;
            transition: all 120ms ease;
            text-align: center;
        }

        .tag-chip.active {
            border-color: #262626;
            background: #262626;
            color: #fff;
        }

        .energy-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #energyInput {
            flex: 1;
            accent-color: #262626;
        }

        .energy-value {
            min-width: 58px;
            text-align: right;
            font-size: 22px;
            line-height: 1;
            color: #5f5953;
        }

        .structured-input {
            width: 100%;
            border: 0;
            background: transparent;
            resize: none;
            outline: none;
            color: inherit;
            font-family: inherit;
            font-size: 22px;
            line-height: 1.5;
            flex: 0 0 auto;
            min-height: 90px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            caret-color: #1d1d1d;
            letter-spacing: 0.01em;
            margin: 0;
            padding: 2px 2px 8px 0;
            color: #1d1d1d;
        }

        .structured-input.what-input {
            min-height: 120px;
        }

        .structured-input.review-input {
            min-height: 120px;
        }

        .attachment-list {
            margin-top: 6px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            min-height: 0;
        }

        .attachment-chip {
            max-width: 100%;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid #d3d3ce;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-family: var(--font-hand);
            color: #44403b;
        }

        .chip-remove {
            border: 0;
            background: transparent;
            color: #8a8580;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
            padding: 0;
        }

        .status-msg {
            display: none;
        }

        .status-msg.error { color: #b64545; }
        .status-msg.ok { color: #2f8a4d; }
        .status-msg.muted { color: #7f7a74; }

        .weather-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.2);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 40;
            padding: 20px;
        }

        .weather-modal.show {
            display: flex;
        }

        .weather-panel {
            width: min(92vw, 360px);
            background: #fff;
            border-radius: 10px;
            padding: 18px 16px 14px;
            box-shadow: 0 18px 36px rgba(0, 0, 0, 0.18);
        }

        .weather-title {
            margin: 0;
            text-align: center;
            font-family: var(--font-hand);
            font-size: 38px;
            line-height: 1;
        }

        .weather-grid {
            margin-top: 12px;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }

        .weather-option {
            width: 100%;
            aspect-ratio: 1 / 1;
            border: 2px solid transparent;
            border-radius: 12px;
            background: transparent;
            display: grid;
            place-items: center;
            color: #111;
            font-size: 30px;
            cursor: pointer;
            transition: border-color 120ms ease, background 120ms ease;
        }

        .weather-option.active {
            border-color: #53a2ff;
            background: #eef5ff;
        }

        .weather-actions {
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .weather-action {
            width: 56px;
            height: 56px;
            border: 0;
            background: transparent;
            font-size: 52px;
            line-height: 1;
            color: #111;
            cursor: pointer;
        }

        .mood-panel {
            width: min(92vw, 360px);
        }

        .mood-grid {
            margin-top: 12px;
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 10px;
        }

        .mood-option {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            border: 2px solid transparent;
            background: var(--mood-color, #f4b8b8);
            font-size: 28px;
            display: grid;
            place-items: center;
            cursor: pointer;
        }

        .mood-option.active {
            border-color: #53a2ff;
            box-shadow: 0 0 0 3px rgba(83, 162, 255, 0.18);
        }

        .sticker-grid {
            margin-top: 12px;
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 10px;
        }

        .sticker-option {
            width: 100%;
            aspect-ratio: 1 / 1;
            border: 2px solid transparent;
            border-radius: 10px;
            background: #f3f3ee;
            display: grid;
            place-items: center;
            font-size: 30px;
            cursor: pointer;
        }

        .sticker-option:active {
            border-color: #53a2ff;
            background: #eef5ff;
        }

        .hold-tip {
            position: fixed;
            left: 50%;
            top: 42%;
            transform: translate(-50%, -50%);
            background: rgba(17, 17, 17, 0.88);
            color: #fff;
            padding: 9px 14px;
            border-radius: 10px;
            font-size: 21px;
            font-family: var(--font-hand);
            pointer-events: none;
            opacity: 0;
            transition: opacity 160ms ease;
            z-index: 20;
            white-space: nowrap;
        }

        .hold-tip.show { opacity: 1; }

        .submit-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.16);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 90;
            padding: 20px;
        }

        .submit-overlay.show {
            display: flex;
        }

        .submit-card {
            width: min(86vw, 300px);
            border-radius: 20px;
            border: 2px solid rgba(28, 28, 28, 0.14);
            background: rgba(250, 250, 247, 0.95);
            box-shadow: 0 16px 34px rgba(0, 0, 0, 0.2);
            padding: 18px 16px 14px;
            text-align: center;
        }

        .submit-emoji {
            font-size: 48px;
            line-height: 1;
            animation: submit-pop 900ms ease-in-out infinite;
            transform-origin: center bottom;
        }

        .submit-text {
            margin-top: 10px;
            font-family: var(--font-hand);
            font-size: 26px;
            color: #2f2b28;
            line-height: 1.15;
        }

        .submit-dots {
            margin-top: 10px;
            display: inline-flex;
            gap: 6px;
        }

        .submit-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #313131;
            opacity: 0.24;
            animation: submit-dot 800ms ease-in-out infinite;
        }

        .submit-dots span:nth-child(2) { animation-delay: 120ms; }
        .submit-dots span:nth-child(3) { animation-delay: 240ms; }

        .submit-overlay.success .submit-emoji {
            animation: none;
            filter: drop-shadow(0 4px 8px rgba(34, 128, 64, 0.25));
        }

        .submit-overlay.error .submit-emoji {
            animation: submit-shake 340ms ease-in-out 1;
        }

        .submit-overlay.success .submit-dots,
        .submit-overlay.error .submit-dots {
            display: none;
        }

        @keyframes submit-pop {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-4px) scale(1.08); }
        }

        @keyframes submit-dot {
            0%, 100% { opacity: 0.24; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-2px); }
        }

        @keyframes submit-shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-4px); }
            40% { transform: translateX(4px); }
            60% { transform: translateX(-3px); }
            80% { transform: translateX(3px); }
        }

        @keyframes required-shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-3px); }
            50% { transform: translateX(3px); }
            75% { transform: translateX(-2px); }
        }

        @media (max-width: 390px) {
            .mood-ring { --ring-radius: 142px; }
            .mood-node { width: 86px; height: 86px; font-size: 56px; }
            .tape { font-size: 30px; }
            .wheel-wrap { height: clamp(300px, 48vh, 340px); min-height: 300px; }
            .picker-confirm .tape { font-size: 30px; }
            .picker-desc { font-size: 18px; }
            .paper { min-height: 0; }
            .paper-date { font-size: 28px; }
            .paper-date .weekday { font-size: 22px; }
            .paper-date .solar { font-size: 42px; }
            .paper-date .lunar { font-size: 18px; }
            .paper-emoji { width: 126px; height: 126px; font-size: 58px; margin-top: 0; }
            .paper-mood-title { font-size: 30px; }

        function getShanghaiDateParts(date = new Date()) {
            const formatter = new Intl.DateTimeFormat("zh-CN", {
                timeZone: APP_TZ,
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                weekday: "short"
            });
            const parts = formatter.formatToParts(date);
            const map = {};
            parts.forEach((part) => {
                map[part.type] = part.value;
            });
            return {
                dateLabel: `${map.year}-${map.month}-${map.day}`,
                weekday: map.weekday || ""
            };
        }

        function splitBulletItems(text) {
            return String(text || "")
                .split(/\r?\n/)
                .map((line) => line.replace(/^\s*[*-]\s*/, "").trim())
                .filter(Boolean);
        }

        function formatPaperDate(date = new Date()) {
            const dateParts = getShanghaiDateParts(date);
            const [, monthPart = "01", dayPart = "01"] = dateParts.dateLabel.split("-");
            const month = monthPart;
            const day = dayPart;
            const weekday = dateParts.weekday;

            let lunarLabel = "农历--";

                const lunarRaw = new Intl.DateTimeFormat("zh-CN-u-ca-chinese", {

                }).format(date);

            paperDate.innerHTML = `

        }

        function normalizeDegrees(value) {
            let normalized = value % 360;
            if (normalized < 0) normalized += 360;
            return normalized;
        }

        function shortestDelta(current, target) {
            return ((target - current + 540) % 360) - 180;
        }

        function clearRingSpinTimer() {
            if (ringSpinTimer) {
                clearTimeout(ringSpinTimer);
                ringSpinTimer = null;
            }
        }

        function resetRingMotionStyle() {
            moodRing.style.removeProperty("--ring-transition");
            moodRing.style.removeProperty("--ring-ease");
        }

        function cancelRingSpin() {
            clearRingSpinTimer();
            isRingSpinning = false;
            resetRingMotionStyle();

        function pickRandomMoodId(excludeId = "") {
            const pool = moods.filter((mood) => mood.id !== excludeId);
            const source = pool.length ? pool : moods;
            return source[Math.floor(Math.random() * source.length)].id;
        }

        function getRingPointerAngle(clientX, clientY) {
            const rect = moodRing.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const angle = Math.atan2(clientY - cy, clientX - cx) * (180 / Math.PI) + 90;
            return normalizeDegrees(angle);
        }

        function getMoodClosestToBottom(rotationDeg = ringRotationDeg) {
            const normalizedRotation = normalizeDegrees(rotationDeg);
            let bestMoodId = selectedMoodId;
            let minDistance = Number.POSITIVE_INFINITY;

            moods.forEach((mood) => {
                const nodeAngle = normalizeDegrees(mood.angle + normalizedRotation);
                const distanceToBottom = Math.abs(shortestDelta(nodeAngle, 180));
                if (distanceToBottom < minDistance) {
                    minDistance = distanceToBottom;
                    bestMoodId = mood.id;
                }
            });

            return bestMoodId;
        }

        function startRingDrag(event) {
            if (event.button !== undefined && event.button !== 0) return;
            cancelRingSpin();
            ringDrag.active = true;
            ringDrag.pointerId = event.pointerId;
            ringDrag.startAngle = getRingPointerAngle(event.clientX, event.clientY);
            ringDrag.startRotation = ringRotationDeg;
            ringDrag.moved = false;
            ringDrag.lastAngle = ringDrag.startAngle;
            ringDrag.lastTs = performance.now();
            ringDrag.velocity = 0;
            moodRing.classList.add("dragging", "instant-rotate");
            try {
                moodRing.setPointerCapture(event.pointerId);
            } catch (err) {
                console.debug("Pointer capture unavailable:", err);
            }
        }

        function moveRingDrag(event) {
            if (!ringDrag.active || event.pointerId !== ringDrag.pointerId) return;
            const now = performance.now();
            const currentAngle = getRingPointerAngle(event.clientX, event.clientY);
            const delta = shortestDelta(ringDrag.startAngle, currentAngle);
            const nextRotation = ringDrag.startRotation + delta;
            const step = shortestDelta(ringDrag.lastAngle, currentAngle);
            const dt = Math.max(1, now - ringDrag.lastTs);
            ringDrag.velocity = step / dt;
            ringDrag.lastAngle = currentAngle;
            ringDrag.lastTs = now;
            if (Math.abs(delta) > 2) {
                ringDrag.moved = true;
                clearTimeout(holdTimer);
                hideHoldTip();
            }
            moodRing.style.setProperty("--ring-rotation", `${nextRotation}deg`);
            ringRotationDeg = nextRotation;
            const previewMoodId = getMoodClosestToBottom(nextRotation);
            moodRing.querySelectorAll(".mood-node").forEach((node) => {
                node.classList.toggle("active", node.dataset.id === previewMoodId);
            });
            event.preventDefault();
        }

            isRingSpinning = true;
            ignoreNodeClickUntil = Date.now() + 1000;
            const direction = velocityDegPerMs === 0
                ? (Math.random() < 0.5 ? 1 : -1)

            const speed = Math.min(1.2, Math.abs(velocityDegPerMs));
            const extraTurns = Math.max(1, Math.min(4, 1 + Math.round(speed * 6)));
            const targetMoodId = pickRandomMoodId(selectedMoodId);
            const targetMood = moods.find((item) => item.id === targetMoodId);
            if (!targetMood) {
                isRingSpinning = false;
                return;
            }

            const targetRotation = normalizeDegrees(180 - targetMood.angle);
            const currentNormalized = normalizeDegrees(ringRotationDeg);
            const directedDelta = direction > 0
                ? (targetRotation - currentNormalized + 360) % 360
                : -((currentNormalized - targetRotation + 360) % 360);
            const destination = ringRotationDeg + directedDelta + direction * extraTurns * 360;
            const durationMs = Math.round(900 + extraTurns * 220 + speed * 320);

            moodRing.classList.remove("instant-rotate");
            moodRing.style.setProperty("--ring-transition", `${durationMs}ms`);
            moodRing.style.setProperty("--ring-ease", "cubic-bezier(0.08, 0.8, 0.16, 1)");
            moodRing.style.setProperty("--ring-rotation", `${destination}deg`);
            ringRotationDeg = destination;

            ringSpinTimer = setTimeout(() => {
                selectedMoodId = targetMoodId;
                updateMoodUI(false);
                saveDraft();
                isRingSpinning = false;
                resetRingMotionStyle();
                ringSpinTimer = null;
            }, durationMs + 30);
        }

            moodRing.classList.remove("dragging", "instant-rotate");
            if (ringDrag.moved) {
                spinRingToRandomMood(ringDrag.velocity);
            }
            try {
                moodRing.releasePointerCapture(event.pointerId);

                console.debug("Pointer release unavailable:", err);

            ringDrag.pointerId = null;
        }

            const mood = moods.find((item) => item.id === moodId);

            const nextRotation = animate
                ? ringRotationDeg + shortestDelta(ringRotationDeg, targetRotation)
                : targetRotation;

            if (!animate) moodRing.classList.add("instant-rotate");
            moodRing.style.setProperty("--ring-rotation", `${nextRotation}deg`);
            ringRotationDeg = nextRotation;
            if (!animate) {
                moodRing.offsetHeight;
                moodRing.classList.remove("instant-rotate");
            }
        }

            if (size < 1024) return `${size}B`;

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const result = reader.result;
                    if (typeof result !== "string") {
                        reject(new Error("读取文件失败"));
                        return;
                    }
                    const commaIndex = result.indexOf(",");
                    if (commaIndex === -1) {
                        reject(new Error("文件编码失败"));
                        return;
                    }
                    resolve(result.slice(commaIndex + 1));
                };
                reader.onerror = () => reject(new Error("文件读取异常"));
                reader.readAsDataURL(file);
            });
        }

        function insertTextAtCursor(text) {
            const targetInput = document.activeElement === reviewText ? reviewText : entryText;
            const value = targetInput.value;
            const start = targetInput.selectionStart ?? value.length;

            targetInput.value = `${value.slice(0, start)}${text}${value.slice(end)}`;
            const nextPos = start + text.length;
            targetInput.setSelectionRange(nextPos, nextPos);
            targetInput.focus();
        }

        async function addAttachment(kind, file) {
            if (!file) return;
            const fileSize = Number(file.size) || 0;
            if (fileSize > MAX_SINGLE_ATTACHMENT_BYTES) {
                setStatus(`单个文件不能超过 ${formatFileSize(MAX_SINGLE_ATTACHMENT_BYTES)}`, "error");
                return;
            }
            if (getTotalAttachmentSize() + fileSize > MAX_TOTAL_ATTACHMENT_BYTES) {
                setStatus(`附件总大小不能超过 ${formatFileSize(MAX_TOTAL_ATTACHMENT_BYTES)}`, "error");
                return;
            }

            const safeName = file.name || "未命名文件";
            const mimeType = file.type || "application/octet-stream";
            let base64 = "";
            try {
                base64 = await fileToBase64(file);
            } catch (err) {
                setStatus("文件读取失败，请重试", "error");
                return;
            }

            attachments.push({
                id: `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
                kind,
                name: safeName,
                size: fileSize,
                mimeType,
                base64
            });

            const label = attachmentMeta[kind]?.label || "附件";
            insertTextAtCursor(`\n[${label}] ${safeName}\n`);
            renderAttachmentList();
            saveDraft();
            setStatus(`${label}已添加`, "muted");
        }

        function restoreDraft() {
            const raw = localStorage.getItem(DRAFT_KEY);

            try {

                if (data && typeof data === "object") {
                    if (typeof data.moodId === "string") selectedMoodId = data.moodId;
                    if (typeof data.weatherId === "string") selectedWeatherId = data.weatherId;
                    if (typeof data.text === "string") entryText.value = data.text;
                    if (typeof data.reviewText === "string") reviewText.value = data.reviewText;
                    if (typeof data.tag === "string" && TAG_OPTIONS.includes(data.tag)) selectedTag = data.tag;
                    if (Array.isArray(data.tags) && !selectedTag) {
                        const oldTag = data.tags.map((item) => String(item || "").trim()).find((item) => TAG_OPTIONS.includes(item));
                        if (oldTag) selectedTag = oldTag;

                    if (data.energy !== undefined) energyLevel = normalizeEnergy(data.energy);
                    if (typeof data.tagSelectedForEntry === "boolean") {
                        tagSelectedForEntry = data.tagSelectedForEntry;

                        tagSelectedForEntry = selectedTag !== "";
                    }
                    if (typeof data.energySelectedForEntry === "boolean") {
                        energySelectedForEntry = data.energySelectedForEntry;
                    } else {
                        energySelectedForEntry = false;
                    }
                }
            } catch (err) {
                console.warn("Draft parse failed:", err);

        async function submitDiary() {
            if (isSubmitting) return;
            const missingTag = !selectedTag || !tagSelectedForEntry;
            const missingEnergy = !energySelectedForEntry;
            if (missingTag || missingEnergy) {
                nudgeRequiredFields();
                let hint = "先把必选项选一下呀～";
                if (missingTag && missingEnergy) hint = "先选标签并拖一下精力值吧～ ✨";
                else if (missingTag) hint = "先点一个标签再继续呀～ 🏷️";
                else if (missingEnergy) hint = "拖一下精力值滑杆再提交呀～ ⚡";
                setStatus(hint, "error");
                showSubmitOverlay("error", hint);
                await sleep(1200);
                hideSubmitOverlay();
                return;
            }
            const whatText = entryText.value.trim();
            const review = reviewText.value.trim();
            if (!whatText && !review && attachments.length === 0) {
                setStatus("请至少填写“今日记录”或“思考与复盘”", "error");
                return;
            }

            setSubmitting(true);
            setStatus("提交中...", "muted");
            showSubmitOverlay("loading", "正在把今天写进日记本...");
            saveDraft();

            const selectedMood = getSelectedMood();
            const selectedWeather = getSelectedWeather();
            const panelDate = getPanelDateInfo();
            const panelTime = getPanelTimeMark();
            const templateText = composeStandardTemplate();
            const requestBody = JSON.stringify({
                content: templateText,
                formattedEntry: templateText,
                rawText: [whatText, review].filter(Boolean).join("\n"),
                whatText,
                reviewText: review,
                tags: selectedTag ? [selectedTag] : [],
                energy: normalizeEnergy(energyLevel),
                mood: {
                    id: selectedMood.id,
                    emoji: selectedMood.emoji,
                    title: selectedMood.title
                },
                weather: {
                    id: selectedWeather.id,
                    label: selectedWeather.label
                },
                panelDate,
                panelTime,
                attachments: attachments.map((item) => ({
                    id: item.id,
                    kind: item.kind,
                    name: item.name,
                    size: item.size,
                    mimeType: item.mimeType || "application/octet-stream",
                    base64: item.base64 || ""
                }))
            });
            const requestBytes = new TextEncoder().encode(requestBody).length;
            if (requestBytes > 24 * 1024 * 1024) {
                setStatus("上传内容过大，请减少附件后重试", "error");
                showSubmitOverlay("error", "内容太大啦，精简一点再试");
                await sleep(1100);
                hideSubmitOverlay();
                setSubmitting(false);
                return;
            }
            const payloadMb = requestBytes / (1024 * 1024);
            const estimatedTimeoutMs = Math.min(
                MAX_REQUEST_TIMEOUT_MS,
                Math.max(
                    REQUEST_TIMEOUT_MS,
                    Math.ceil(payloadMb * 22000) + 40000
                )
            );
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), estimatedTimeoutMs);
            const start = performance.now();

            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: requestBody,
                    cache: "no-store",
                    signal: controller.signal
                });

                const rawText = await response.text();
                let result = null;
                try {
                    result = rawText ? JSON.parse(rawText) : null;
                } catch (err) {
                    console.warn("Non-JSON response:", rawText);
                }

                if (!response.ok) {
                    if (response.status === 401) {
                        setStatus("401 未授权，请检查 Apps Script 访问权限", "error");
                        showSubmitOverlay("error", "未授权，请检查脚本权限");
                    } else {
                        setStatus(`请求失败：HTTP ${response.status}`, "error");
                        showSubmitOverlay("error", `请求失败：HTTP ${response.status}`);
                    }
                    await sleep(1200);
                    hideSubmitOverlay();
                    return;
                }

                if (result && result.status === "success") {
                    const elapsed = Math.round(performance.now() - start);
                    setStatus(`提交成功 ${elapsed}ms，正在返回首页...`, "ok");
                    showSubmitOverlay("success", `提交成功 ${elapsed}ms`);
                    await new Promise((resolve) => setTimeout(resolve, SUCCESS_REDIRECT_DELAY_MS));
                    entryText.value = "";
                    reviewText.value = "";
                    selectedTag = "";
                    energyLevel = DEFAULT_ENERGY;
                    tagSelectedForEntry = false;
                    energySelectedForEntry = false;
                    attachments = [];
                    renderTagChips();
                    updateEnergyUI();
                    renderAttachmentList();
                    localStorage.removeItem(DRAFT_KEY);
                    showPicker();
                    setStatus("准备记录", "muted");
                    hideSubmitOverlay();
                } else {
                    setStatus("提交失败，服务端返回异常", "error");
                    showSubmitOverlay("error", "服务端返回异常，请重试");
                    await sleep(1200);
                    hideSubmitOverlay();
                }
            } catch (err) {
                if (err && err.name === "AbortError") {
                    setStatus("请求超时，请重试", "error");
                    showSubmitOverlay("error", "请求超时，请重试");
                } else {
                    const msg = (err && err.message) ? `网络错误：${String(err.message).slice(0, 60)}` : "网络错误，请检查连接";
                    setStatus(msg, "error");
                    console.error("Submit failed:", err);
                    showSubmitOverlay("error", "网络有点慢，稍后再试");
                }
                await sleep(1200);
                hideSubmitOverlay();
            } finally {
                clearTimeout(timer);
                if (submitOverlay?.dataset?.mode === "loading") hideSubmitOverlay();
                setSubmitting(false);
            }
        }

            if (event.key === "Escape" && plusMenu.classList.contains("show")) {
                closePlusMenu();
            }
            if (event.key === "Escape" && weatherModal.classList.contains("show")) {
                closeWeatherModal(false);
            }
            if (event.key === "Escape" && moodModal.classList.contains("show")) {
                closeMoodModal(false);
            }
            if (event.key === "Escape" && stickerModal.classList.contains("show")) {
                closeStickerModal();
            }
        });

        if (restoreViewState() === "editor") {
            showEditor();
        }
    </script>
</body>
</html>
