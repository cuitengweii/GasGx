        function formatFileSize(size = 0) {
            if (size < 1024) return `${size}B`;
            if (size < 1024 * 1024) return `${Math.round(size / 1024)}KB`;
            return `${(size / (1024 * 1024)).toFixed(1)}MB`;
        }

        function getTotalAttachmentSize() {
            return attachments.reduce((total, item) => total + (Number(item.size) || 0), 0);
        }

        function isImageAttachmentForFinance(item) {
            if (!item) return false;
            const mime = String(item.mimeType || "").toLowerCase();
            const name = String(item.name || "").toLowerCase();
            if (mime.startsWith("image/")) return true;
            return /\.(png|jpe?g|webp|bmp|gif|heic|heif)$/.test(name);
        }

        function isHeicLikeFile(file) {
            if (!file) return false;
            const mime = String(file.type || file.mimeType || "").toLowerCase();
            const name = String(file.name || "").toLowerCase();
            return /image\/hei[cf]/.test(mime) || /\.(heic|heif)$/.test(name);
        }

        async function convertHeicToJpegIfNeeded(file) {
            if (!isHeicLikeFile(file)) return file;
            if (typeof window.heic2any !== "function") {
                throw new Error("HEIC 转换组件加载失败，请刷新页面后重试");
            }
            const converted = await window.heic2any({
                blob: file,
                toType: "image/jpeg",
                quality: 0.92
            });
            const outBlob = Array.isArray(converted) ? converted[0] : converted;
            if (!(outBlob instanceof Blob)) {
                throw new Error("HEIC 转 JPG 失败，请改用 PNG/JPG 重试");
            }

            const baseName = String(file.name || "image").replace(/\.(heic|heif)$/i, "");
            const outName = `${baseName}.jpg`;
            try {
                return new File([outBlob], outName, {
                    type: "image/jpeg",
                    lastModified: Date.now()
                });
            } catch (err) {
                return Object.assign(outBlob, {
                    name: outName,
                    lastModified: Date.now()
                });
            }
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const result = reader.result;
                    if (typeof result !== "string") {
                        reject(new Error("读取文件失败"));
                        return;
                    }
                    const commaIndex = result.indexOf(",");
                    if (commaIndex === -1) {
                        reject(new Error("文件编码失败"));
                        return;
                    }
                    resolve(result.slice(commaIndex + 1));
                };
                reader.onerror = () => reject(new Error("文件读取异常"));
                reader.readAsDataURL(file);
            });
        }

        function insertTextAtCursor(text) {
            const targetInput = document.activeElement === reviewText ? reviewText : entryText;
            const value = targetInput.value;
            const start = targetInput.selectionStart ?? value.length;
            const end = targetInput.selectionEnd ?? value.length;
            targetInput.value = `${value.slice(0, start)}${text}${value.slice(end)}`;
            const nextPos = start + text.length;
            targetInput.setSelectionRange(nextPos, nextPos);
            targetInput.focus();
        }

        function getActiveEditorInput() {
            if (document.activeElement === reviewText) return reviewText;
            if (document.activeElement === entryText) return entryText;
            return lastEditorInput || entryText;
        }

        function normalizeListLine(text) {
            return String(text || "")
                .replace(LIST_PREFIX_REGEX, "")
                .trim();
        }

        function getLineRangeAt(value, position) {
            const safeValue = String(value || "");
            const pos = Math.max(0, Math.min(Number(position) || 0, safeValue.length));
            const lineStart = safeValue.lastIndexOf("\n", Math.max(0, pos - 1)) + 1;
            let lineEnd = safeValue.indexOf("\n", pos);
            if (lineEnd === -1) lineEnd = safeValue.length;
            return {
                lineStart,
                lineEnd,
                lineText: safeValue.slice(lineStart, lineEnd)
            };
        }

        function rememberEditorSelection(input, options = {}) {
            if (!input) return;
            const force = Boolean(options && options.force);
            const hasStored =
                Number.isFinite(Number(input.dataset.selStart)) &&
                Number.isFinite(Number(input.dataset.selEnd));
            if (!force && document.activeElement !== input && hasStored) {
                // iOS 点工具栏会先失焦，避免被浏览器重置的 0 覆盖真实光标。
                return;
            }
            const value = String(input.value || "");
            const rawStart = Number.isFinite(input.selectionStart)
                ? input.selectionStart
                : Number(input.dataset.selStart);
            const rawEnd = Number.isFinite(input.selectionEnd)
                ? input.selectionEnd
                : Number(input.dataset.selEnd);
            const start = Number.isFinite(rawStart)
                ? Math.max(0, Math.min(rawStart, value.length))
                : value.length;
            const end = Number.isFinite(rawEnd)
                ? Math.max(0, Math.min(rawEnd, value.length))
                : start;
            input.dataset.selStart = String(start);
            input.dataset.selEnd = String(end);
        }

        function getEditorSelection(input) {
            const value = String(input.value || "");
            const liveStart = Number.isFinite(input.selectionStart) ? input.selectionStart : NaN;
            const liveEnd = Number.isFinite(input.selectionEnd) ? input.selectionEnd : NaN;
            const storedStart = Number(input.dataset.selStart);
            const storedEnd = Number(input.dataset.selEnd);
            const preferStored = document.activeElement !== input;
            const rawStart = preferStored && Number.isFinite(storedStart)
                ? storedStart
                : (Number.isFinite(liveStart) ? liveStart : storedStart);
            const rawEnd = preferStored && Number.isFinite(storedEnd)
                ? storedEnd
                : (Number.isFinite(liveEnd) ? liveEnd : storedEnd);
            let start = Number.isFinite(rawStart) ? rawStart : value.length;
            let end = Number.isFinite(rawEnd) ? rawEnd : start;
            start = Math.max(0, Math.min(start, value.length));
            end = Math.max(0, Math.min(end, value.length));
            if (end < start) {
                const temp = start;
                start = end;
                end = temp;
            }
            return { start, end };
        }

        function parseTodoLine(lineText) {
            const line = String(lineText || "");
            const bracketMatch = line.match(TODO_BRACKET_LINE_REGEX);
            if (bracketMatch) {
                const bracketToken = String(bracketMatch[2] || "");
                const marker = bracketToken
                    .replace(/^\[\s*/, "")
                    .replace(/\s*\]$/, "")
                    .replace(/[\uFE0E\uFE0F]/g, "")
                    .trim();
                return {
                    indent: String(bracketMatch[1] || ""),
                    checked: marker.length > 0,
                    body: String(bracketMatch[3] || "")
                };
            }
            const symbolMatch = line.match(TODO_SYMBOL_LINE_REGEX);
            if (!symbolMatch) return null;
            const symbolRaw = String(symbolMatch[2] || "");
            const symbolNormalized = symbolRaw.replace(/[\uFE0E\uFE0F]/g, "");
            return {
                indent: String(symbolMatch[1] || ""),
                checked: !/^(?:☐|□)$/u.test(symbolNormalized),
                body: String(symbolMatch[3] || "")
            };
        }

        function getTodoCheckboxSpan(lineText) {
            const line = String(lineText || "");
            const indentMatch = line.match(/^(\s*)/);
            const indentLen = indentMatch ? String(indentMatch[1] || "").length : 0;
            let cursor = indentLen;

            if (line[cursor] === "-") {
                cursor += 1;
                while (line[cursor] === " ") cursor += 1;
            }

            const remaining = line.slice(cursor);
            const markdownBox = remaining.match(TODO_BRACKET_HEAD_REGEX);
            if (markdownBox) {
                const token = String(markdownBox[0] || "");
                return { start: cursor, end: cursor + token.length };
            }

            const symbolBox = remaining.match(TODO_SYMBOL_HEAD_REGEX);
            if (symbolBox) {
                const token = String(symbolBox[0] || "");
                return { start: cursor, end: cursor + token.length };
            }
            return null;
        }

        function toggleTodoAtTapPosition(input) {
            if (!input) return false;
            const value = String(input.value || "");
            const { start, end } = getEditorSelection(input);
            if (start !== end) return false;
            const { lineStart, lineText } = getLineRangeAt(value, start);
            const checkboxSpan = getTodoCheckboxSpan(lineText);
            if (!checkboxSpan) return false;

            const caretOffset = Math.max(0, start - lineStart);
            const lowerBound = Math.max(0, checkboxSpan.start - 1);
            const upperBound = checkboxSpan.end + 2;
            if (caretOffset < lowerBound || caretOffset > upperBound) return false;

            return toggleTodoAtCursor(input);
        }

        function handleEditorClick(event, input) {
            if (!input) return;
            if (event && typeof event.button === "number" && event.button !== 0) return;
            setTimeout(() => {
                const toggled = toggleTodoAtTapPosition(input);
                if (!toggled) {
                    rememberEditorSelection(input);
                }
            }, 0);
        }

        function isInputNearBottom(input, threshold = 26) {
            if (!input) return false;
            return (input.scrollTop + input.clientHeight) >= (input.scrollHeight - threshold);
        }

        function ensureEditorCaretVisible(input, forceBottom = false) {
            if (!input) return;
            const run = () => {
                const value = String(input.value || "");
                const caret = Math.max(0, Math.min(input.selectionStart ?? value.length, value.length));
                const hasLiveSelection = Number.isFinite(input.selectionStart) && Number.isFinite(input.selectionEnd);
                const selectionCollapsed = hasLiveSelection ? input.selectionStart === input.selectionEnd : true;
                const nearTextTail = selectionCollapsed && (value.length - caret) <= 2;
                const maxScrollTop = Math.max(0, input.scrollHeight - input.clientHeight);

                // iOS Chinese keyboard may hide caret on soft-wrapped lines near tail.
                if (forceBottom || nearTextTail) {
                    input.scrollTop = maxScrollTop;
                    return;
                }

                const style = window.getComputedStyle(input);
                const lineHeight = parseFloat(style.lineHeight) || 24;
                const paddingTop = parseFloat(style.paddingTop) || 0;
                const paddingBottom = parseFloat(style.paddingBottom) || 0;
                const lineIndex = value.slice(0, caret).split("\n").length - 1;
                const caretTop = paddingTop + Math.max(0, lineIndex) * lineHeight;
                const viewTop = input.scrollTop;
                const viewBottom = viewTop + input.clientHeight - lineHeight * 1.15 - paddingBottom;

                if (forceBottom || caretTop > viewBottom) {
                    input.scrollTop = Math.max(0, caretTop - input.clientHeight + lineHeight * 2 + paddingBottom);
                    return;
                }
                if (caretTop < (viewTop + lineHeight * 0.3)) {
                    input.scrollTop = Math.max(0, caretTop - lineHeight);
                }
            };
            if (typeof requestAnimationFrame === "function") {
                requestAnimationFrame(run);
            } else {
                setTimeout(run, 0);
            }
        }

        function replaceSelection(input, start, end, text, options = {}) {
            const value = String(input.value || "");
            input.value = `${value.slice(0, start)}${text}${value.slice(end)}`;
            const nextPos = start + text.length;
            input.focus();
            input.setSelectionRange(nextPos, nextPos);
            rememberEditorSelection(input);
            lastEditorInput = input === reviewText ? reviewText : entryText;
            ensureEditorCaretVisible(input, Boolean(options.forceBottom));
        }

        function toggleTodoAtCursor(input) {
            const value = String(input.value || "");
            const { start: cursor } = getEditorSelection(input);
            const { lineStart, lineEnd, lineText } = getLineRangeAt(value, cursor);
            const parsed = parseTodoLine(lineText);
            if (!parsed) return false;
            const nextChecked = !parsed.checked;
            const body = String(parsed.body || "").trim();
            const nextPrefix = `${parsed.indent}${nextChecked ? TODO_CHECKED_SYMBOL : TODO_UNCHECKED_SYMBOL}`;
            const nextLine = body ? `${nextPrefix} ${body}` : nextPrefix;
            input.value = `${value.slice(0, lineStart)}${nextLine}${value.slice(lineEnd)}`;
            const nextCursor = Math.max(lineStart, cursor + (nextLine.length - lineText.length));
            input.focus();
            input.setSelectionRange(nextCursor, nextCursor);
            rememberEditorSelection(input);
            lastEditorInput = input === reviewText ? reviewText : entryText;
            ensureEditorCaretVisible(input);
            saveDraft();
            setStatus(nextChecked ? "已勾选" : "已取消勾选", "muted");
            return true;
        }

        function handleSmartListEnter(event, input) {
            if (!event || event.key !== "Enter" || event.isComposing || event.defaultPrevented) return;
            if (event.shiftKey || event.ctrlKey || event.metaKey || event.altKey) return;

            const value = String(input.value || "");
            const { start, end } = getEditorSelection(input);
            if (start !== end) return;
            const { lineText } = getLineRangeAt(value, start);
            const nearBottom = isInputNearBottom(input);

            const orderedMatch = lineText.match(/^(\s*)(\d+)([.)])\s*(.*)$/);
            if (orderedMatch) {
                const body = String(orderedMatch[4] || "").trim();
                const nextNumber = Number(orderedMatch[2]) + 1;
                const insert = body ? `\n${orderedMatch[1]}${nextNumber}${orderedMatch[3]} ` : "\n";
                event.preventDefault();
                replaceSelection(input, start, end, insert, { forceBottom: nearBottom });
                saveDraft();
                return;
            }

            const todoInfo = parseTodoLine(lineText);
            if (todoInfo) {
                const body = String(todoInfo.body || "").trim();
                const insert = body ? `\n${todoInfo.indent}${TODO_UNCHECKED_SYMBOL} ` : "\n";
                event.preventDefault();
                replaceSelection(input, start, end, insert, { forceBottom: nearBottom });
                saveDraft();
                return;
            }

            const bulletMatch = lineText.match(/^(\s*)[-*]\s+(.*)$/);
            if (bulletMatch) {
                const body = String(bulletMatch[2] || "").trim();
                const insert = body ? `\n${bulletMatch[1]}- ` : "\n";
                event.preventDefault();
                replaceSelection(input, start, end, insert, { forceBottom: nearBottom });
                saveDraft();
            }
        }

        function buildListLine(mode, content, index) {
            const body = String(content || "").trim();
            if (mode === "ordered") return `${index + 1}. ${body}`.trimEnd();
            if (mode === "todo") return body ? `${TODO_UNCHECKED_SYMBOL} ${body}` : TODO_UNCHECKED_SYMBOL;
            return body ? `- ${body}` : "-";
        }

        function applyListTemplate(mode) {
            const modeLabelMap = {
                ordered: "有序列表",
                bullet: "无序列表",
                todo: "勾选记录"
            };
            const prefixMap = {
                ordered: "1. ",
                bullet: "- ",
                todo: `${TODO_UNCHECKED_SYMBOL} `
            };
            if (!prefixMap[mode]) return;

            const targetInput = getActiveEditorInput();
            const value = targetInput.value || "";
            const { start, end } = getEditorSelection(targetInput);
            if (mode === "todo" && toggleTodoAtCursor(targetInput)) {
                return;
            }
            const lineStart = value.lastIndexOf("\n", Math.max(0, start - 1)) + 1;
            let lineEnd = value.indexOf("\n", end);
            if (lineEnd === -1) lineEnd = value.length;
            const block = value.slice(lineStart, lineEnd);

            let nextBlock = "";
            if (!block.trim()) {
                nextBlock = prefixMap[mode];
            } else {
                const rows = block.split("\n");
                nextBlock = rows
                    .map((row, idx) => buildListLine(mode, normalizeListLine(row), idx))
                    .join("\n");
            }

            targetInput.value = `${value.slice(0, lineStart)}${nextBlock}${value.slice(lineEnd)}`;
            targetInput.focus();
            const nextCursor = lineStart + nextBlock.length;
            targetInput.setSelectionRange(nextCursor, nextCursor);
            rememberEditorSelection(targetInput);
            ensureEditorCaretVisible(targetInput, isInputNearBottom(targetInput));
            saveDraft();
            setStatus(`已应用${modeLabelMap[mode]}`, "muted");
        }

        function renderAttachmentList() {
            attachmentList.innerHTML = "";
            attachments.forEach((item, index) => {
                const chip = document.createElement("div");
                chip.className = "attachment-chip";

                const label = attachmentMeta[item.kind]?.label || "附件";
                const icon = attachmentMeta[item.kind]?.icon || "📎";
                const text = document.createElement("span");
                text.textContent = `${icon} ${label}: ${item.name} (${formatFileSize(item.size)})`;

                const removeBtn = document.createElement("button");
                removeBtn.type = "button";
                removeBtn.className = "chip-remove";
                removeBtn.dataset.index = String(index);
                removeBtn.setAttribute("aria-label", `删除 ${item.name}`);
                removeBtn.textContent = "✕";

                chip.append(text, removeBtn);
                attachmentList.appendChild(chip);
            });
        }

        async function addAttachment(kind, file) {
            if (!file) return;
            let normalizedFile = file;
            let heicConverted = false;
            if (isHeicLikeFile(file)) {
                setStatus("正在转换 HEIC 截图...", "muted");
                try {
                    normalizedFile = await convertHeicToJpegIfNeeded(file);
                    heicConverted = true;
                } catch (err) {
                    const msg = (err && err.message) ? String(err.message) : "HEIC 转换失败，请改用 PNG/JPG";
                    setStatus(msg, "error");
                    return;
                }
            }

            const fileSize = Number(normalizedFile.size) || 0;
            if (fileSize > MAX_SINGLE_ATTACHMENT_BYTES) {
                setStatus(`单个文件不能超过 ${formatFileSize(MAX_SINGLE_ATTACHMENT_BYTES)}`, "error");
                return;
            }
            if (getTotalAttachmentSize() + fileSize > MAX_TOTAL_ATTACHMENT_BYTES) {
                setStatus(`附件总大小不能超过 ${formatFileSize(MAX_TOTAL_ATTACHMENT_BYTES)}`, "error");
                return;
            }

            const safeName = normalizedFile.name || file.name || "未命名文件";
            const mimeType = normalizedFile.type || file.type || "application/octet-stream";
            let base64 = "";
            try {
                base64 = await fileToBase64(normalizedFile);
            } catch (err) {
                setStatus("文件读取失败，请重试", "error");
                return;
            }

            attachments.push({
                id: `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
                kind,
                name: safeName,
                size: fileSize,
                mimeType,
                base64
            });

            const label = attachmentMeta[kind]?.label || "附件";
            insertTextAtCursor(`\n[${label}] ${safeName}\n`);
            renderAttachmentList();
            saveDraft();
            setStatus(heicConverted ? `${label}已添加（已转 JPG）` : `${label}已添加`, "muted");
        }

        async function handlePickedFiles(fileList, kind) {
            const files = Array.from(fileList || []);
            for (const file of files) {
                await addAttachment(kind, file);
            }
        }

        function saveDraft() {
            const payload = {
                moodId: selectedMoodId,
                weatherId: selectedWeatherId,
                weatherTempC,
                weatherFeelsLikeC,
                weatherCode,
                weatherIsDay,
                healthPartId: selectedHealthPartId,
                socialPeople: selectedSocialPeople,
                socialPeopleOptions,
                familyPeople: selectedFamilyPeople,
                familyPeopleOptions,
                sceneLabelOptionsByTag: snapshotSceneLabelOptionsByTag(),
                selectedSceneLabelByTag: snapshotSelectedSceneLabelByTag(),
                text: entryText.value,
                reviewText: reviewText.value,
                tag: selectedTag,
                energy: energyLevel,
                tagSelectedForEntry,
                energySelectedForEntry
            };
            localStorage.setItem(DRAFT_KEY, JSON.stringify(payload));
        }

        function restoreDraft() {
            const raw = localStorage.getItem(DRAFT_KEY);
            if (!raw) return;
            try {
                const data = JSON.parse(raw);
                if (data && typeof data === "object") {
                    if (typeof data.moodId === "string") selectedMoodId = data.moodId;
                    if (typeof data.weatherId === "string") selectedWeatherId = data.weatherId;
                    if (data.weatherTempC !== undefined) weatherTempC = parseOptionalNumber(data.weatherTempC);
                    if (data.weatherFeelsLikeC !== undefined) weatherFeelsLikeC = parseOptionalNumber(data.weatherFeelsLikeC);
                    if (data.weatherCode !== undefined) weatherCode = parseOptionalNumber(data.weatherCode);
                    if (data.weatherIsDay !== undefined) weatherIsDay = parseOptionalNumber(data.weatherIsDay);
                    if (typeof data.healthPartId === "string") {
                        const partId = data.healthPartId.trim();
                        if (HEALTH_PART_OPTIONS.some((item) => item.id === partId)) {
                            selectedHealthPartId = partId;
                        }
                    }
                    const mergedSocialOptions = dedupeSocialPeople([
                        ...DEFAULT_SOCIAL_PEOPLE,
                        ...(Array.isArray(data.socialPeopleOptions) ? data.socialPeopleOptions : []),
                        ...(Array.isArray(data.socialPeople) ? data.socialPeople : [])
                    ]);
                    if (mergedSocialOptions.length) {
                        socialPeopleOptions = mergedSocialOptions;
                    }
                    if (Array.isArray(data.socialPeople)) {
                        selectedSocialPeople = dedupeSocialPeople(
                            data.socialPeople.filter((item) => socialPeopleOptions.includes(normalizeSocialPersonName(item)))
                        );
                        if (selectedSocialPeople.length > 1) {
                            selectedSocialPeople = selectedSocialPeople.slice(0, 1);
                        }
                    }
                    const mergedFamilyOptions = dedupeSocialPeople([
                        ...DEFAULT_FAMILY_PEOPLE,
                        ...(Array.isArray(data.familyPeopleOptions) ? data.familyPeopleOptions : []),
                        ...(Array.isArray(data.familyPeople) ? data.familyPeople : [])
                    ]);
                    if (mergedFamilyOptions.length) {
                        familyPeopleOptions = mergedFamilyOptions;
                    }
                    if (Array.isArray(data.familyPeople)) {
                        selectedFamilyPeople = dedupeSocialPeople(
                            data.familyPeople.filter((item) => familyPeopleOptions.includes(normalizeSocialPersonName(item)))
                        );
                        if (selectedFamilyPeople.length > 1) {
                            selectedFamilyPeople = selectedFamilyPeople.slice(0, 1);
                        }
                    }
                    sceneLabelOptionsByTag = cloneDefaultSceneLabelOptionsByTag();
                    if (data.sceneLabelOptionsByTag && typeof data.sceneLabelOptionsByTag === "object") {
                        TAG_OPTIONS.forEach((tag) => {
                            const extra = Array.isArray(data.sceneLabelOptionsByTag[tag])
                                ? data.sceneLabelOptionsByTag[tag]
                                : [];
                            sceneLabelOptionsByTag[tag] = dedupeSocialPeople([
                                ...getSceneLabelOptions(tag),
                                ...extra
                            ]);
                        });
                    }
                    selectedSceneLabelByTag = {};
                    if (data.selectedSceneLabelByTag && typeof data.selectedSceneLabelByTag === "object") {
                        TAG_OPTIONS.forEach((tag) => {
                            const selected = normalizeSocialPersonName(data.selectedSceneLabelByTag[tag]);
                            if (selected && getSceneLabelOptions(tag).includes(selected)) {
                                selectedSceneLabelByTag[tag] = selected;
                            }
                        });
                    }
                    if (typeof data.text === "string") entryText.value = data.text;
                    if (typeof data.reviewText === "string") reviewText.value = data.reviewText;
                    if (typeof data.tag === "string" && TAG_OPTIONS.includes(data.tag)) selectedTag = data.tag;
                    if (Array.isArray(data.tags) && !selectedTag) {
                        const oldTag = data.tags.map((item) => String(item || "").trim()).find((item) => TAG_OPTIONS.includes(item));
                        if (oldTag) selectedTag = oldTag;
                    }
                    if (data.energy !== undefined) energyLevel = normalizeEnergy(data.energy);
                    if (typeof data.tagSelectedForEntry === "boolean") {
                        tagSelectedForEntry = data.tagSelectedForEntry;
                    } else {
                        tagSelectedForEntry = selectedTag !== "";
                    }
                    if (typeof data.energySelectedForEntry === "boolean") {
                        energySelectedForEntry = data.energySelectedForEntry;
                    } else {
                        energySelectedForEntry = false;
                    }
                }
            } catch (err) {
                console.warn("Draft parse failed:", err);
            }
        }

        function appendMarkdownSection(lines, title, items, emptyText = "（待补充）") {
            lines.push(`### ${title}`);

        function composeStandardTemplate() {

            const tagsLine = selectedTag ? `#${selectedTag}` : "（未选择）";

            const selectedWeather = getSelectedWeather();

            const socialPeople = selectedTag === "社交"

                : [];
            const familyPeople = selectedTag === "家庭"
                ? dedupeSocialPeople(selectedFamilyPeople.filter((item) => familyPeopleOptions.includes(item)))
                : [];
            const mergedContentText = [entryText.value, reviewText.value]
                .map((text) => String(text || "").trim())
                .filter(Boolean)
                .join("\n");
            const whatItems = splitBulletItems(mergedContentText);
            const lines = [];
            lines.push("---");
            lines.push(`## ${dateParts.dateLabel} (${dateParts.weekday})`);
            lines.push("");
            lines.push("### 元数据");
            lines.push(`- 标签：${tagsLine}`);
            if (selectedSceneLabel) {
                lines.push(`- 场景标签：${selectedSceneLabel}`);
            }
            if (selectedTag === "个人") {
                lines.push(`- 精力值：${energy}/10`);
            }
            lines.push(`- 心情：${selectedMood.title}`);
            lines.push(`- 天气：${selectedWeather.label}`);
            lines.push(`- 记录时分：${panelTime || "--:--"}`);
            if (selectedTag === "健康" && selectedHealthPart) {
                lines.push(`- 健康部位：${selectedHealthPart.label}`);
            }
            if (selectedTag === "财务") {
                lines.push("- 截图记账：提交后自动 OCR 入库 Google Sheet");
            }
            if (selectedTag === "家庭" && familyPeople.length) {
                lines.push(`- 家庭对象：${familyPeople.join("、")}`);
            }
            if (selectedTag === "社交" && socialPeople.length) {
                lines.push(`- 社交对象：${socialPeople.join("、")}`);
            }
            lines.push("");
            appendMarkdownSection(lines, profile.markdownEntryTitle, whatItems);
            lines.push("");
            lines.push("### NotebookLM 总结锚点");
            lines.push(`- 建议关注：${profile.focus}`);
            lines.push(`- 持续追踪：${profile.track}`);

            isSubmitting = flag;

        async function warmConnection() {
            const warmupUrl = resolveSubmitEndpoint();
            if (!warmupUrl) return;
            try {
                await fetch(warmupUrl, { method: "GET", mode: "no-cors", cache: "no-store" });
            } catch (err) {
                console.debug("Warmup skipped:", err);
            }

        function buildSubmitBlockSubtext(reasons = []) {
            if (!Array.isArray(reasons) || reasons.length === 0) return "";
            const lines = reasons
                .map((item) => String(item || "").trim())
                .filter(Boolean)
                .map((item) => `- ${item}`);
            if (!lines.length) return "";
            return `请先处理以下问题：\n${lines.join("\n")}`;
        }

        async function blockSubmitWithReason(title, reasons = [], options = {}) {
            const heading = String(title || "暂时不能提交").trim() || "暂时不能提交";
            const subtext = buildSubmitBlockSubtext(reasons);
            const waitMs = Number.isFinite(options.waitMs) ? Math.max(900, Number(options.waitMs)) : 1500;
            const statusText = Array.isArray(reasons) && reasons.length ? String(reasons[0]) : heading;
            setStatus(statusText, "error");
            showSubmitOverlay("error", heading, { subtext });
            await sleep(waitMs);
            hideSubmitOverlay();
        }

        async function submitDiary() {
            if (isSubmitting) return;
            commitPendingInlineAddForSubmit();
            const missingTag = !selectedTag || !tagSelectedForEntry;
            const missingEnergy = selectedTag === "个人" && !energySelectedForEntry;
            if (missingTag || missingEnergy) {
                nudgeRequiredFields();
                const reasons = [];
                if (missingTag) reasons.push("还没选择标签");
                if (missingEnergy) reasons.push("“个人”标签需要先拖动精力值滑杆");
                await blockSubmitWithReason("还不能提交", reasons);
                return;
            }
            const whatText = entryText.value.trim();
            const review = reviewText.value.trim();
            const contentText = [whatText, review].filter(Boolean).join("\n").trim();
            if (selectedTag === "财务" && !attachments.some(isImageAttachmentForFinance)) {
                await blockSubmitWithReason("财务记录暂时不能提交", [
                    "至少上传 1 张转账截图（图片附件）",
                    "可选：补充一行财务说明，后续更好复盘"
                ]);
                return;
            }
            if (!contentText && attachments.length === 0) {
                const profile = getTagProfile();
                const reasons = selectedTag === "财务"
                    ? ["请上传至少 1 张收支截图，或补充财务说明"]
                    : [
                        `“${profile.entryLabel}”还没填写任何内容`,
                        "可以先写 1 条简短记录再提交"
                    ];
                await blockSubmitWithReason("内容为空，暂时不能提交", reasons);
                if (selectedTag !== "财务" && entryText && typeof entryText.focus === "function") {
                    entryText.focus();
                }
                return;
            }

            setSubmitting(true);
            setStatus("提交中...", "muted");
            const loadingText = selectedTag === "财务"
                ? "正在识别截图并写入财务表..."
                : "正在把今天写进日记本...";
            showSubmitOverlay("loading", loadingText);
            saveDraft();
            const submitEndpoint = resolveSubmitEndpoint();
            if (!submitEndpoint) {
                setStatus("请先填写并部署有效的 Web App exec 地址", "error");
                showSubmitOverlay("error", "未配置可用的 Google Apps Script exec 地址");
                await sleep(1100);
                hideSubmitOverlay();
                setSubmitting(false);
                return;
            }

            const selectedMood = getSelectedMood();
            const selectedWeather = getSelectedWeather();
            const selectedHealthPart = getSelectedHealthPart();
            const selectedSceneLabel = getSelectedSceneLabel();
            const socialPeople = selectedTag === "社交"
                ? dedupeSocialPeople(selectedSocialPeople.filter((item) => socialPeopleOptions.includes(item)))
                : [];
            const familyPeople = selectedTag === "家庭"
                ? dedupeSocialPeople(selectedFamilyPeople.filter((item) => familyPeopleOptions.includes(item)))
                : [];
            const panelDate = getPanelDateInfo();
            const panelTime = getPanelTimeMark();
            const templateText = composeStandardTemplate();
            const requestBody = JSON.stringify({
                content: templateText,
                formattedEntry: templateText,
                rawText: contentText,
                whatText: contentText,
                reviewText: "",
                targetName: selectedTag || "",
                tag: selectedTag || "",
                tags: selectedTag ? [selectedTag] : [],
                sceneLabel: selectedSceneLabel || "",
                energy: selectedTag === "个人" ? normalizeEnergy(energyLevel) : undefined,
                mood: {
                    id: selectedMood.id,
                    emoji: selectedMood.emoji,
                    title: selectedMood.title
                },
                weather: {
                    id: selectedWeather.id,
                    label: selectedWeather.label,
                    feelsLikeC: Number.isFinite(weatherFeelsLikeC) ? weatherFeelsLikeC : null,
                    temperatureC: Number.isFinite(weatherTempC) ? weatherTempC : null,
                    weatherCode: Number.isFinite(weatherCode) ? weatherCode : null,
                    isDay: Number.isFinite(weatherIsDay) ? weatherIsDay : null
                },
                healthPart: selectedHealthPart
                    ? { id: selectedHealthPart.id, label: selectedHealthPart.label }
                    : null,
                socialPeople,
                familyPeople,
                panelDate,
                panelTime,
                attachments: attachments.map((item) => ({
                    id: item.id,
                    kind: item.kind,
                    name: item.name,
                    size: item.size,
                    mimeType: item.mimeType || "application/octet-stream",
                    base64: item.base64 || ""
                }))
            });
            const requestBytes = new TextEncoder().encode(requestBody).length;
            if (requestBytes > 24 * 1024 * 1024) {
                setStatus("上传内容过大，请减少附件后重试", "error");
                showSubmitOverlay("error", "内容太大啦，精简一点再试");
                await sleep(1100);
                hideSubmitOverlay();
                setSubmitting(false);
                return;
            }
            const payloadMb = requestBytes / (1024 * 1024);
            const estimatedTimeoutMs = Math.min(
                MAX_REQUEST_TIMEOUT_MS,
                Math.max(
                    REQUEST_TIMEOUT_MS,
                    Math.ceil(payloadMb * 22000) + 40000
                )
            );
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), estimatedTimeoutMs);
            const start = performance.now();

            try {
                const response = await fetch(submitEndpoint, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: requestBody,
                    cache: "no-store",
                    signal: controller.signal
                });

                const rawText = await response.text();
                let result = null;
                try {
                    result = rawText ? JSON.parse(rawText) : null;
                } catch (err) {
                    console.warn("Non-JSON response:", rawText);
                }

                if (!response.ok) {
                    const serverMsg = (result && result.message)
                        ? String(result.message)
                        : "";
                    if (response.status === 401) {
                        const msg = serverMsg || "401 未授权，请检查 Apps Script 访问权限";
                        setStatus(msg, "error");
                        showSubmitOverlay("error", msg);
                    } else {
                        const msg = serverMsg || `请求失败：HTTP ${response.status}`;
                        setStatus(msg, "error");
                        showSubmitOverlay("error", msg);
                    }
                    await sleep(1200);
                    hideSubmitOverlay();
                    return;
                }

                if (result && result.status === "success") {
                    const elapsed = Math.round(performance.now() - start);
                    const financeCount = Number((result && result.finance && result.finance.rowCount) || 0);
                    const financeTip = financeCount > 0 ? `，已自动记账 ${financeCount} 条` : "";
                    const successFeedback = buildSubmitSuccessFeedback({
                        tagName: selectedTag,
                        mood: selectedMood,
                        financeCount
                    });
                    setStatus(`提交成功 ${elapsed}ms${financeTip}，点击“返回首页”继续`, "ok");
                    showSubmitOverlay("success", successFeedback.title, {
                        ...successFeedback,
                        showHomeButton: true,
                        homeButtonText: "返回首页",
                        onHome: () => {
                            resetEditorDraftAfterSubmit();
                            hideSubmitOverlay();
                            showPicker();
                            setStatus("准备记录", "muted");
                        }
                    });
                } else {
                    const serverMsg = (result && result.message)
                        ? String(result.message)
                        : (rawText ? `服务端返回：${rawText.slice(0, 80)}` : "提交失败，服务端返回异常");
                    setStatus(serverMsg, "error");
                    showSubmitOverlay("error", serverMsg);
                    await sleep(1200);
                    hideSubmitOverlay();
                }
            } catch (err) {
                if (err && err.name === "AbortError") {
                    const timeoutHint = "请求超时，请稍后重试";
                    setStatus(timeoutHint, "error");
                    showSubmitOverlay("error", timeoutHint);
                } else {
                    const msg = (err && err.message)
                        ? `网络错误：${String(err.message).slice(0, 60)}`
                        : "网络错误，请检查连接";
                    setStatus(msg, "error");
                    console.error("Submit failed:", err);
                    showSubmitOverlay("error", "网络有点慢，稍后再试");
                }
                await sleep(1200);
                hideSubmitOverlay();
            } finally {
                clearTimeout(timer);
                if (submitOverlay?.dataset?.mode === "loading") hideSubmitOverlay();
                setSubmitting(false);
            }
        }

        function setEditorFocusState(input) {
            if (!editorView) return;
            let focusValue = "";
            if (input === entryText) focusValue = "entry";
            if (input === reviewText) focusValue = "review";
            if (focusValue) {
                editorView.dataset.focus = focusValue;
            } else {

        function ensureEditorInputVisible(input, options = {}) {
            if (!input || !templateFields || !editorView.classList.contains("active")) return;
            if (templateFields.scrollHeight <= templateFields.clientHeight) return;

            const behavior = options.behavior === "smooth" ? "smooth" : "auto";
            const containerRect = templateFields.getBoundingClientRect();
            const inputRect = input.getBoundingClientRect();
            if (containerRect.height <= 0 || inputRect.height <= 0) return;

            const toolHeight = editorTools ? editorTools.getBoundingClientRect().height : 0;
            const topBoundary = containerRect.top + 8;
            const bottomGuard = Math.min(
                Math.max(30, toolHeight + 16),
                containerRect.height * 0.45
            );
            const bottomBoundary = containerRect.bottom - bottomGuard;
            const margin = 10;

            let targetScrollTop = templateFields.scrollTop;
            if (inputRect.bottom + margin > bottomBoundary) {
                targetScrollTop += (inputRect.bottom + margin - bottomBoundary);
            } else if (inputRect.top - margin < topBoundary) {
                targetScrollTop -= (topBoundary - (inputRect.top - margin));
            } else {
                return;
            }

            const maxScrollTop = Math.max(0, templateFields.scrollHeight - templateFields.clientHeight);
            targetScrollTop = Math.max(0, Math.min(targetScrollTop, maxScrollTop));
            if (Math.abs(targetScrollTop - templateFields.scrollTop) < 1) return;

            if (behavior === "smooth" && typeof templateFields.scrollTo === "function") {
                templateFields.scrollTo({ top: targetScrollTop, behavior });
            } else {
                templateFields.scrollTop = targetScrollTop;
            }
        }

        function handleEditorFocus(input) {
            lastEditorInput = input;
            closePlusMenu();
            setEditorFocusState(input);
            if (editorView) editorView.classList.add("typing-mode");
            rememberEditorSelection(input);
            ensureEditorCaretVisible(input);
            ensureEditorDockVisible();
        }

        function handleEditorBlur(input) {
            rememberEditorSelection(input);
            setTimeout(() => {
                const active = document.activeElement;
                if (active !== entryText && active !== reviewText) {
                    setEditorFocusState(null);
                    if (editorView) editorView.classList.remove("typing-mode");
                    document.documentElement.style.setProperty("--keyboard-dock-shift", "0px");
                }
            }, 0);
        }

        function ensureEditorDockVisible() {
            if (!editorDock || !editorView || !editorView.classList.contains("active")) {
                document.documentElement.style.setProperty("--keyboard-dock-shift", "0px");
                return;
            }
            const active = document.activeElement;
            const isTyping = active === entryText || active === reviewText;
            if (!isTyping) {
                document.documentElement.style.setProperty("--keyboard-dock-shift", "0px");
                return;
            }
            const viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
            const dockRect = editorDock.getBoundingClientRect();
            const overlap = Math.ceil(dockRect.bottom - viewportHeight + 4);
            const shift = Math.max(0, overlap);
            document.documentElement.style.setProperty("--keyboard-dock-shift", `${shift}px`);
        }

        function updateKeyboardInset() {
            const viewport = window.visualViewport;
            if (!viewport) {
                document.documentElement.style.setProperty("--keyboard-inset", "0px");
                document.documentElement.style.setProperty("--keyboard-dock-shift", "0px");
                editorView.classList.remove("keyboard-open");
                return;
            }
            const viewportDelta = window.innerHeight - viewport.height;
            const offsetAdjustedDelta = window.innerHeight - viewport.height - viewport.offsetTop;
            const rawInset = Math.max(viewportDelta, offsetAdjustedDelta);
            const inset = Math.max(0, Math.round(rawInset));
            document.documentElement.style.setProperty("--keyboard-inset", `${inset}px`);
            const keyboardOpen = inset > 60;
            editorView.classList.toggle("keyboard-open", keyboardOpen);
            const activeInput = document.activeElement;
            if (activeInput === entryText || activeInput === reviewText) {
                requestAnimationFrame(() => {
                    ensureEditorCaretVisible(activeInput);
                    ensureEditorDockVisible();
                });
            } else if (!keyboardOpen) {
                setEditorFocusState(null);
                document.documentElement.style.setProperty("--keyboard-dock-shift", "0px");
            }
        }

            handleEditorFocus(reviewText);
        });
        entryText.addEventListener("click", (event) => handleEditorClick(event, entryText));
        reviewText.addEventListener("click", (event) => handleEditorClick(event, reviewText));
        entryText.addEventListener("keyup", () => rememberEditorSelection(entryText));
        reviewText.addEventListener("keyup", () => rememberEditorSelection(reviewText));
        entryText.addEventListener("select", () => rememberEditorSelection(entryText));
        reviewText.addEventListener("select", () => rememberEditorSelection(reviewText));
        entryText.addEventListener("blur", () => handleEditorBlur(entryText));
        reviewText.addEventListener("blur", () => handleEditorBlur(reviewText));
        entryText.addEventListener("touchend", () => setTimeout(() => rememberEditorSelection(entryText), 0));
        reviewText.addEventListener("touchend", () => setTimeout(() => rememberEditorSelection(reviewText), 0));
        entryText.addEventListener("keydown", (event) => handleEditorKeydown(event, entryText));
        reviewText.addEventListener("keydown", (event) => handleEditorKeydown(event, reviewText));

        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") {
                closeInlineAddRows();
            }
            if (event.key === "Escape" && weatherModal.classList.contains("show")) {
                closeWeatherModal(false);
            }
            if (event.key === "Escape" && moodModal.classList.contains("show")) {
                closeMoodModal(false);
            }
            if (event.key === "Escape" && stickerModal.classList.contains("show")) {
                closeStickerModal();
            }
        });

        document.addEventListener("pointerdown", (event) => {
            const target = event.target;
            if (!(target instanceof Element)) return;
            if (target.closest(".social-person-add")) return;
            if (target.closest("#sceneLabelAddBtn, #socialPeopleAddBtn, #familyPeopleAddBtn")) return;
            commitPendingInlineAddForSubmit();
            closeInlineAddRows();
        });

        if (restoreViewState() === "editor") {
            showEditor();
        } else {
            triggerPickerLuckySpin(420);
        }
    </script>
</body>
</html>
