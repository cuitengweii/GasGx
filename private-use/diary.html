<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diary Mood</title>
    <meta name="color-scheme" content="light">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Diary Mood">
    <link rel="icon" type="image/svg+xml" href="./diary-logo.png">
    <link rel="apple-touch-icon" href="./diary-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://script.google.com" crossorigin>
    <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/heic2any/dist/heic2any.min.js"></script>
    <style>
        :root {
            --bg: #e9e9e5;
            --ink: #171717;
            --muted: #96918b;
            --accent-soft: #a3d8b1;
            --paper-grid: #e2e2de;
            --paper: #f0f0eb;
            --paper-border: #202020;
            --red-ink: #cf6363;
            --keyboard-inset: 0px;
            --keyboard-dock-shift: 0px;
            --font-hand: "ZCOOL KuaiLe", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            --font-ui: "ZCOOL KuaiLe", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }

        * { box-sizing: border-box; }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: var(--font-ui);
            min-height: 100%;
        }

        .app {
            width: min(100%, 430px);
            height: 100dvh;
            min-height: 100dvh;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }

        .view {
            display: none;
            height: 100%;
            min-height: 0;
            padding: 4px 14px 22px;
        }

        .view.active {
            display: flex;
            flex-direction: column;
        }

        .picker-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 6px 0 2px;
        }

        .wheel-wrap {
            position: relative;
            width: min(100%, 404px);
            height: clamp(320px, 52vh, 410px);
            min-height: 320px;
            display: grid;
            place-items: center;
        }

        .mood-ring {
            width: min(100%, 390px);
            --ring-radius: 154px;
            --ring-rotation: 0deg;
            position: relative;
            aspect-ratio: 1 / 1;
            margin: 0;
            touch-action: none;
            cursor: grab;
        }

        .mood-ring.instant-rotate .mood-node {
            transition: none !important;
        }

        .mood-ring.dragging {
            cursor: grabbing;
        }

        .mood-ring::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: calc(var(--ring-radius) * 2);
            height: calc(var(--ring-radius) * 2);
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 2px solid rgba(130, 130, 130, 0.26);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16);
            pointer-events: none;
        }

        .mood-node {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 0;
            background: transparent;
            appearance: none;
            -webkit-appearance: none;
            -webkit-tap-highlight-color: transparent;
            transform: translate(-50%, -50%) rotate(calc(var(--angle) + var(--ring-rotation))) translateY(calc(var(--ring-radius) * -1)) rotate(calc((var(--angle) + var(--ring-rotation)) * -1));
            transition: transform var(--ring-transition, 520ms) var(--ring-ease, cubic-bezier(0.2, 0.86, 0.32, 1)), filter 220ms ease;
            cursor: pointer;
            display: grid;
            place-items: center;
            padding: 0;
            box-shadow: none;
            isolation: isolate;
        }

        .mood-node.active {
            filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.18));
            transform: translate(-50%, -50%) rotate(calc(var(--angle) + var(--ring-rotation))) translateY(calc(var(--ring-radius) * -1)) rotate(calc((var(--angle) + var(--ring-rotation)) * -1)) scale(1.58);
        }

        .mood-node:active {
            transform: translate(-50%, -50%) rotate(calc(var(--angle) + var(--ring-rotation))) translateY(calc(var(--ring-radius) * -1)) rotate(calc((var(--angle) + var(--ring-rotation)) * -1)) scale(0.96);
        }

        .picker-confirm {
            margin: 0 auto;
            width: min(92%, 360px);
            text-align: center;
        }

        .picker-confirm .tape {
            font-size: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.16em;
            line-height: 1.15;
            padding: 6px 16px 4px;
            background: linear-gradient(180deg, transparent 62%, var(--accent-soft) 62%);
        }

        .picker-confirm .tape::before,
        .picker-confirm .tape::after {
            top: 62%;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
        }

        .picker-desc {
            margin: 8px 0 0;
            font-family: var(--font-hand);
            font-size: 20px;
            color: #6f6a64;
            line-height: 1.25;
        }

        .picker-verse {
            margin: 10px auto 0;
            width: min(92%, 360px);
            padding: 12px 14px 12px;
            border-radius: 12px;
            background:
                linear-gradient(160deg, #faf5e8 0%, #f2e8d2 100%);
            border: 1px solid rgba(120, 98, 58, 0.38);
            box-shadow:
                0 10px 24px rgba(48, 38, 24, 0.14),
                inset 0 1px 0 rgba(255, 255, 255, 0.66),
                inset 0 -1px 0 rgba(99, 72, 35, 0.16);
            color: #4f4944;
            font-family: "Noto Serif SC", "Songti SC", "STSong", "Source Han Serif SC", serif;
            line-height: 1.4;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .picker-verse::before {
            content: "";
            position: absolute;
            inset: 0 auto 0 0;
            width: 3px;
            background: linear-gradient(180deg, #cdb062, #9f7f3c);
            opacity: 0.85;
        }

        .picker-verse::after {
            content: "";
            position: absolute;
            left: 14px;
            right: 14px;
            top: 33px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(140, 111, 67, 0.48), transparent);
        }

        .picker-verse-head {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #6f5a35;
            font-size: 13px;
            letter-spacing: 0.08em;
            font-weight: 600;
        }

        .picker-verse-head i {
            font-size: 12px;
            opacity: 0.95;
            color: #a78945;
        }

        .picker-verse-text {
            margin: 12px 0 0;
            font-size: 18px;
            line-height: 1.58;
            color: #2d2418;
            letter-spacing: 0.02em;
        }

        .picker-verse-text::before {
            content: "“";
            color: #9b7e46;
            margin-right: 2px;
        }

        .picker-verse-text::after {
            content: "”";
            color: #9b7e46;
            margin-left: 2px;
        }

        .picker-verse-ref {
            margin: 10px 0 0;
            padding-top: 8px;
            border-top: 1px solid rgba(123, 98, 61, 0.28);
            font-size: 14px;
            line-height: 1.2;
            color: #66533b;
            text-align: right;
            letter-spacing: 0.04em;
        }

        .tape {
            font-family: var(--font-hand);
            font-size: 36px;
            line-height: 1;
            display: inline-block;
            padding: 4px 8px 2px;
            background: linear-gradient(180deg, transparent 48%, var(--accent-soft) 48%);
            position: relative;
        }

        .tape::before,
        .tape::after {
            content: "";
            position: absolute;
            width: 12px;
            top: 50%;
            transform: translateY(-50%);
            border-top: 13px solid transparent;
            border-bottom: 13px solid transparent;
        }

        .tape::before {
            left: -12px;
            border-right: 12px solid var(--accent-soft);
        }

        .tape::after {
            right: -12px;
            border-left: 12px solid var(--accent-soft);
        }

        .picker-bottom {
            margin-top: 16px;
            padding: 6px 0 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            line-height: 1;
        }

        .icon-btn {
            border: 0;
            background: transparent;
            color: #111;
            cursor: pointer;
            width: 62px;
            height: 62px;
            border-radius: 31px;
            display: grid;
            place-items: center;
        }

        .icon-btn.center-next {
            width: 72px;
            height: 72px;
            font-size: 58px;
        }

        .editor-view {
            background:
                linear-gradient(var(--paper-grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--paper-grid) 1px, transparent 1px);
            background-size: 22px 22px;
            position: relative;
            overflow: hidden;
        }

        .editor-dock {
            margin-top: 6px;
            display: flex;
            flex-direction: column;
            position: relative;
            flex: 0 0 auto;
            padding-bottom: calc(env(safe-area-inset-bottom, 0px) + var(--keyboard-dock-shift, 0px) + 6px);
            z-index: 8;
        }

        .editor-tools {
            margin-top: 10px;
            padding: 0 8px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 6px;
            border: 2px solid #c6c6c1;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.58);
        }

        .editor-tools .icon-btn {
            width: 56px;
            height: 56px;
            font-size: 0;
            flex: 0 0 auto;
        }

        .editor-tools .icon-btn i {
            font-size: 42px;
            line-height: 1;
        }

        .mid-tools {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 0 2px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .mid-tools::-webkit-scrollbar {
            display: none;
        }

        .mid-tool-btn {
            width: 34px;
            height: 34px;
            border: 1px solid #d4d0ca;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.92);
            color: #1f1f1f;
            display: grid;
            place-items: center;
            cursor: pointer;
            padding: 0;
            flex: 0 0 auto;
            transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
        }

        .mid-tool-btn:active {
            background: #efeee9;
            transform: scale(0.95);
        }

        .mid-tool-btn i {
            font-size: 17px;
            color: #202020;
        }

        .mid-tool-btn[data-edit="todo"] i {
            color: #0f9b53;
        }

        .mid-tool-divider {
            width: 1px;
            height: 22px;
            background: #cdc9c3;
            margin: 0 1px;
            flex: 0 0 auto;
        }

        .paper {
            margin: 4px auto 0;
            width: 100%;
            flex: 1;
            min-height: 0;
            border: 3px solid var(--paper-border);
            background:
                linear-gradient(var(--paper-grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--paper-grid) 1px, transparent 1px),
                var(--paper);
            background-size: 22px 22px;
            position: relative;
            padding: 10px 14px 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .paper-header {
            display: grid;
            grid-template-columns: minmax(106px, 132px) minmax(0, 1fr) 54px;
            align-items: start;
            gap: 6px;
        }

        .paper-date {
            font-family: var(--font-hand);
            font-size: 30px;
            line-height: 1.05;
            display: flex;
            flex-direction: column;
            gap: 2px;
            color: #181818;
            min-width: 102px;
            justify-self: start;
        }

        .paper-date .weekday {
            font-size: 22px;
            line-height: 1;
            letter-spacing: 0.02em;
        }

        .paper-date .solar {
            font-size: 44px;
            line-height: 0.92;
        }

        .paper-date .lunar {
            font-size: 18px;
            line-height: 1;
            color: #45413d;
            white-space: nowrap;
        }

        .paper-date .time-mark {
            margin: 4px 0 0;
            font-size: 20px;
            line-height: 1;
            gap: 6px;
            color: #1d1d1d;
        }

        .paper-date .time-mark i {
            font-size: 16px;
            opacity: 0.9;
        }

        .weather-box {
            justify-self: end;
            align-self: start;
            width: 54px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            position: relative;
            z-index: 2;
        }

        .weather-trigger {
            width: 46px;
            height: 46px;
            border: 0;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.35);
            color: #1f1f1f;
            display: grid;
            place-items: center;
            cursor: pointer;
            font-size: 31px;
            line-height: 1;
            transition: transform 120ms ease, background 120ms ease;
        }

        .weather-trigger:hover {
            background: rgba(255, 255, 255, 0.6);
        }

        .weather-trigger:active {
            transform: scale(0.95);
        }

        .weather-feels {
            min-height: 12px;
            font-size: 11px;
            line-height: 1;
            color: #5f5953;
            white-space: nowrap;
            letter-spacing: 0.01em;
            text-align: center;
            transform: translateY(-1px);
            user-select: none;
        }

        .paper-hero {
            justify-self: stretch;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 0;
        }

        .paper-emoji {
            margin: 0;
            width: 138px;
            height: 138px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: transparent;
            cursor: pointer;
            transition: transform 120ms ease;
        }

        .paper-emoji:active {
            transform: scale(0.96);
        }

        .paper-mood-title {
            text-align: center;
            margin-top: 2px;
            font-size: 32px;
            width: 100%;
        }

        .paper-mood-title .tape {
            cursor: pointer;
            background: transparent;
            padding: 0;
            display: inline-flex;
            align-items: center;
            gap: 0.12em;
            white-space: nowrap;
            max-width: 100%;
            overflow: visible;
        }

        .paper-mood-title .tape::before,
        .paper-mood-title .tape::after {
            display: none;
        }

        .write-block {
            margin-top: 8px;
            color: #1d1d1d;
            font-family: var(--font-hand);
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .time-mark {
            font-size: 31px;
            line-height: 1;
            margin-bottom: 6px;
            color: #1b1b1b;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .time-mark i {
            font-size: 24px;
            opacity: 0.92;
        }

        .time-mark .time-value {
            line-height: 1;
        }

        .template-fields {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            padding-right: 4px;
            padding-top: 2px;
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-padding-block-end: calc(var(--keyboard-dock-shift, 0px) + 96px);
        }

        .template-fields::-webkit-scrollbar {
            display: none;
        }

        .quick-fields {
            position: sticky;
            top: 0;
            z-index: 6;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 2px 0 6px;
            background:
                linear-gradient(var(--paper-grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--paper-grid) 1px, transparent 1px),
                var(--paper);
            background-size: 22px 22px;
            box-shadow:
                0 1px 0 rgba(32, 32, 32, 0.08),
                0 10px 14px rgba(240, 240, 235, 0.86);
        }

        .quick-fields.missing {
            animation: required-shake 360ms ease-in-out 1;
            box-shadow: inset 0 0 0 2px rgba(209, 103, 103, 0.26);
            border-radius: 8px;
        }

        .field-label {
            font-size: 18px;
            line-height: 1.15;
            color: #7a746e;
        }

        .field-label.section-title {
            color: #000;
            font-size: 20px;
            line-height: 1.08;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            align-self: flex-start;
            padding: 3px 10px;
            border-radius: 8px;
            border: 1.5px solid #2f2b28;
            background: rgba(255, 255, 255, 0.86);
        }

        .entry-section-head {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
        }

        #entrySectionLabel {
            border: 0;
            border-radius: 0;
            padding: 2px 2px 3px;
            background: linear-gradient(180deg, transparent 56%, rgba(195, 189, 180, 0.42) 56%);
        }

        .tag-guide {
            margin-top: 2px;
            margin-bottom: 2px;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px dashed #cfc9c1;
            background: rgba(255, 255, 255, 0.66);
            color: #6a645e;
            font-size: 16px;
            line-height: 1.35;
            letter-spacing: 0.01em;
            flex: 0 0 auto;
            max-height: 56px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .tag-guide strong {
            color: #2f2c28;
            font-weight: 700;
        }

        .tag-guide.is-finance {
            border-color: rgba(46, 138, 90, 0.55);
            background: rgba(231, 247, 239, 0.72);
            color: #226945;
        }

        .field-label.required::after {
            content: " *";
            color: #d16767;
            font-size: 0.9em;
        }

        .tag-chips {
            margin-top: 6px;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px;
        }

        .tag-chip {
            border: 2px solid #c8c4be;
            background: #fff;
            color: #46413d;
            border-radius: 12px;
            font-family: var(--font-hand);
            font-size: 17px;
            line-height: 1;
            padding: 9px 4px;
            cursor: pointer;
            transition: all 120ms ease;
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            white-space: nowrap;
        }

        .tag-chip-emoji {
            font-size: 0.92em;
            line-height: 1;
        }

        .tag-chip-text {
            line-height: 1;
        }

        .tag-chip.active {
            border-color: #262626;
            background: #262626;
            color: #fff;
        }

        .health-part-wrap {
            display: none;
            margin-top: -3px;
            margin-bottom: 1px;
        }

        .health-part-wrap.show {
            display: block;
        }

        .health-part-row {
            display: flex;
            align-items: stretch;
            gap: 4px;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 4px 3px;
            scrollbar-width: none;
            -ms-overflow-style: none;
            border: 1px dashed rgba(92, 88, 82, 0.28);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.48);
            scroll-padding-inline: 4px;
        }

        .health-part-row::-webkit-scrollbar {
            display: none;
        }

        .health-part-chip {
            flex: 0 0 auto;
            width: 56px;
            border: 1.25px solid #c9c5bf;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.96);
            color: #35322f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            padding: 3px 2px 2px;
            min-height: 40px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 120ms ease, background 120ms ease, color 120ms ease, border-color 120ms ease;
        }

        .health-part-chip:active {
            transform: scale(0.97);
        }

        .health-part-chip.active {
            background: #242424;
            border-color: #242424;
            color: #fff;
            box-shadow: 0 2px 6px rgba(10, 10, 10, 0.18);
        }

        .health-part-svg {
            width: 14px;
            height: 14px;
            display: block;
            color: inherit;
        }

        .health-part-name {
            font-size: 9px;
            line-height: 1;
            letter-spacing: 0;
            text-align: center;
            white-space: nowrap;
            word-break: keep-all;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .social-people-wrap {
            display: none;
            margin-top: 0;
            margin-bottom: 4px;
            gap: 7px;
            flex-direction: column;
        }

        .social-people-wrap.show {
            display: flex;
            animation: social-wrap-reveal 180ms ease;
        }

        @keyframes social-wrap-reveal {
            from {
                opacity: 0;
                transform: translateY(-3px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .social-people-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        #socialPeopleWrap .social-people-head,
        #familyPeopleWrap .social-people-head {
            display: none;
        }

        #sceneLabelWrap .social-people-head {
            display: none;
        }

        #sceneLabelTitle {
            visibility: hidden;
            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .social-people-row {
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 7px;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;

            20% {

        function toExecWebAppUrl(sourceUrl) {
            const raw = String(sourceUrl || "").trim();
            if (!raw) return "";
            if (/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/i.test(raw)) {
                return raw;
            }
            const directMatch = raw.match(/^https:\/\/script\.google\.com\/macros\/s\/([A-Za-z0-9_-]+)\/(exec|dev)$/i);
            if (directMatch) {
                return `https://script.google.com/macros/s/${directMatch[1]}/exec`;
            }
            const projectMatch = raw.match(/\/home\/projects\/([A-Za-z0-9_-]+)\/edit/i);
            if (projectMatch && projectMatch[1]) {
                // Apps Script 项目页链接不是可调用的 Web App 地址，必须先部署后使用 exec 链接。
                return "";

            return "";

        function renderBibleVerse() {
            if (!pickerVerse || !pickerVerseText || !pickerVerseRef) return;
            const source = (Array.isArray(versePool) && versePool.length) ? versePool : BIBLE_VERSES;
            const index = Math.floor(Math.random() * source.length);
            const rawLine = source[index];
            const { quote, reference } = parseVerseLine(rawLine);
            pickerVerseText.textContent = quote;
            pickerVerseRef.textContent = reference;
        }

        function parseVerseLine(rawLine) {
            const fallback = {
                quote: "凡事都有定期，天下万务都有定时。",
                reference: "传道书 3:1"
            };
            const line = String(rawLine || "")
                .replace(/^📖\s*金句[:：]\s*/i, "")
                .trim();
            if (!line) return fallback;

            const separators = [" - ", " — ", " —— ", " -", "- "];
            let quote = line;
            let reference = "";

            for (const sep of separators) {
                const idx = line.lastIndexOf(sep);
                if (idx <= 0) continue;
                quote = line.slice(0, idx).trim();
                reference = line.slice(idx + sep.length).trim();
                break;
            }

            if (!reference) {
                const refMatch = line.match(/(.+?)\s+([^\s]+\s+\d+:\d+(?:-\d+)?)/);
                if (refMatch) {
                    quote = refMatch[1].trim();
                    reference = refMatch[2].trim();
                }
            }

            if (!quote) quote = fallback.quote;
            if (!reference) reference = fallback.reference;
            return { quote, reference };
        }

        function getIsoWeekToken(date = new Date()) {
            const utcDate = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            const weekDay = utcDate.getUTCDay() || 7;
            utcDate.setUTCDate(utcDate.getUTCDate() + 4 - weekDay);
            const yearStart = new Date(Date.UTC(utcDate.getUTCFullYear(), 0, 1));
            const week = Math.ceil((((utcDate - yearStart) / 86400000) + 1) / 7);
            return `${utcDate.getUTCFullYear()}-W${String(week).padStart(2, "0")}`;
        }

                if (!raw) return null;
                const parsed = JSON.parse(raw);
                if (!parsed || typeof parsed !== "object") return null;
                if (typeof parsed.weekToken !== "string") return null;
                if (!Array.isArray(parsed.verses)) return null;
                const verses = parsed.verses
                    .map((item) => String(item || "").trim())
                    .filter(Boolean);
                if (!verses.length) return null;
                return { weekToken: parsed.weekToken, verses };
            } catch (err) {
                return null;
            }
        }

        function writeVerseCache(weekToken, verses) {
            try {
                localStorage.setItem(VERSE_CACHE_KEY, JSON.stringify({
                    weekToken,
                    verses
                }));
            } catch (err) {
                console.debug("Verse cache write failed:", err);
            }
        }

        async function fetchOneVerse() {
            const refs = Array.isArray(CHINESE_VERSE_REFERENCES) && CHINESE_VERSE_REFERENCES.length
                ? CHINESE_VERSE_REFERENCES
                : [];
            if (!refs.length) {
                throw new Error("missing verse refs");
            }
            const reference = refs[Math.floor(Math.random() * refs.length)];
            const nonce = `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
            const verseUrl = `${VERSE_SOURCE_BASE_URL}/${reference.book}/${reference.chapter}/${reference.verse}.json?_=${nonce}`;
            const response = await fetch(verseUrl, {
                method: "GET",
                cache: "no-store"
            });
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            const data = await response.json();
            if (typeof data !== "string" || !data.trim()) {
                throw new Error("invalid verse payload");
            }
            const verseText = data
                .replace(/\s+/g, " ")
                .replace(/[“”"]/g, "")
                .trim();
            if (!verseText) {
                throw new Error("empty verse");
            }
            return `📖 金句：${verseText} - ${reference.label}`;
        }

        async function fetchWeeklyVerseBatch() {
            const tasks = Array.from({ length: VERSE_BATCH_SIZE }, () => (
                fetchOneVerse().catch(() => "")
            ));
            const results = await Promise.all(tasks);
            const unique = [];
            const seen = new Set();
            results.forEach((item) => {
                const text = String(item || "").trim();
                if (!text || seen.has(text)) return;
                seen.add(text);
                unique.push(text);
            });
            return unique;
        }

        async function refreshWeeklyVerses() {
            const currentWeek = getIsoWeekToken();
            const cached = readVerseCache();
            if (cached && cached.weekToken === currentWeek && cached.verses.length) {
                versePool = cached.verses;
                return;
            }

            try {
                const fetched = await fetchWeeklyVerseBatch();
                if (fetched.length >= 3) {
                    versePool = fetched;
                    writeVerseCache(currentWeek, versePool);
                } else {
                    versePool = [...BIBLE_VERSES];
                }
            } catch (err) {
                versePool = [...BIBLE_VERSES];
            }
        }

        function randomBetween(min, max) {
            return Math.random() * (max - min) + min;
        }

        function pickRandom(list) {
            if (!Array.isArray(list) || list.length === 0) return "";
            return list[Math.floor(Math.random() * list.length)];
        }

        function pickRandomWithoutRepeat(list, previousValue, fallbackValue = "") {
            if (!Array.isArray(list) || list.length === 0) return String(fallbackValue || "");
            const normalized = list
                .map((item) => String(item || "").trim())
                .filter(Boolean);
            if (!normalized.length) return String(fallbackValue || "");
            const candidates = normalized.filter((item) => item !== String(previousValue || ""));
            return pickRandom(candidates.length ? candidates : normalized) || String(fallbackValue || "");
        }

        function resolveSubmitEffectList(effectName) {
            const raw = String(effectName || "halo").trim();
            const parts = raw
                .split(/[+,/|]/)
                .map((item) => item.trim())
                .filter(Boolean)
                .map((item) => {
                    if (item === "bubble") return "bubbles";
                    return item;
                });
            const allowed = new Set(["confetti", "spark", "bubbles", "halo"]);
            const unique = [];
            parts.forEach((item) => {
                if (!allowed.has(item) || unique.includes(item)) return;
                unique.push(item);
            });
            if (!unique.length) unique.push("halo");
            return unique;
        }

        function playSubmitEffect(effectName, accentColor) {
            clearSubmitEffects();
            if (!submitEffectLayer || !submitOverlay) return;
            const effects = resolveSubmitEffectList(effectName);
            submitOverlay.dataset.effect = effects.join("+");
            effects.forEach((effect) => {
                if (effect === "confetti") {
                    spawnConfettiEffect(accentColor);
                } else if (effect === "spark") {
                    spawnSparkEffect();
                } else if (effect === "bubbles") {
                    spawnBubbleEffect();
                } else {
                    spawnHaloEffect(accentColor);
                }
            });
            let cleanupDelay = 2200;
            if (effects.includes("bubbles")) cleanupDelay = 2800;
            else if (effects.includes("confetti")) cleanupDelay = 2500;
            submitFxCleanupTimer = setTimeout(() => {
                if (submitEffectLayer) submitEffectLayer.innerHTML = "";
            }, cleanupDelay);
        }

        function resolveSubmitCelebration(moodMeta) {
            const preferredEffect = String(moodMeta?.effect || "halo").trim() || "halo";
            const preferredEmoji = String(moodMeta?.emoji || "🎉").trim() || "🎉";
            const effectCandidates = [preferredEffect, ...SUBMIT_EFFECT_POOL];
            const emojiCandidates = [preferredEmoji, ...SUBMIT_EMOJI_POOL];
            const resolvedEffect = pickRandomWithoutRepeat(effectCandidates, lastSubmitEffectName, preferredEffect);
            const resolvedEmoji = pickRandomWithoutRepeat(emojiCandidates, lastSubmitEmoji, preferredEmoji);
            const bonusLine = pickRandomWithoutRepeat(SUBMIT_BONUS_LINES, lastSubmitBonusLine, SUBMIT_BONUS_LINES[0] || "");
            lastSubmitEffectName = resolvedEffect;
            lastSubmitEmoji = resolvedEmoji;
            lastSubmitBonusLine = bonusLine;
            return {
                effect: resolvedEffect,
                emoji: resolvedEmoji,
                bonusLine
            };
        }

                : "内容已同步到对应 Google Doc。";

        function normalizeSocialPersonName(value) {
            const raw = String(value || "").trim();
            if (!raw) return "";
            const squashed = raw.replace(/\s+/g, " ");
            return squashed.slice(0, 16);
        }

        function dedupeSocialPeople(list) {
            const output = [];
            const seen = new Set();
            list.forEach((item) => {
                const name = normalizeSocialPersonName(item);
                if (!name || seen.has(name)) return;
                seen.add(name);
                output.push(name);
            });
            return output;
        }

        function isInlineAddOpen(addRow) {
            return Boolean(addRow && addRow.classList.contains("show"));

        function setInlineAddOpen(addRow, input, open) {
            if (!addRow) return;
            addRow.classList.toggle("show", Boolean(open));
            addRow.setAttribute("aria-hidden", open ? "false" : "true");
            if (!open && input) {
                input.value = "";
            }
        }

        function focusInlineAddInput(input) {
            if (!input || typeof input.focus !== "function") return;
            requestAnimationFrame(() => {
                input.focus();
            });
        }

        function mountInlineAddRow(addRow, hostRow) {
            if (!addRow || !hostRow || addRow.parentElement === hostRow) return;
            hostRow.appendChild(addRow);
        }

        function revealInlineAddHost(hostRow) {
            if (!hostRow || typeof hostRow.scrollTo !== "function") return;
            requestAnimationFrame(() => {
                hostRow.scrollTo({
                    left: hostRow.scrollWidth,
                    behavior: "smooth"
                });
            });
        }

                [sceneLabelAddRow, sceneLabelInput]

            entries.forEach(([row, input]) => {

                if (!isInlineAddOpen(row)) return;
                setInlineAddOpen(row, input, false);

        function addSceneLabelOption(tagName, name, { select = true } = {}) {
            const normalizedTag = normalizeTagName(tagName);
            const normalizedName = normalizeSocialPersonName(name);
            if (!normalizedTag || !normalizedName) return false;
            const nextOptions = dedupeSocialPeople([
                ...getSceneLabelOptions(normalizedTag),

        function handleInlineAddTrigger({ addRow, input, submit, hostRow }) {
            if (!addRow || typeof submit !== "function") return;
            if (!isInlineAddOpen(addRow)) {
                closeInlineAddRows(addRow);
                mountInlineAddRow(addRow, hostRow);
                setInlineAddOpen(addRow, input, true);
                revealInlineAddHost(hostRow || addRow.parentElement);
                focusInlineAddInput(input);
                return;
            }
            const added = submit();
            if (added) {
                setInlineAddOpen(addRow, input, false);
                return;
            }
            const hasValue = Boolean(normalizeSocialPersonName(input?.value));
            if (!hasValue) {
                setInlineAddOpen(addRow, input, false);

        }

        function getShanghaiDateParts(date = new Date()) {
            const formatter = new Intl.DateTimeFormat("zh-CN", {
                timeZone: APP_TZ,
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                weekday: "short"
            });
            const parts = formatter.formatToParts(date);
            const map = {};
            parts.forEach((part) => {
                map[part.type] = part.value;
            });
            return {
                dateLabel: `${map.year}-${map.month}-${map.day}`,
                weekday: map.weekday || ""
            };
        }

        function splitBulletItems(text) {
            return String(text || "")

                .map((line) => line
                    .replace(LIST_PREFIX_REGEX, "")
                    .trim())
                .filter(Boolean);
        }

        function formatPaperDate(date = new Date()) {
            const dateParts = getShanghaiDateParts(date);
            const [, monthPart = "01", dayPart = "01"] = dateParts.dateLabel.split("-");
            const month = monthPart;
            const day = dayPart;
            const weekday = dateParts.weekday;

            let lunarLabel = "农历--";
            try {
                const lunarRaw = new Intl.DateTimeFormat("zh-CN-u-ca-chinese", {
                    timeZone: APP_TZ,
                    month: "long",
                    day: "numeric"
                }).format(date);
                lunarLabel = `农历${lunarRaw.replace(/\s/g, "")}`;
            } catch (err) {
                console.debug("Lunar date unavailable:", err);
            }

            paperDate.innerHTML = `
                <div class="weekday">${weekday}</div>
                <div class="solar">${month}.${day}</div>
                <div class="lunar">${lunarLabel}</div>
            `;
        }

                <circle cx="35" cy="41" r="4.5" fill="#1f2a37"/>
                <circle cx="65" cy="41" r="4.5" fill="#1f2a37"/>
                <path d="M34 64 Q40 58 46 64 Q52 58 58 64 Q63 59 67 63" stroke="#1f2a37" stroke-width="5" stroke-linecap="round" fill="none"/>
            `,
            tan: `
                <path d="M30 41 Q35 45 40 41" stroke="#1f2a37" stroke-width="5" stroke-linecap="round" fill="none"/>
                <path d="M60 41 Q65 45 70 41" stroke="#1f2a37" stroke-width="5" stroke-linecap="round" fill="none"/>
                <ellipse cx="50" cy="62" rx="8" ry="6.5" fill="none" stroke="#1f2a37" stroke-width="4.5"/>
            `
        };

        function escapeHtmlAttr(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/"/g, "&quot;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }

        function renderMoodSvg(mood) {
            const fill = mood?.color || "#9ab1d6";
            const features = MOOD_FACE_FEATURES[mood?.id] || MOOD_FACE_FEATURES.neutral;
            const title = escapeHtmlAttr(mood?.title ? `${mood.title} 图标` : "心情图标");
            return `
                <svg class="mood-svg" viewBox="0 0 100 100" role="img" aria-label="${title}">
                    <circle cx="50" cy="50" r="46" fill="${fill}"/>
                    ${features}
                </svg>
            `;
        }

        function normalizeDegrees(value) {
            let normalized = value % 360;
            if (normalized < 0) normalized += 360;
            return normalized;
        }

        function shortestDelta(current, target) {
            return ((target - current + 540) % 360) - 180;
        }

        function clockwiseDelta(current, target) {
            const currentNormalized = normalizeDegrees(current);
            const targetNormalized = normalizeDegrees(target);
            return (targetNormalized - currentNormalized + 360) % 360;
        }

        function clearRingSpinTimer() {
            if (ringSpinTimer) {
                clearTimeout(ringSpinTimer);
                ringSpinTimer = null;
            }
        }

        function clearSlotSpinFrame() {
            if (slotSpinFrame) {
                cancelAnimationFrame(slotSpinFrame);
                slotSpinFrame = null;
            }
        }

        function resetRingMotionStyle() {
            moodRing.style.removeProperty("--ring-transition");
            moodRing.style.removeProperty("--ring-ease");
        }

        function cancelRingSpin() {
            clearRingSpinTimer();
            clearSlotSpinFrame();
            isRingSpinning = false;
            moodRing.classList.remove("instant-rotate");
            resetRingMotionStyle();
        }

        function triggerPickerLuckySpin(delayMs = 120) {
            if (!pickerView.classList.contains("active")) return;
            if (pickerEntrySpinTimer) {
                clearTimeout(pickerEntrySpinTimer);
                pickerEntrySpinTimer = null;
            }
            pickerEntrySpinTimer = setTimeout(() => {
                if (!pickerView.classList.contains("active")) return;
                runSlotMachineSpin();
            }, Math.max(0, delayMs));
        }

        function setRingRotation(rotationDeg) {
            moodRing.style.setProperty("--ring-rotation", `${rotationDeg}deg`);
            ringRotationDeg = rotationDeg;
        }

        function setRingPreviewActive(rotationDeg = ringRotationDeg) {
            const previewMoodId = getMoodClosestToBottom(rotationDeg);
            moodRing.querySelectorAll(".mood-node").forEach((node) => {
                node.classList.toggle("active", node.dataset.id === previewMoodId);
            });
            return previewMoodId;
        }

        function spinRingToMoodPhysics(targetMoodId, options = {}) {
            cancelRingSpin();
            const targetMood = moods.find((item) => item.id === targetMoodId);
            if (!targetMood) {
                isRingSpinning = false;
                return;
            }

            isRingSpinning = true;
            // 自动转圈使用逐帧计算，禁用 CSS 过渡可避免结束时出现反向回摆。
            moodRing.classList.add("instant-rotate");
            resetRingMotionStyle();

            const direction = 1;
            const extraTurns = Math.max(1, Number.isFinite(options.extraTurns) ? Math.round(options.extraTurns) : 3);
            const initialVelocityDegPerSec = Math.max(
                520,
                Math.min(2400, Number.isFinite(options.initialVelocityDegPerSec) ? Math.abs(options.initialVelocityDegPerSec) : 1650)
            );
            const friction60 = Math.max(
                0.93,
                Math.min(0.99, Number.isFinite(options.friction60) ? options.friction60 : 0.973)
            );

            const targetRotation = normalizeDegrees(180 - targetMood.angle);
            const currentNormalized = normalizeDegrees(ringRotationDeg);
            const directedDelta = clockwiseDelta(currentNormalized, targetRotation);
            let destination = ringRotationDeg + directedDelta + direction * extraTurns * 360;
            if (Math.abs(destination - ringRotationDeg) < 180) {
                destination += direction * 360;
            }

            // 仅短暂防止拖拽/松手后的误触，不阻塞正常点击。
            const clickGuardMs = Math.max(
                0,
                Number.isFinite(options.clickGuardMs) ? Math.round(options.clickGuardMs) : 180
            );
            ignoreNodeClickUntil = Date.now() + clickGuardMs;

            let rotation = ringRotationDeg;
            let velocity = direction * initialVelocityDegPerSec;
            let phase = "inertia";
            let lastTs = performance.now();
            let lastForwardRotation = rotation;

            const finishSpin = () => {
                rotation = destination;
                setRingRotation(rotation);
                setRingPreviewActive(rotation);
                clearSlotSpinFrame();
                selectedMoodId = targetMoodId;
                updateMoodUI(false, false);
                ignoreNodeClickUntil = 0;
                // 终点锁定后再恢复普通过渡，避免恢复当帧触发补间。
                requestAnimationFrame(() => {
                    if (!isRingSpinning) {
                        moodRing.classList.remove("instant-rotate");
                    }
                });
                saveDraft();
                isRingSpinning = false;
            };

            const animate = (nowTs) => {
                const dt = Math.max(0.001, Math.min(0.036, (nowTs - lastTs) / 1000));
                lastTs = nowTs;

                if (phase === "inertia") {
                    rotation += velocity * dt;
                    const decay = Math.pow(friction60, dt * 60);
                    velocity *= decay;

                    const remaining = destination - rotation;
                    const signedRemaining = remaining;
                    const brakeDistance = Math.max(24, Math.abs(velocity) * 0.115);
                    const passedDestination = rotation >= destination;

                    if (passedDestination) {
                        finishSpin();
                        return;
                    } else if (signedRemaining <= brakeDistance || Math.abs(velocity) < 130) {
                        phase = "settle";
                    }
                }

                if (phase === "settle") {
                    const error = destination - rotation;
                    // 收尾改为单向缓停：保留阻尼减速，但不产生反向回弹。
                    const settleBlend = 1 - Math.pow(0.04, dt);
                    rotation += Math.max(0, error) * settleBlend;
                    velocity *= Math.pow(0.8, dt * 60);

                    if (rotation >= destination - 0.18 || Math.abs(velocity) < 1.8) {
                        finishSpin();
                        return;
                    }
                }

                // 二次保险：禁止任何一帧出现反向位移。
                if (rotation < lastForwardRotation) {
                    rotation = lastForwardRotation;
                }
                if (rotation >= destination) {
                    finishSpin();
                    return;
                }
                lastForwardRotation = rotation;

                setRingRotation(rotation);
                setRingPreviewActive(rotation);
                slotSpinFrame = requestAnimationFrame(animate);
            };

            slotSpinFrame = requestAnimationFrame(animate);
        }

        function runSlotMachineSpin() {
            const direction = 1;
            const targetMoodId = pickRandomMoodId(selectedMoodId);
            const extraTurns = 3 + Math.floor(Math.random() * 3);
            const initialVelocityDegPerSec = 1480 + Math.random() * 360;
            spinRingToMoodPhysics(targetMoodId, {
                direction,
                extraTurns,
                initialVelocityDegPerSec,
                friction60: 0.972
            });
        }

        function pickRandomMoodId(excludeId = "") {
            const pool = moods.filter((mood) => mood.id !== excludeId);
            const source = pool.length ? pool : moods;
            return source[Math.floor(Math.random() * source.length)].id;
        }

        function getRingPointerAngle(clientX, clientY) {
            const rect = moodRing.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const angle = Math.atan2(clientY - cy, clientX - cx) * (180 / Math.PI) + 90;
            return normalizeDegrees(angle);
        }

        function getMoodClosestToBottom(rotationDeg = ringRotationDeg) {
            const normalizedRotation = normalizeDegrees(rotationDeg);
            let bestMoodId = selectedMoodId;
            let minDistance = Number.POSITIVE_INFINITY;

            moods.forEach((mood) => {
                const nodeAngle = normalizeDegrees(mood.angle + normalizedRotation);
                const distanceToBottom = Math.abs(shortestDelta(nodeAngle, 180));
                if (distanceToBottom < minDistance) {
                    minDistance = distanceToBottom;
                    bestMoodId = mood.id;
                }
            });

            return bestMoodId;
        }

        function startRingDrag(event) {
            if (event.button !== undefined && event.button !== 0) return;
            cancelRingSpin();
            ringDrag.active = true;
            ringDrag.pointerId = event.pointerId;
            ringDrag.startAngle = getRingPointerAngle(event.clientX, event.clientY);
            ringDrag.startRotation = ringRotationDeg;
            ringDrag.moved = false;
            ringDrag.lastAngle = ringDrag.startAngle;
            ringDrag.lastTs = performance.now();
            ringDrag.velocity = 0;
            moodRing.classList.add("dragging", "instant-rotate");
            try {
                moodRing.setPointerCapture(event.pointerId);
            } catch (err) {
                console.debug("Pointer capture unavailable:", err);
            }
        }

        function moveRingDrag(event) {
            if (!ringDrag.active || event.pointerId !== ringDrag.pointerId) return;
            const now = performance.now();
            const currentAngle = getRingPointerAngle(event.clientX, event.clientY);
            const delta = shortestDelta(ringDrag.startAngle, currentAngle);
            const nextRotation = ringDrag.startRotation + delta;
            const step = shortestDelta(ringDrag.lastAngle, currentAngle);
            const dt = Math.max(1, now - ringDrag.lastTs);
            ringDrag.velocity = step / dt;
            ringDrag.lastAngle = currentAngle;
            ringDrag.lastTs = now;
            if (Math.abs(delta) > 2) {
                ringDrag.moved = true;
                clearTimeout(holdTimer);
                hideHoldTip();
            }
            setRingRotation(nextRotation);
            setRingPreviewActive(nextRotation);
            event.preventDefault();
        }

        function spinRingToRandomMood(velocityDegPerMs = 0) {
            const direction = 1;
            const targetMoodId = pickRandomMoodId(selectedMoodId);
            const releaseSpeedDegPerSec = Math.abs(velocityDegPerMs) * 1000;
            const initialVelocityDegPerSec = Math.max(760, Math.min(2100, releaseSpeedDegPerSec * 1.45));
            const extraTurns = Math.max(1, Math.min(5, 1 + Math.round(initialVelocityDegPerSec / 520)));
            spinRingToMoodPhysics(targetMoodId, {
                direction,
                extraTurns,
                initialVelocityDegPerSec,
                friction60: 0.971
            });
        }

        function endRingDrag(event) {
            if (!ringDrag.active || event.pointerId !== ringDrag.pointerId) return;
            moodRing.classList.remove("dragging", "instant-rotate");
            if (ringDrag.moved) {
                spinRingToRandomMood(ringDrag.velocity);
            }
            try {
                moodRing.releasePointerCapture(event.pointerId);
            } catch (err) {
                console.debug("Pointer release unavailable:", err);
            }
            ringDrag.active = false;
            ringDrag.pointerId = null;
        }

        function rotateRingToMood(moodId, animate = true) {
            const mood = moods.find((item) => item.id === moodId);
            if (!mood) return;

            const targetRotation = normalizeDegrees(180 - mood.angle);
            const nextRotation = animate
                ? ringRotationDeg + clockwiseDelta(ringRotationDeg, targetRotation)
                : targetRotation;

            if (!animate) moodRing.classList.add("instant-rotate");
            setRingRotation(nextRotation);
            if (!animate) {
                moodRing.offsetHeight;
                moodRing.classList.remove("instant-rotate");
            }
        }

        function parseOptionalNumber(value) {
            const num = Number(value);
            return Number.isFinite(num) ? num : null;
        }

        function readWeatherCache() {
            try {
                const raw = localStorage.getItem(WEATHER_CACHE_KEY);
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                if (!parsed || typeof parsed !== "object") return null;
                const weatherId = String(parsed.weatherId || "").trim();
                const updatedAt = Number(parsed.updatedAt);
                if (!weatherId || !Number.isFinite(updatedAt)) return null;
                if (!weatherOptions.some((item) => item.id === weatherId)) return null;
                return {
                    weatherId,
                    updatedAt,
                    tempC: parseOptionalNumber(parsed.tempC),
                    apparentTempC: parseOptionalNumber(parsed.apparentTempC),
                    weatherCode: parseOptionalNumber(parsed.weatherCode),
                    isDay: parseOptionalNumber(parsed.isDay)
                };
            } catch (err) {
                return null;
            }
        }

        function writeWeatherCache(snapshot) {
            if (!snapshot || typeof snapshot !== "object") return;
            try {
                localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify({
                    weatherId: snapshot.weatherId,
                    updatedAt: Date.now(),
                    tempC: snapshot.tempC,
                    apparentTempC: snapshot.apparentTempC,
                    weatherCode: snapshot.weatherCode,
                    isDay: snapshot.isDay
                }));
            } catch (err) {
                console.debug("Weather cache write failed:", err);
            }
        }

        function setWeatherSnapshot(snapshot) {
            if (!snapshot || typeof snapshot !== "object") return;
            const nextId = String(snapshot.weatherId || "").trim();
            if (nextId && weatherOptions.some((item) => item.id === nextId)) {
                selectedWeatherId = nextId;
                pendingWeatherId = nextId;
            }
            weatherTempC = parseOptionalNumber(snapshot.tempC);
            weatherFeelsLikeC = parseOptionalNumber(snapshot.apparentTempC);
            weatherCode = parseOptionalNumber(snapshot.weatherCode);
            weatherIsDay = parseOptionalNumber(snapshot.isDay);
        }

        function getWeatherFeelsText() {
            if (!Number.isFinite(weatherFeelsLikeC)) return "体感 --°C";
            return `体感 ${Math.round(weatherFeelsLikeC)}°C`;
        }

        function setWeatherLoading(flag) {
            isWeatherLoading = Boolean(flag);
            if (!weatherBtnIcon || !weatherBtn) return;
            if (isWeatherLoading) {
                weatherBtnIcon.className = "fa-solid fa-spinner fa-spin";
                weatherBtn.title = "正在获取当前位置天气...";
                weatherBtn.setAttribute("aria-label", "正在获取当前位置天气");
                if (weatherFeels) weatherFeels.textContent = "体感 --°C";
            } else {
                applyWeatherToUI();
            }
        }

        function getCurrentPositionAsync() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject(new Error("geolocation unavailable"));
                    return;
                }
                navigator.geolocation.getCurrentPosition(resolve, reject, {
                    enableHighAccuracy: false,
                    timeout: GEOLOCATION_TIMEOUT_MS,
                    maximumAge: 10 * 60 * 1000
                });
            });
        }

        function mapWmoCodeToWeatherId(code, isDay = 1, windSpeed = 0) {
            const wmoCode = Number(code);
            const dayFlag = Number(isDay) === 1;
            const wind = Number(windSpeed);
            if (!Number.isFinite(wmoCode)) return "cloudy";
            if (Number.isFinite(wind) && wind >= 65 && [0, 1, 2, 3].includes(wmoCode)) return "windy";

            if (wmoCode === 0) return dayFlag ? "sunny" : "night_cloudy";
            if (wmoCode === 1) return dayFlag ? "partly_cloudy" : "night_cloudy";
            if (wmoCode === 2) return dayFlag ? "partly_cloudy" : "cloudy";
            if (wmoCode === 3) return "cloudy";
            if (wmoCode === 45 || wmoCode === 48) return "fog";

            if (wmoCode === 51 || wmoCode === 53) return "drizzle";
            if (wmoCode === 55 || wmoCode === 56 || wmoCode === 57) return "showers";

            if (wmoCode === 61) return "light_rain";
            if (wmoCode === 63) return "showers";
            if (wmoCode === 65 || wmoCode === 66 || wmoCode === 67) return "heavy_rain";
            if (wmoCode === 80) return "showers";
            if (wmoCode === 81 || wmoCode === 82) return "heavy_rain";

            if ([71, 73, 75, 77, 85, 86].includes(wmoCode)) return "snow";

            if (wmoCode === 95) return "thunder";
            if (wmoCode === 96 || wmoCode === 99) return "storm";

            if (Number.isFinite(wind) && wind >= 55) return "windy";
            return dayFlag ? "partly_cloudy" : "night_cloudy";
        }

        async function fetchWeatherSnapshotByCoords(latitude, longitude) {
            const lat = Number(latitude);
            const lon = Number(longitude);
            if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
                throw new Error("invalid coordinates");
            }
            const query = new URLSearchParams({
                latitude: lat.toFixed(5),
                longitude: lon.toFixed(5),
                current: "weather_code,is_day,wind_speed_10m,temperature_2m,apparent_temperature",
                forecast_days: "1",
                timezone: "auto"
            });
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 8000);
            try {
                const response = await fetch(`${WEATHER_API_BASE_URL}?${query.toString()}`, {
                    method: "GET",
                    cache: "no-store",
                    signal: controller.signal
                });
                if (!response.ok) {
                    throw new Error(`weather http ${response.status}`);
                }
                const payload = await response.json();
                const current = payload && typeof payload === "object" ? payload.current : null;
                if (!current || current.weather_code === undefined) {
                    throw new Error("invalid weather payload");
                }
                const nextWeatherId = mapWmoCodeToWeatherId(
                    current.weather_code,
                    current.is_day,
                    current.wind_speed_10m
                );
                return {
                    weatherId: nextWeatherId,
                    weatherCode: parseOptionalNumber(current.weather_code),
                    isDay: parseOptionalNumber(current.is_day),
                    tempC: parseOptionalNumber(current.temperature_2m),
                    apparentTempC: parseOptionalNumber(current.apparent_temperature)
                };
            } finally {
                clearTimeout(timer);
            }
        }

        async function refreshWeatherFromLocation({ force = false, showStatus = false } = {}) {
            if (weatherAutoTask) return weatherAutoTask;

            weatherAutoTask = (async () => {
                const now = Date.now();
                const cached = readWeatherCache();
                if (!force && cached && (now - cached.updatedAt) < WEATHER_CACHE_MAX_AGE_MS) {
                    setWeatherSnapshot(cached);
                    applyWeatherToUI();
                    return;
                }

                setWeatherLoading(true);
                try {
                    const pos = await getCurrentPositionAsync();
                    const snapshot = await fetchWeatherSnapshotByCoords(
                        pos.coords.latitude,
                        pos.coords.longitude
                    );
                    setWeatherSnapshot(snapshot);
                    writeWeatherCache(snapshot);
                    applyWeatherToUI();
                    saveDraft();
                    if (showStatus) {
                        const weather = getSelectedWeather();
                        const feelText = Number.isFinite(weatherFeelsLikeC)
                            ? `，${getWeatherFeelsText()}`
                            : "";
                        setStatus(`已更新天气：${weather.label}${feelText}`, "ok");
                    }
                } catch (err) {
                    console.debug("Auto weather fetch failed:", err);
                    if (showStatus) {
                        setStatus("天气获取失败，请检查定位权限", "error");
                    }
                    if (!force && cached) {
                        setWeatherSnapshot(cached);
                        applyWeatherToUI();
                    }
                } finally {
                    setWeatherLoading(false);
                }
            })().finally(() => {
                weatherAutoTask = null;
            });

            return weatherAutoTask;
        }

        function getPendingWeather() {
            return weatherOptions.find((item) => item.id === pendingWeatherId) || weatherOptions[0];
        }

        function applyWeatherToUI() {
            if (isWeatherLoading) return;

            const extra = Number.isFinite(weatherFeelsLikeC) ? `，${getWeatherFeelsText()}` : "";
            weatherBtn.title = `天气：${weather.label}${extra}（点按刷新）`;
            weatherBtn.setAttribute("aria-label", `天气：${weather.label}${extra}，点按刷新`);
        }

                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "mood-option";
                if (mood.id === pendingMoodId) btn.classList.add("active");

                    moodGrid.querySelectorAll(".mood-option").forEach((node) => node.classList.remove("active"));
                    btn.classList.add("active");
