<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - GasGx</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/shared/ui/site-shell.shared.css">
    <link rel="stylesheet" href="/shared/ui/loading.shared.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/shared/ui/site-shell.config.js?v=20260321auth02"></script>
    <script src="/shared/ui/main-auth.shared.js?v=20260322authshared01"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gas: { bg: '#050505', card: '#0F0F0F', border: '#1F1F1F', green: '#5DD62C' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        header: ['Oswald', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    },
                    boxShadow: {
                        neon: '0 0 20px rgba(93, 214, 44, 0.15)'
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out'
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                }
            }
        };
    </script>
    <style>
        :root { color-scheme: dark; }
        body {
            background-color: #050505;
            color: #F8F8F8;
            font-family: 'Inter', sans-serif;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }
        .field {
            width: 100%;
            background: #111111;
            border: 1px solid rgba(255,255,255,0.10);
            color: #ffffff;
            font-size: 14px;
            border-radius: 12px;
            padding: 14px 16px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .field:focus {
            border-color: rgba(93, 214, 44, 0.8);
            box-shadow: 0 0 0 3px rgba(93, 214, 44, 0.12);
        }
        .toast {
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid #333;
            border-left: 3px solid #5DD62C;
            padding: 12px 24px;
            border-radius: 4px;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.3s ease;
            font-size: 14px;
            display: flex;
            gap: 8px;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 100;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        .toast.error {
            border-left-color: #ef4444;
        }
        .toast.error i {
            color: #ef4444;
        }
        .toast.info {
            border-left-color: #38bdf8;
        }
        .toast.info i {
            color: #38bdf8;
        }
    </style>
</head>
<body class="flex min-h-screen flex-col overflow-x-hidden">
    <div id="ggx-site-header-slot"></div>

    <main class="relative flex flex-1 flex-col items-center justify-center p-4 pt-20">
        <div id="toast-container" class="fixed right-5 top-20 z-[100] flex flex-col gap-2 pointer-events-none"></div>
        <div class="pointer-events-none absolute left-0 top-0 h-64 w-full bg-gradient-to-b from-gas-green/5 to-transparent"></div>

        <div id="loading-overlay" class="fixed inset-0 bg-[#050505] z-[80] flex items-center justify-center">
            <div class="flex flex-col items-center gap-4">
                <div class="gas-loading-spinner"></div>
                <span id="loading-text" class="text-gray-500 font-mono text-xs uppercase tracking-widest">VERIFYING...</span>
            </div>
        </div>

        <div class="relative z-10 mt-8 w-full max-w-[420px] rounded-2xl border border-white/10 bg-[#0F0F0F] p-8 shadow-neon backdrop-blur-sm animate-fade-in md:mt-0 md:p-10">
            <div class="mb-8 text-center">
                <h1 id="page-title" class="mb-2 font-header text-2xl font-bold uppercase tracking-wide text-white">Welcome Back</h1>
                <p id="page-subtitle" class="font-mono text-xs uppercase tracking-wider text-gray-500">Sign in to access your workspace</p>
            </div>

            <button type="button" id="google-login-btn" data-busy-label="Connecting..." onclick="handleOAuthLogin('google', this)" class="group mb-4 flex w-full items-center justify-center gap-3 rounded-lg bg-white px-4 py-3 font-bold text-black transition-all duration-200 hover:bg-gray-200 active:scale-95">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="h-5 w-5" alt="Google">
                <span id="google-login-text" class="text-sm font-sans">Continue with Google</span>
            </button>

            <div id="extra-social-logins" class="mb-6 hidden grid gap-3">
                <button type="button" id="twitter-login-btn" data-busy-label="Connecting..." onclick="handleOAuthLogin('twitter', this)" class="hidden w-full items-center justify-center gap-3 rounded-lg border border-white/10 bg-[#111] px-4 py-3 text-sm font-bold text-white transition-all duration-200 hover:border-gas-green hover:text-gas-green active:scale-95">
                    <i class="fa-brands fa-x-twitter"></i>
                    <span>Continue with X</span>
                </button>
                <button type="button" id="linkedin-login-btn" data-busy-label="Connecting..." onclick="handleOAuthLogin('linkedin_oidc', this)" class="hidden w-full items-center justify-center gap-3 rounded-lg border border-white/10 bg-[#111] px-4 py-3 text-sm font-bold text-white transition-all duration-200 hover:border-gas-green hover:text-gas-green active:scale-95">
                    <i class="fa-brands fa-linkedin"></i>
                    <span>Continue with LinkedIn</span>
                </button>
            </div>

            <div class="relative mb-6 flex items-center py-2">
                <div class="flex-grow border-t border-white/10"></div>
                <span id="email-divider-text" class="mx-4 flex-shrink-0 text-[10px] font-bold uppercase tracking-widest text-gray-600">Or with Email</span>
                <div class="flex-grow border-t border-white/10"></div>
            </div>

            <form id="auth-form" class="space-y-5" onsubmit="handleEmailAuth(event)">
                <div>
                    <input type="email" id="email" required autocomplete="email" placeholder="Email Address" class="field">
                </div>
                <div>
                    <input type="password" id="password" required minlength="6" autocomplete="current-password" placeholder="Password" class="field">
                </div>
                <div id="confirm-password-field" class="hidden">
                    <input type="password" id="confirm-password" minlength="6" autocomplete="new-password" placeholder="Confirm Password" class="field">
                </div>
                <button type="submit" id="submit-btn" data-busy-label="Processing..." class="flex w-full items-center justify-center gap-2 rounded-lg bg-gas-green py-3.5 text-sm font-bold uppercase tracking-wide text-black transition-all duration-200 hover:bg-white active:scale-95">
                    <span id="btn-text">Sign In</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-xs text-gray-500">
                    <span id="toggle-text">Don't have an account?</span>
                    <button type="button" onclick="toggleMode()" class="ml-1 text-[10px] font-bold uppercase tracking-wider text-gas-green hover:underline" id="toggle-btn">Sign Up</button>
                </p>
            </div>
        </div>
    </main>
    <div id="ggx-site-footer-slot"></div>
    <div id="ggx-back-to-top-slot"></div>
    <div id="ggx-chatbot-slot"></div>

    <script src="/shared/ui/site-shell.shared.js?v=20260322logout01"></script>
    <script>
        const HOME_SHELL_SITE_AUTH = window.GASGX_SITE_SHELL_CONFIG?.site?.mainAuth || {};
        const MAIN_AUTH_HELPER = window.GasGxMainAuthShared;
        const MAIN_AUTH_CONFIG = MAIN_AUTH_HELPER.resolveConfig(HOME_SHELL_SITE_AUTH);
        const SIGN_IN_URL = MAIN_AUTH_CONFIG.signInUrl;
        const DEFAULT_HOME_PATH = MAIN_AUTH_CONFIG.accountUrl;
        const DEFAULT_PROVIDER_FLAGS = { twitter: false, linkedin: false };

        const gxClient = window.supabase ? MAIN_AUTH_HELPER.createClient(window.supabase, MAIN_AUTH_CONFIG) : null;

        let isSignUp = false;
        let redirectScheduled = false;
        let currentLang = 'en';

        const AUTH_COPY = {
            en: {
                signInTitle: 'Welcome Back',
                signInSubtitle: 'Sign in to access your workspace',
                signUpTitle: 'Create Account',
                signUpSubtitle: 'Create your GasGx account',
                google: 'Continue with Google',
                emailDivider: 'Or with Email',
                emailPlaceholder: 'Email Address',
                passwordPlaceholder: 'Password',
                confirmPasswordPlaceholder: 'Confirm Password',
                signInButton: 'Sign In',
                signUpButton: 'Create Account',
                signInToggleText: "Don't have an account?",
                signUpToggleText: 'Already have an account?',
                signInToggleButton: 'Sign Up',
                signUpToggleButton: 'Sign In',
                processing: 'Processing...',
                connecting: 'Connecting...',
                verifying: 'VERIFYING...',
                redirecting: 'REDIRECTING...',
                passwordMismatch: 'Please enter the same password twice.',
                signupConfirm: 'Success! Please check your email to confirm.',
                signupSignedIn: 'Account created and signed in.',
                loginSuccess: 'Login successful.',
                supabaseError: 'Supabase SDK Error',
                authFailed: 'Email auth failed.'
            },
            zh: {
                signInTitle: '欢迎回来',
                signInSubtitle: '登录以访问你的工作区',
                signUpTitle: '创建账号',
                signUpSubtitle: '创建你的 GasGx 账号',
                google: '使用 Google 继续',
                emailDivider: '或使用邮箱',
                emailPlaceholder: '邮箱地址',
                passwordPlaceholder: '密码',
                confirmPasswordPlaceholder: '再次输入密码',
                signInButton: '登录',
                signUpButton: '创建账号',
                signInToggleText: '还没有账号？',
                signUpToggleText: '已有账号？',
                signInToggleButton: '注册',
                signUpToggleButton: '登录',
                processing: '处理中...',
                connecting: '连接中...',
                verifying: '验证中...',
                redirecting: '正在跳转...',
                passwordMismatch: '两次输入的密码不一致。',
                signupConfirm: '创建成功，请查看邮箱完成确认。',
                signupSignedIn: '账号已创建并登录。',
                loginSuccess: '登录成功。',
                supabaseError: 'Supabase 客户端不可用',
                authFailed: '邮箱认证失败。'
            }
        };

        function normalizeLang(lang) {
            return String(lang || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';
        }

        function resolvePageLang() {
            try {
                const storedLang = localStorage.getItem('gasgx-lang') || localStorage.getItem('gas_lang');
                if (storedLang) return normalizeLang(storedLang);
            } catch (_error) {
                // Fall through to the document language.
            }
            return normalizeLang(document.documentElement.getAttribute('lang') || 'en');
        }

        function getCopy() {
            return AUTH_COPY[currentLang] || AUTH_COPY.en;
        }

        function applyAuthText() {
            currentLang = resolvePageLang();
            const copy = getCopy();
            document.documentElement.setAttribute('lang', currentLang);
            document.title = currentLang === 'zh' ? '登录 - GasGx' : 'Sign In - GasGx';
            document.getElementById('google-login-text').textContent = copy.google;
            document.getElementById('email-divider-text').textContent = copy.emailDivider;
            document.getElementById('email').setAttribute('placeholder', copy.emailPlaceholder);
            document.getElementById('password').setAttribute('placeholder', copy.passwordPlaceholder);
            document.getElementById('confirm-password').setAttribute('placeholder', copy.confirmPasswordPlaceholder);
            document.getElementById('google-login-btn').dataset.busyLabel = copy.connecting;
            document.getElementById('submit-btn').dataset.busyLabel = copy.processing;
            document.getElementById('loading-text').textContent = copy.verifying;
            toggleModeState(isSignUp);
        }

        function getAuthRedirectUrl() {
            return new URL(SIGN_IN_URL, window.location.origin).toString();
        }

        function setButtonBusy(button, busy) {
            if (!button) return;
            if (busy) {
                if (!button.dataset.originalHtml) button.dataset.originalHtml = button.innerHTML;
                button.disabled = true;
                button.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
                return;
            }
            button.disabled = false;
            if (button.dataset.originalHtml) button.innerHTML = button.dataset.originalHtml;
        }

        function saveReturnUrl() {
            try {
                const preset = window.sessionStorage.getItem(MAIN_AUTH_CONFIG.returnUrlStorageKey);
                if (preset && preset.startsWith('/')) return preset;
            } catch (_error) {
                // Ignore storage read errors and continue with fallback save.
            }
            MAIN_AUTH_HELPER.saveReturnUrl({
                runtimeConfig: MAIN_AUTH_CONFIG,
                excludePaths: [SIGN_IN_URL, DEFAULT_HOME_PATH]
            });
        }

        function getTargetUrl() {
            return MAIN_AUTH_HELPER.consumeReturnUrl({
                runtimeConfig: MAIN_AUTH_CONFIG,
                fallbackPath: DEFAULT_HOME_PATH
            });
        }

        function performRedirect() {
            if (redirectScheduled) return;
            redirectScheduled = true;
            document.getElementById('loading-overlay').classList.remove('hidden');
            document.getElementById('loading-text').textContent = getCopy().redirecting;
            setTimeout(() => { window.location.href = getTargetUrl(); }, 500);
        }

        function showToast(message, type = 'success') {
            const iconMap = {
                success: 'fa-circle-check text-gas-green',
                error: 'fa-circle-exclamation text-red-500',
                info: 'fa-circle-info text-sky-400'
            };
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fa-solid ${iconMap[type] || iconMap.success}"></i><span>${message}</span>`;
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3200);
        }

        function toggleModeState(nextMode) {
            isSignUp = nextMode;
            const copy = getCopy();
            document.getElementById('page-title').textContent = isSignUp ? copy.signUpTitle : copy.signInTitle;
            document.getElementById('page-subtitle').textContent = isSignUp ? copy.signUpSubtitle : copy.signInSubtitle;
            document.getElementById('btn-text').textContent = isSignUp ? copy.signUpButton : copy.signInButton;
            document.getElementById('toggle-text').textContent = isSignUp ? copy.signUpToggleText : copy.signInToggleText;
            document.getElementById('toggle-btn').textContent = isSignUp ? copy.signUpToggleButton : copy.signInToggleButton;
            document.getElementById('password').setAttribute('autocomplete', isSignUp ? 'new-password' : 'current-password');
            const confirmField = document.getElementById('confirm-password-field');
            const confirmInput = document.getElementById('confirm-password');
            confirmField.classList.toggle('hidden', !isSignUp);
            confirmInput.required = isSignUp;
            if (!isSignUp) confirmInput.value = '';
        }

        async function loadProviderFlags() {
            const configuredFlags = MAIN_AUTH_CONFIG.providerRollout || {};
            return {
                ...DEFAULT_PROVIDER_FLAGS,
                twitter: configuredFlags.twitter === true,
                linkedin: configuredFlags.linkedin === true
            };
        }

        function applyProviderFlags(flags) {
            const wrapper = document.getElementById('extra-social-logins');
            const twitterBtn = document.getElementById('twitter-login-btn');
            const linkedinBtn = document.getElementById('linkedin-login-btn');
            const showTwitter = Boolean(flags.twitter);
            const showLinkedin = Boolean(flags.linkedin);

            wrapper.classList.toggle('hidden', !showTwitter && !showLinkedin);
            twitterBtn.classList.toggle('hidden', !showTwitter);
            twitterBtn.classList.toggle('flex', showTwitter);
            linkedinBtn.classList.toggle('hidden', !showLinkedin);
            linkedinBtn.classList.toggle('flex', showLinkedin);
        }

        function handleCallbackErrors() {
            const search = new URLSearchParams(window.location.search);
            const errorDescription = search.get('error_description') || search.get('error');
            if (errorDescription) {
                showToast(decodeURIComponent(errorDescription.replace(/\+/g, ' ')), 'error');
            }
        }

        window.toggleMode = function() {
            toggleModeState(!isSignUp);
        };

        window.handleOAuthLogin = async function(provider, button) {
            if (!gxClient) return showToast(getCopy().supabaseError, 'error');
            saveReturnUrl();
            setButtonBusy(button, true);
            try {
                const { error } = await gxClient.auth.signInWithOAuth({
                    provider,
                    options: { redirectTo: getAuthRedirectUrl() }
                });
                if (error) throw error;
            } catch (error) {
                showToast(error.message || `Unable to start ${provider} login.`, 'error');
                setButtonBusy(button, false);
            }
        };

        window.handleEmailAuth = async function(event) {
            event.preventDefault();
            if (!gxClient) return showToast(getCopy().supabaseError, 'error');

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const button = document.getElementById('submit-btn');

            if (isSignUp && password !== confirmPassword) {
                showToast(getCopy().passwordMismatch, 'error');
                return;
            }

            saveReturnUrl();
            setButtonBusy(button, true);

            try {
                const { data, error } = isSignUp
                    ? await gxClient.auth.signUp({ email, password, options: { emailRedirectTo: getAuthRedirectUrl() } })
                    : await gxClient.auth.signInWithPassword({ email, password });

                if (error) throw error;

                if (isSignUp && !data.session) {
                    showToast(getCopy().signupConfirm);
                    setButtonBusy(button, false);
                    toggleModeState(false);
                    document.getElementById('password').value = '';
                    document.getElementById('confirm-password').value = '';
                    return;
                }

                showToast(isSignUp ? getCopy().signupSignedIn : getCopy().loginSuccess);
                performRedirect();
            } catch (error) {
                showToast(error.message || getCopy().authFailed, 'error');
            } finally {
                setButtonBusy(button, false);
            }
        };

        window.onload = async function() {
            currentLang = resolvePageLang();
            applyAuthText();
            handleCallbackErrors();

            if (!gxClient) {
                document.getElementById('loading-overlay').classList.add('hidden');
                showToast(getCopy().supabaseError, 'error');
                return;
            }

            applyProviderFlags(await loadProviderFlags());
            saveReturnUrl();
            gxClient.auth.onAuthStateChange((_event, sessionValue) => {
                if (sessionValue?.user) performRedirect();
            });

            try {
                const { data: { session }, error } = await gxClient.auth.getSession();
                if (error) throw error;
                if (session?.user) {
                    performRedirect();
                    return;
                }
            } catch (error) {
                showToast(error.message || 'Unable to read the current session.', 'error');
            } finally {
                document.getElementById('loading-overlay').classList.add('hidden');
            }
        };

        applyAuthText();
        setTimeout(applyAuthText, 250);
        setTimeout(applyAuthText, 900);
        document.addEventListener('gasgx:lang-changed', applyAuthText);
        document.addEventListener('gasgx:site-shell-config-updated', applyAuthText);
    </script>
</body>
</html>
