<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Pipeline - GasGx</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/shared/ui/site-shell.shared.css">
    <link rel="stylesheet" href="/shared/ui/loading.shared.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gas: {
                            bg: '#050505',
                            panel: '#0f0f0f',
                            soft: '#151515',
                            border: '#262626',
                            green: '#5DD62C'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                        header: ['Oswald', 'sans-serif']
                    },
                    boxShadow: {
                        panel: '0 24px 60px rgba(0, 0, 0, 0.35)'
                    }
                }
            }
        };
    </script>
    <style>
        :root { color-scheme: dark; }
        body {
            background:
                radial-gradient(circle at top left, rgba(93, 214, 44, 0.10), transparent 25%),
                linear-gradient(180deg, #050505 0%, #090909 100%);
            color: #f5f5f5;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        .grid-lines {
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 36px 36px;
        }
        .nav-item.active {
            background: rgba(93, 214, 44, 0.12);
            border-color: rgba(93, 214, 44, 0.45);
            color: #5DD62C;
        }
        .nav-item.active i { color: #5DD62C; }
        .toast {
            background: rgba(18, 18, 18, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-left: 3px solid #5DD62C;
            color: #f8f8f8;
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
            opacity: 0;
            transform: translateY(-8px);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.error { border-left-color: #ef4444; }
        .field-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: #7b7b7b;
        }
        .field-input, .field-textarea {
            width: 100%;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.10);
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .field-input:focus, .field-textarea:focus {
            border-color: rgba(93, 214, 44, 0.8);
            box-shadow: 0 0 0 3px rgba(93, 214, 44, 0.12);
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #333; border-radius: 999px; }
        .sales-main-grid {
            display: grid;
            gap: 20px;
            grid-template-columns: minmax(260px, 320px) 1fr;
            align-items: start;
        }
        .sales-deal-list,
        .sales-stage-card {
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 22px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.02));
            box-shadow: 0 24px 50px rgba(0, 0, 0, 0.25);
        }
        .sales-list-head,
        .sales-detail-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            padding: 18px 18px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .sales-list-head strong {
            font-size: 12px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #a5a5a5;
        }
        .sales-list-head span {
            color: #5DD62C;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
        }
        .sales-list-scroll {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 68vh;

            padding: 14px;

        .sales-deal-card {
            text-align: left;

            border-radius: 16px;

            line-height: 1.5;
        }
        .sales-deal-card span {
            color: #b8b8b8;
            font-size: 11px;
            font-weight: 600;
        }
        .sales-deal-card em {

            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }
        .sales-timeline-shell { border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 18px; background: rgba(255, 255, 255, 0.02); overflow: hidden; }
        .sales-timeline-toggle { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .sales-timeline-toggle i { transition: transform 0.2s ease; }

        .sales-timeline-panel { padding: 12px; }

            font-size: 13px;
            line-height: 1.6;

            font-family: 'JetBrains Mono', monospace;

        .sales-pipeline-node.is-active .sales-pipeline-node-index { background: rgba(56, 189, 248, 0.22); color: #7dd3fc; }
        .sales-pipeline-node.is-blocked .sales-pipeline-node-index { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
        .sales-stage-card { padding: 18px; }
        .sales-stage-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
        .sales-stage-head h3 { margin-top: 8px; font-size: 22px; font-weight: 700; color: #fff; }
        .sales-stage-head p { margin-top: 6px; color: #a3a3a3; font-size: 12px; line-height: 1.6; }
        .sales-stage-pill { border-radius: 9999px; padding: 6px 10px; border: 1px solid rgba(255, 255, 255, 0.18); font-size: 10px; letter-spacing: 0.14em; font-weight: 700; text-transform: uppercase; color: #cfcfcf; white-space: nowrap; }
        .sales-stage-pill.is-completed { border-color: rgba(93, 214, 44, 0.45); color: #5DD62C; background: rgba(93, 214, 44, 0.11); }
        .sales-stage-pill.is-active { border-color: rgba(56, 189, 248, 0.5); color: #7dd3fc; background: rgba(56, 189, 248, 0.12); }
        .sales-stage-pill.is-blocked { border-color: rgba(239, 68, 68, 0.5); color: #fca5a5; background: rgba(239, 68, 68, 0.12); }
        .sales-stage-note { border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.03); padding: 12px; color: #b2b2b2; font-size: 13px; line-height: 1.6; min-width: 0; overflow-wrap: anywhere; word-break: break-word; }
        .sales-stage-form-grid, .sales-stage-readonly-grid { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .sales-stage-form-grid label, .sales-stage-confirm label, .sales-stage-readonly-grid div { display: flex; flex-direction: column; gap: 6px; }
        .sales-stage-form-grid label > span, .sales-stage-confirm label > span, .sales-stage-readonly-grid span { color: #7f7f7f; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
        .sales-stage-readonly-grid strong { color: #f4f4f4; font-size: 13px; font-weight: 600; line-height: 1.5; padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.03); }
        .sales-stage-confirm { display: flex; flex-direction: column; gap: 12px; }
        .sales-check-line { display: flex; align-items: flex-start; gap: 10px; border-radius: 12px; border: 1px solid rgba(93, 214, 44, 0.35); background: rgba(93, 214, 44, 0.08); padding: 10px 12px; color: #e5e7eb; font-size: 13px; }
        .sales-check-line input { margin-top: 2px; accent-color: #5DD62C; }
        .sales-span-2 { grid-column: span 2; }
        .sales-action-bar { margin-top: 16px; position: sticky; bottom: 0; z-index: 4; border-radius: 14px; border: 1px solid rgba(93, 214, 44, 0.2); background: rgba(10, 10, 10, 0.92); backdrop-filter: blur(8px); padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
        .sales-action-bar span { color: #a3a3a3; font-size: 11px; }
        .sales-action-buttons { display: flex; gap: 10px; align-items: center; min-width: 0; flex-wrap: wrap; }
        .sales-activity-list { display: flex; flex-direction: column; gap: 10px; }
        .sales-activity-scroll { max-height: min(38vh, 320px); overflow-y: auto; overscroll-behavior: contain; padding-right: 4px; }
        .sales-activity-item { border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.08); background: rgba(255, 255, 255, 0.02); padding: 11px 12px; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
        .sales-activity-item strong { font-size: 12px; color: #f5f5f5; }
        .sales-activity-item span { margin-top: 4px; display: block; font-size: 12px; color: #9ca3af; line-height: 1.5; }
        .sales-activity-item em { font-size: 11px; color: #7f7f7f; font-style: normal; white-space: nowrap; }
        .sales-comments-card { display: flex; flex-direction: column; gap: 16px; }
        .sales-comment-composer, .sales-comment-stage-block { border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.02); padding: 14px; }
        .sales-comment-compose-field, .sales-comment-list { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
        .sales-comment-compose-field > span, .sales-comment-stage-head span, .sales-comment-history-summary span, .sales-comment-history-group-summary span, .sales-comment-role, .sales-comment-author em, .sales-comment-head time { color: #9ca3af; font-size: 11px; }
        .sales-comment-stage-head, .sales-comment-head, .sales-comment-actions, .sales-comment-history-summary, .sales-comment-history-group-summary { display: flex; align-items: center; gap: 10px; }
        .sales-comment-head { align-items: flex-start; }
        .sales-comment-author { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
        .sales-comment-stage-head, .sales-comment-head, .sales-comment-history-summary, .sales-comment-history-group-summary { justify-content: space-between; min-width: 0; flex-wrap: wrap; }
        .sales-comment-avatar { width: 38px; height: 38px; flex-shrink: 0; border-radius: 999px; display: grid; place-items: center; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: #d9ffd0; background: linear-gradient(180deg, rgba(93,214,44,0.25), rgba(93,214,44,0.08)); border: 1px solid rgba(93,214,44,0.26); }
        .sales-comment-author-line, .sales-comment-meta-line { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
        .sales-comment-stage-head strong, .sales-comment-history-summary strong, .sales-comment-history-group-summary strong, .sales-comment-author strong { color: #fff; }
        .sales-comment-role { padding: 3px 8px; border-radius: 999px; background: rgba(93,214,44,0.12); color: #8be65f; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
        .sales-comment-item { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015)); }
        .sales-comment-item.is-customer { border-color: rgba(96, 165, 250, 0.2); background: linear-gradient(180deg, rgba(30,41,59,0.55), rgba(15,23,42,0.72)); }
        .sales-comment-item.is-customer .sales-comment-avatar { color: #dbeafe; background: linear-gradient(180deg, rgba(96,165,250,0.28), rgba(96,165,250,0.1)); border-color: rgba(96,165,250,0.3); }
        .sales-comment-item.is-system .sales-comment-avatar { color: #fef3c7; background: linear-gradient(180deg, rgba(245,158,11,0.24), rgba(245,158,11,0.08)); border-color: rgba(245,158,11,0.26); }
        .sales-comment-item p, .sales-comment-reply-context strong { margin: 0; color: #e5e7eb; font-size: 13px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; }
        .sales-comment-body { color: #f3f4f6; font-size: 14px; line-height: 1.72; white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; }
        .sales-comment-reply-banner, .sales-comment-reply-context { display: grid; gap: 4px; padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); border-left: 3px solid rgba(93,214,44,0.5); background: rgba(255,255,255,0.04); min-width: 0; }
        .sales-comment-reply-context {
            gap: 6px;
            padding: 8px 10px;
            background: rgba(38, 53, 85, 0.34);
            border: 1px solid rgba(90, 110, 160, 0.28);
            border-left: 3px solid rgba(120, 146, 214, 0.65);
        }
        .sales-comment-reply-context strong,
        .sales-comment-inline-quote {
            display: inline-flex;
            align-items: center;
            max-width: 100%;
            border-radius: 10px;
            background: rgba(59, 76, 116, 0.45);
            color: #9fb3ea;
            font-size: 12px;
            line-height: 1.5;
            padding: 6px 8px;
            white-space: normal;
            word-break: break-word;
            overflow-wrap: anywhere;
        }
        .sales-comment-inline-stage {
            display: inline-flex;
            align-items: center;
            color: #7f8db3;
            font-size: 10px;
            margin-top: -1px;
        }
        .sales-comment-scroll-region {
            position: relative;
            min-height: min(58vh, 46rem);
            max-height: min(58vh, 46rem);
            overflow-y: scroll;
            overscroll-behavior: contain;
            scrollbar-gutter: stable;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
        }
        .sales-comment-scroll-indicator {
            position: sticky;
            top: 12px;
            right: 6px;
            margin-left: auto;
            width: 6px;
            height: calc(100% - 24px);
            border-radius: 999px;
            background: rgba(255,255,255,0.08);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .sales-comment-scroll-region[data-scrollable="true"] .sales-comment-scroll-indicator {
            opacity: 1;
        }
        .sales-comment-scroll-thumb {
            display: block;
            width: 100%;
            min-height: 36px;
            border-radius: inherit;
            background: linear-gradient(180deg, rgba(93,214,44,0.95), rgba(93,214,44,0.55));
            box-shadow: 0 0 0 1px rgba(93,214,44,0.18);
            transition: transform 0.08s linear;
        }
        .sales-pipeline-main-shell {
            height: calc(100dvh - 5rem);
        }
        .sales-task-actions {
            width: 100%;
            min-width: 0;
        }
        .sales-task-action-btn {
            min-width: 0;
        }
        .sales-stage-tabs-shell {
            padding-top: 14px;
            padding-bottom: 12px;
            overflow-x: auto;
            overflow-y: visible;
            min-height: 58px;
        }
        .sales-stage-tabs-row {
            min-height: 30px;
            align-items: center;
        }
        .sales-comment-history, .sales-comment-history-group { border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.02); overflow: hidden; }
        .sales-comment-history-summary, .sales-comment-history-group-summary { cursor: pointer; padding: 14px; }
        .sales-comment-history-body, .sales-comment-history-group .sales-comment-list { padding: 0 14px 14px; }
        .sales-comment-history summary, .sales-comment-history-group summary { list-style: none; }
        .sales-comment-history summary::-webkit-details-marker, .sales-comment-history-group summary::-webkit-details-marker { display: none; }
        .sales-empty, .sales-loading, .sales-empty-card { border-radius: 18px; border: 1px dashed rgba(255, 255, 255, 0.15); background: rgba(255, 255, 255, 0.03); color: #9ca3af; padding: 18px; font-size: 13px; line-height: 1.6; }
        .sales-loading { display: flex; align-items: center; gap: 10px; }
        .sales-empty-card h3 { font-family: 'Oswald', sans-serif; text-transform: uppercase; font-size: 26px; color: #fff; margin-bottom: 6px; }
        @media (max-width: 1279px) {
            .sales-main-grid { grid-template-columns: 1fr; }

        }

            }

                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);

            }

                width: 100%;

                text-align: center;
            }
            .sales-list-head { align-items: center; padding: 14px 14px 10px; }
            .sales-list-actions { max-width: 68%; justify-content: flex-end; }
            .sales-list-count { font-size: 11px; }
            .sales-list-toggle { font-size: 9px; letter-spacing: 0.08em; padding: 6px 10px; }
            .sales-list-scroll { display: flex; flex-direction: column; gap: 8px; max-height: min(46vh, 340px); overflow-x: hidden; overflow-y: auto; padding: 10px 12px 12px; overscroll-behavior: contain; }

            .sales-comment-scroll-region {

                max-height: none;
                flex: 1 1 auto;
            }
            .sales-comment-scroll-indicator {

                right: 4px;

        }
    </style>
</head>
<body class="min-h-screen">
    <div id="auth-loader" class="fixed inset-0 bg-[#050505] z-[80] flex items-center justify-center">
        <div class="flex flex-col items-center gap-4">
            <div class="gas-loading-spinner"></div>
            <span class="text-gray-500 font-mono text-xs uppercase tracking-widest" data-i18n="loaderWorkspace">Loading workspace...</span>
        </div>
    </div>
    <div id="toast-container" class="fixed top-20 right-4 z-[100] flex w-[min(92vw,420px)] flex-col gap-2 pointer-events-none"></div>

    <script src="/shared/ui/site-shell.config.js?v=20260321auth02"></script>
    <script src="/shared/ui/site-shell.shared.js?v=20260330shell02"></script>
    <script src="/shared/ui/main-auth.shared.js?v=20260322authshared01"></script>
    <script src="/account/sales-pipeline.portal.js?v=20260421salesTab05"></script>
    <script>
        const MAIN_AUTH = window.GASGX_SITE_SHELL_CONFIG?.site?.mainAuth || {};
        const MAIN_AUTH_HELPER = window.GasGxMainAuthShared;
        const MAIN_AUTH_CONFIG = MAIN_AUTH_HELPER.resolveConfig(MAIN_AUTH);
        const SIGN_IN_URL = MAIN_AUTH_CONFIG.signInUrl;
        const client = MAIN_AUTH_HELPER.createClient(window.supabase, MAIN_AUTH_CONFIG);

        let currentUser = null;

        const PAGE_I18N = {
            en: {
                pageTitle: 'Sales Pipeline - GasGx',
                loaderWorkspace: 'Loading workspace...',
                menu: 'Menu',
                sidebarWorkspace: 'Workspace',
                sidebarAccount: 'Account',
                sidebarDesc: 'User profile, security, preferences, and saved content.',
                navOverview: 'Overview',
                navSaved: 'Saved',
                navProfile: 'Profile',
                navSecurity: 'Security',
                navPreferences: 'Preferences',
                navSales: 'Sales Pipeline',
                signOut: 'Sign out',
                salesKicker: 'Sales Pipeline',
                salesTitle: 'Customer Deal Workflow',
                salesDesc: 'All customer-side milestones are handled here. Requirement, quote, contract, and factory acceptance confirmations are submitted in this tab only.',
                userFallback: 'User',
                noEmail: 'No email'
            },
            zh: {
                pageTitle: '销售流水线 - GasGx',
                loaderWorkspace: '正在加载工作区...',
                menu: '菜单',
                sidebarWorkspace: '工作区',
                sidebarAccount: '账户中心',
                sidebarDesc: '统一管理用户资料、安全、偏好和收藏内容。',
                navOverview: '总览',
                navSaved: '收藏',
                navProfile: '资料',
                navSecurity: '安全',
                navPreferences: '偏好',
                navSales: '销售流水线',
                signOut: '退出登录',
                salesKicker: '销售流水线',
                salesTitle: '客户交易流程',
                salesDesc: '客户侧里程碑都在此处理。需求、报价、合同和验收确认均在此标签内提交。',
                userFallback: '用户',
                noEmail: '无邮箱'
            }
        };

        PAGE_I18N.zh = {
            pageTitle: '销售流水线 - GasGx',
            loaderWorkspace: '正在加载工作区...',
            menu: '菜单',
            sidebarWorkspace: '工作区',
            sidebarAccount: '账户中心',
            sidebarDesc: '统一管理用户资料、安全、偏好和收藏内容。',
            navOverview: '总览',
            navSaved: '收藏',
            navProfile: '资料',
            navSecurity: '安全',
            navPreferences: '偏好',
            navSales: '销售流水线',
            signOut: '退出登录',
            salesKicker: '销售流水线',
            salesTitle: '客户交易流程',
            salesDesc: '客户侧里程碑都在此处理。需求、报价、合同和验收确认均在此标签内提交。',
            userFallback: '用户',
            noEmail: '无邮箱'
        };

        function normalizeLang(langCandidate) {
            return String(langCandidate || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';
        }

        function currentLang() {
            try {
                const stored = window.localStorage.getItem('gasgx-lang') || window.localStorage.getItem('gas_lang');
                if (stored) return normalizeLang(stored);
            } catch (_error) {}
            return normalizeLang(document.documentElement.getAttribute('lang') || 'en');
        }

        function t(key) {
            const lang = currentLang();
            return PAGE_I18N[lang]?.[key] || PAGE_I18N.en[key] || key;
        }

        function applyPageI18n() {
            document.title = t('pageTitle');
            document.querySelectorAll('[data-i18n]').forEach((node) => {
                const key = node.dataset.i18n;
                node.textContent = t(key);
            });
            if (currentUser) {
                const fallbackName = currentUser.email ? currentUser.email.split('@')[0] : t('userFallback');
                document.getElementById('sidebar-name').textContent = fallbackName;
                document.getElementById('sidebar-email').textContent = currentUser.email || t('noEmail');
            }
        }

        window.toggleSalesSidebar = function() {
            const sidebar = document.getElementById('sales-sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            const shouldOpen = sidebar.classList.contains('-translate-x-full');
            sidebar.classList.toggle('-translate-x-full', !shouldOpen);
            overlay.classList.toggle('hidden', !shouldOpen);
        };

        window.handleSignOut = async function() {
            document.getElementById('auth-loader').classList.remove('hidden');
            await MAIN_AUTH_HELPER.signOut({
                client,
                runtimeConfig: MAIN_AUTH_CONFIG,
                redirectTo: SIGN_IN_URL,
                errorLabel: 'Account sign-out failed:'
            });
        };

        async function bootstrapSalesPage() {
            try {
                if (!client?.auth) {
                    document.getElementById('auth-loader').classList.add('hidden');
                    return;
                }

                let session = null;

                const { data, error } = await client.auth.getSession();
                session = data?.session;

                if (error || !session?.user) {
                    const waitForSession = new Promise((resolve) => {
                        const timeout = setTimeout(() => resolve(null), 800);
                        const authListener = client.auth.onAuthStateChange((_event, nextSession) => {
                            if (nextSession?.user) {
                                clearTimeout(timeout);
                                const subscription = authListener?.data?.subscription || authListener?.subscription || authListener;
                                if (subscription && typeof subscription.unsubscribe === 'function') {
                                    subscription.unsubscribe();
                                }
                                resolve(nextSession);
                            }
                        });
                    });
                    session = await waitForSession;
                }

                if (!session?.user) {
                    window.location.replace(SIGN_IN_URL);
                    return;
                }
                currentUser = session.user;
                const fallbackName = currentUser.email ? currentUser.email.split('@')[0] : t('userFallback');
                document.getElementById('sidebar-name').textContent = fallbackName;
                document.getElementById('sidebar-email').textContent = currentUser.email || t('noEmail');
                document.getElementById('sidebar-avatar').textContent = fallbackName.charAt(0).toUpperCase();
                document.dispatchEvent(new CustomEvent('gasgx-account-ready'));
                window.GasGxSalesPipelinePortal?.onTabActivated?.();
            } finally {
                document.getElementById('auth-loader').classList.add('hidden');
            }
        }

        document.addEventListener('gasgx:lang-changed', () => {
            applyPageI18n();
        });

        window.addEventListener('storage', (event) => {
            if (event.key === 'gasgx-lang' || event.key === 'gas_lang') {
                applyPageI18n();
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            applyPageI18n();
            bootstrapSalesPage();
        });
    </script>
</body>
