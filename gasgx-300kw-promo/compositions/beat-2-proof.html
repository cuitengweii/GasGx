<template id="beat-2-proof-template">
  <div
    id="root-beat-2-proof"
    data-composition-id="beat-2-proof"
    data-start="0"
    data-duration="5.5"
    data-width="1920"
    data-height="1080"
  >
    <div class="scene">
      <div class="glow"></div>
      <div class="copy">
        <div class="eyebrow">GASGX G300</div>
        <h2>Three proof points. One compact power package.</h2>
      </div>
      <div class="stage">
        <div class="cards">
          <div class="stat stat-a">
            <span>CONTINUOUS POWER</span>
            <strong><b id="kw">300</b><em>KW</em></strong>
          </div>
          <div class="stat stat-b">
            <span>ELECTRICAL EFFICIENCY</span>
            <strong><b id="eff">37</b><em>%</em></strong>
          </div>
          <div class="stat stat-c">
            <span>CORE ENGINE</span>
            <strong>CUMMINS-15N</strong>
          </div>
        </div>
        <div class="photo-wrap">
          <img class="photo" src="capture/assets/gasgx-g300-generator-set-exterior.png" />
        </div>
      </div>
      <div class="logo-strip">
        <div class="logo-card"><img src="capture/assets/leroy-somer-logo.png" /></div>
        <div class="logo-card"><img src="capture/assets/logo-e22767fb.svg" /></div>
        <div class="logo-card"><img src="capture/assets/logo-c35df193.svg" /></div>
      </div>
      <div class="scan"></div>
    </div>
    <style>
      @font-face {
        font-family: "InterCaptured";
        src: url("capture/assets/fonts/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVuOKfMZg.ttf") format("truetype");
      }

      #root-beat-2-proof {
        overflow: hidden;
        width: 1920px;
        height: 1080px;
        background: #090909;
        color: #ffffff;
        font-family: "InterCaptured", Inter, Arial, sans-serif;
      }

      .scene {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background:
          radial-gradient(circle at 75% 22%, rgba(93, 214, 44, 0.18), transparent 290px),
          #090909;
      }

      .glow {
        position: absolute;
        inset: 96px 88px;
        border: 1px solid rgba(93, 214, 44, 0.18);
        border-radius: 8px;
        box-shadow: inset 0 0 80px rgba(93, 214, 44, 0.05);
      }

      .copy {
        position: absolute;
        left: 100px;
        top: 82px;
        width: 960px;
      }

      .eyebrow {
        color: #5dd62c;
        font-size: 18px;
        font-weight: 900;
      }

      h2 {
        margin: 22px 0 0;
        color: #ffffff;
        font-size: 68px;
        font-weight: 900;
        line-height: 1.05;
        letter-spacing: 0;
      }

      .stage {
        position: absolute;
        left: 100px;
        right: 100px;
        top: 274px;
        bottom: 232px;
        display: grid;
        grid-template-columns: 680px 1fr;
        gap: 42px;
        perspective: 1100px;
      }

      .cards {
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: repeat(3, 164px);
        align-content: start;
        gap: 22px;
      }

      .stat {
        position: relative;
        overflow: hidden;
        height: 164px;
        padding: 24px 34px;
        border: 1px solid rgba(93, 214, 44, 0.34);
        border-radius: 8px;
        background:
          radial-gradient(circle at 84% 24%, rgba(93, 214, 44, 0.15), transparent 128px),
          linear-gradient(135deg, rgba(93, 214, 44, 0.08), rgba(255, 255, 255, 0.02)),
          #141414;
        box-shadow: inset 0 0 0 1px rgba(93, 214, 44, 0.08), 0 18px 40px rgba(93, 214, 44, 0.08);
      }

      .stat span {
        display: block;
        color: #94a3b8;
        font-size: 18px;
        font-weight: 800;
      }

      .stat strong {
        display: flex;
        align-items: baseline;
        gap: 12px;
        margin-top: 18px;
        color: #f8f8f8;
        font-size: 60px;
        font-weight: 900;
        font-variant-numeric: tabular-nums;
      }

      .stat-c strong {
        font-size: 54px;
      }

      .stat em {
        color: #5dd62c;
        font-size: 26px;
        font-style: normal;
      }

      .photo-wrap {
        overflow: hidden;
        border: 1px solid rgba(93, 214, 44, 0.38);
        border-radius: 8px;
        background: #141414;
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.58), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }

      .photo {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .logo-strip {
        position: absolute;
        left: 100px;
        right: 100px;
        bottom: 78px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 24px;
      }

      .logo-card {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 122px;
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 8px;
        background: #141414;
      }

      .logo-card img {
        max-width: 72%;
        max-height: 68px;
      }

      .scan {
        position: absolute;
        left: 0;
        top: 0;
        width: 280px;
        height: 100%;
        opacity: 0;
        background: linear-gradient(90deg, transparent, rgba(93, 214, 44, 0.22), transparent);
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var kwNode = document.getElementById("kw");
      var effNode = document.getElementById("eff");
      var kwProxy = { kwValue: 0 };
      var effProxy = { effValue: 0 };

      tl.fromTo(".copy", { y: 54, opacity: 0 }, { y: 0, opacity: 1, duration: 0.62, ease: "power3.out" }, 0.15);
      tl.fromTo(".stat-a", { x: -90, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: "expo.out" }, 0.55);
      tl.fromTo(".stat-b", { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "back.out(1.3)" }, 0.82);
      tl.fromTo(".stat-c", { x: 90, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: "circ.out" }, 1.09);
      tl.fromTo(".photo-wrap", { y: 72, opacity: 0, rotationY: -8 }, { y: 0, opacity: 1, rotationY: 0, duration: 0.72, ease: "power4.out" }, 0.72);
      tl.to(".photo", { scale: 1.04, duration: 5.5, ease: "none" }, 0);
      tl.fromTo(".logo-card", { y: 46, opacity: 0 }, { y: 0, opacity: 1, duration: 0.42, stagger: 0.12, ease: "power2.out" }, 2.15);
      tl.fromTo(".scan", { x: -300, opacity: 0 }, { x: 2060, opacity: 1, duration: 1.0, ease: "power2.inOut" }, 2.55);
      tl.to(".scan", { opacity: 0, duration: 0.2, ease: "power1.out" }, 3.56);
      tl.to(".glow", { boxShadow: "inset 0 0 110px rgba(93, 214, 44, 0.09)", duration: 1.4, yoyo: true, repeat: 2, ease: "sine.inOut" }, 0);
      tl.to(kwProxy, {
        kwValue: 300,
        duration: 1.0,
        ease: "power2.out",
        onUpdate: function () {
          kwNode.textContent = Math.round(kwProxy.kwValue);
        },
      }, 0.72);
      tl.to(effProxy, {
        effValue: 37,
        duration: 0.9,
        ease: "power2.out",
        onUpdate: function () {
          effNode.textContent = Math.round(effProxy.effValue);
        },
      }, 1.05);
      window.__timelines["beat-2-proof"] = tl;
    </script>
  </div>
</template>
