    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var price = document.getElementById("price");
      var proxy = { value: 0 };
      tl.fromTo(".bg-product", { y: -70, opacity: 0 }, { y: 0, opacity: 0.55, duration: 0.65, ease: "power3.out" }, 0.12);
      tl.to(".bg-product img", { scale: 1.035, duration: 5, ease: "none" }, 0);
      tl.fromTo(".diagram", { x: 80, opacity: 0 }, { x: 0, opacity: 0.36, duration: 0.58, ease: "circ.out" }, 0.74);
      tl.to(".diagram img", { scale: 1.025, duration: 5, ease: "none" }, 0);
      tl.fromTo(".quote", { y: 78, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "expo.out" }, 0.55);
      tl.to(proxy, {
        value: 36800,
        duration: 1.0,
        ease: "power2.out",
        onUpdate: function () {
          price.textContent = Math.round(proxy.value);
        },
      }, 0.9);
      tl.fromTo(".scope", { y: 62, opacity: 0 }, { y: 0, opacity: 1, duration: 0.52, stagger: 0.16, ease: "power2.out" }, 1.55);
      tl.fromTo(".final", { x: 80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.62, ease: "power4.out" }, 2.05);
      tl.to("button", { boxShadow: "0 0 58px rgba(93, 214, 44, 0.42)", duration: 0.78, yoyo: true, repeat: 3, ease: "sine.inOut" }, 2.55);
      tl.to(".scene", { opacity: 0, duration: 0.5, ease: "power2.in" }, 4.5);
      tl.set(".scene", { opacity: 0, visibility: "hidden" }, 5);
      window.__timelines["beat-4-cta"] = tl;
    </script>
