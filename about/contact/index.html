<!DOCTYPE html>
<html lang="zh" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact GasGx | 联系我们</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gas: {
                            bg: '#0F0F0F',
                            card: '#202020',
                            green: '#5DD62C',
                            darkGreen: '#337418',
                            text: '#F8F8F8',
                            subtext: '#94a3b8'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    boxShadow: {
                        'glow': '0 0 10px rgba(93, 214, 44, 0.3)',
                        'glow-strong': '0 0 20px rgba(93, 214, 44, 0.6)',
                    },
                    backgroundImage: {
                        'grid-pattern': "linear-gradient(to right, #1a1a1a 1px, transparent 1px), linear-gradient(to bottom, #1a1a1a 1px, transparent 1px)",
                    }
                }
            }
        }
    </script>

    <style>
        :root { color-scheme: dark; }
        body { background-color: #0F0F0F; color: #F8F8F8; font-family: 'Inter', sans-serif; overflow-x: hidden; display: flex; flex-direction: column; min-height: 100vh; }

        /* 滚动条 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0F0F0F; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #5DD62C; }

        /* 卡片效果 */
        .gas-card { background-color: rgba(32, 32, 32, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .gas-card-hover { transition: all 0.3s ease; }
        .gas-card-hover:hover { transform: translateY(-5px); border-color: #5DD62C; box-shadow: 0 10px 30px rgba(93, 214, 44, 0.1); }

        /* 背景网格 */
        .bg-grid { background-size: 40px 40px; mask-image: linear-gradient(to bottom, transparent, 10%, black, 90%, transparent); }

        /* 二维码占位背景 */
        .qr-placeholder {
            background-image: repeating-linear-gradient(45deg, #1a1a1a 25%, transparent 25%, transparent 75%, #1a1a1a 75%, #1a1a1a), repeating-linear-gradient(45deg, #1a1a1a 25%, #0F0F0F 25%, #0F0F0F 75%, #1a1a1a 75%, #1a1a1a);
            background-position: 0 0, 10px 10px;
            background-size: 20px 20px;
        }
    </style>

    <script>
        window.app = window.app || {};
    </script>

    <link rel="stylesheet" href="/shared/ui/site-shell.shared.css">
</head>
<body class="flex flex-col min-h-screen relative selection:bg-gas-green selection:text-black">

    <div id="ggx-site-header-slot"></div>

    <main class="flex-grow pt-16 w-full relative">
        <div class="absolute inset-0 bg-grid-pattern bg-grid opacity-20 pointer-events-none"></div>
        <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-gas-green opacity-[0.05] blur-[150px] rounded-full pointer-events-none"></div>

        <section class="max-w-5xl mx-auto px-6 py-20 relative z-10">
            <div class="text-center mb-16">
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-gas-green/30 bg-gas-green/10 text-gas-green text-xs font-bold tracking-wider mb-6">
                    <span class="w-2 h-2 rounded-full bg-gas-green animate-pulse"></span>
                    <span data-i18n="page_badge">24/7 SUPPORT</span>
                </div>
                <h1 class="text-4xl md:text-5xl font-bold mb-6">
                    <span data-i18n="page_title">Get in Touch</span>
                </h1>
                <p class="text-lg text-gas-subtext max-w-2xl mx-auto" data-i18n="page_desc">
                    无论是项目咨询、白皮书索取还是技术合作，GasGx 团队随时为您提供支持。
                </p>
            </div>

            <div class="grid md:grid-cols-2 gap-8 max-w-4xl mx-auto">
                <div class="gas-card gas-card-hover rounded-xl p-8 flex flex-col items-center text-center group cursor-pointer" onclick="window.location.href='mailto:contact@gasgx.com'">
                    <div class="w-16 h-16 bg-gas-green/10 rounded-full flex items-center justify-center mb-6 text-gas-green border border-gas-green/20 group-hover:bg-gas-green group-hover:text-black transition-colors">
                        <i class="fa-solid fa-envelope text-2xl"></i>
                    </div>
                    <h3 class="text-xl font-bold text-white mb-2" data-i18n="contact_email">Email Us</h3>
                    <p class="text-gas-green font-mono text-lg mb-4">contact@gasgx.com</p>
                    <span class="text-xs text-gas-subtext" data-i18n="email_desc">Click to send mail directly</span>
                </div>

                <div class="gas-card rounded-xl p-8">
                    <h3 class="text-xl font-bold text-white mb-6 text-center" data-i18n="social_title">Social Networks</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div onclick="window.app.showQR('wechat', 'WeChat')" class="bg-[#111] border border-white/10 rounded-lg p-4 flex flex-col items-center justify-center hover:border-gas-green hover:bg-gas-green/5 cursor-pointer transition-all">
                            <i class="fa-brands fa-weixin text-3xl text-green-500 mb-2"></i>
                            <span class="text-sm text-gas-subtext">WeChat</span>
                        </div>
                        <div onclick="window.app.showQR('telegram', 'Telegram')" class="bg-[#111] border border-white/10 rounded-lg p-4 flex flex-col items-center justify-center hover:border-gas-green hover:bg-gas-green/5 cursor-pointer transition-all">
                            <i class="fa-brands fa-telegram text-3xl text-blue-400 mb-2"></i>
                            <span class="text-sm text-gas-subtext">Telegram</span>
                        </div>
                        <div onclick="window.app.showQR('twitter', 'Twitter / X')" class="bg-[#111] border border-white/10 rounded-lg p-4 flex flex-col items-center justify-center hover:border-gas-green hover:bg-gas-green/5 cursor-pointer transition-all">
                            <i class="fa-brands fa-x-twitter text-3xl text-white mb-2"></i>
                            <span class="text-sm text-gas-subtext">Twitter</span>
                        </div>
                        <div onclick="window.app.showQR('whatsapp', 'WhatsApp')" class="bg-[#111] border border-white/10 rounded-lg p-4 flex flex-col items-center justify-center hover:border-gas-green hover:bg-gas-green/5 cursor-pointer transition-all">
                            <i class="fa-brands fa-whatsapp text-3xl text-green-400 mb-2"></i>
                            <span class="text-sm text-gas-subtext">WhatsApp</span>
                        </div>
                    </div>
                    <p class="text-xs text-center text-gas-subtext mt-6" data-i18n="social_hint">Click icon to scan QR code</p>
                </div>
            </div>
        </section>
    </main>

    <div id="ggx-site-footer-slot"></div>

    <div id="qr-modal" class="hidden fixed inset-0 z-[60] flex items-center justify-center bg-black/90 backdrop-blur-sm transition-opacity opacity-0">
        <div class="gas-card p-6 rounded-xl max-w-sm w-full mx-4 shadow-glow transform scale-95 transition-all relative">
            <button onclick="window.app.closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white transition-colors">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>

            <div class="text-center">
                <h3 id="modal-title" class="text-xl font-bold text-white mb-1">WeChat</h3>
                <p class="text-xs text-gas-subtext mb-6" data-i18n="scan_hint">Scan QR code to connect</p>

                <div class="bg-white p-2 rounded-lg inline-block shadow-[0_0_15px_rgba(255,255,255,0.1)]">
                    <img id="modal-qr-img" src="" alt="QR Code"
                         class="w-48 h-48 object-contain block"
                         onerror="window.app.handleImageError(this)">

                    <div id="qr-fallback" class="w-48 h-48 bg-[#f0f0f0] hidden flex-col items-center justify-center text-gray-400 qr-placeholder">
                        <i class="fa-solid fa-qrcode text-4xl mb-2 opacity-20"></i>
                        <span class="text-[10px] uppercase tracking-wide">Image Missing</span>
                        <span id="missing-filename" class="text-[9px] font-mono mt-1 text-gray-500">filename.png</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const I18N_DATA = {
            'zh': {
                'tagline': '天然气发电挖矿助手',
                'nav_home': '首页',
                'nav_about': '关于我们',
                'nav_research': '研究报告',
                'nav_contact': '联系我们',
                'page_badge': '24/7 全天候支持',
                'page_title': '联系我们',
                'page_desc': '无论是项目咨询、白皮书索取还是技术合作，GasGx 团队随时为您提供支持。',
                'contact_email': '邮件咨询',
                'email_desc': '点击直接发送邮件',
                'social_title': '社交网络',
                'social_hint': '点击图标扫描二维码',
                'scan_hint': '扫描二维码添加好友/关注',
                'footerTagline': '让天然气发电挖矿更简单',
                'contact_us': '联系我们',
                'privacy_policy': '隐私政策'
            },
            'en': {
                'tagline': 'Natural Gas Power Mining Assistant',
                'nav_home': 'Home',
                'nav_about': 'About Us',
                'nav_research': 'Research',
                'nav_contact': 'Contact',
                'page_badge': '24/7 SUPPORT',
                'page_title': 'Get in Touch',
                'page_desc': 'Whether for project inquiries, whitepapers, or technical partnerships, the GasGx team is here to help.',
                'contact_email': 'Email Us',
                'email_desc': 'Click to send mail directly',
                'social_title': 'Social Networks',
                'social_hint': 'Click icon to scan QR code',
                'scan_hint': 'Scan QR code to connect',
                'footerTagline': 'Making natural gas power mining easier',
                'contact_us': 'Contact Us',
                'privacy_policy': 'Privacy Policy'
            },
            'ru': {
                'tagline': 'Помощник по майнингу на газе',
                'nav_home': 'Главная',
                'nav_about': 'О нас',
                'nav_research': 'Отчеты',
                'nav_contact': 'Контакты',
                'page_badge': '24/7 Поддержка',
                'page_title': 'Связаться с нами',
                'page_desc': 'Команда GasGx всегда готова помочь с вопросами по проектам, отчетами или сотрудничеством.',
                'contact_email': 'Напишите нам',
                'email_desc': 'Нажмите, чтобы отправить письмо',
                'social_title': 'Социальные сети',
                'social_hint': 'Нажмите для сканирования QR',
                'scan_hint': 'Сканируйте QR для связи',
                'footerTagline': 'Майнинг на газе стал проще',
                'contact_us': 'Контакты',
                'privacy_policy': 'Политика конфиденциальности'
            }
        };

        const QR_ASSETS = {
            'wechat': 'assets/qr_wechat.png',
            'telegram': 'assets/qr_telegram.png',
            'twitter': 'assets/qr_twitter.png',
            'whatsapp': 'assets/qr_whatsapp.png'
        };

        window.app = {
            lang: localStorage.getItem('gas_lang') || 'en',

            init() {
                this.setLanguage(this.lang);
            },

            setLanguage(lang) {
                this.lang = lang;
                localStorage.setItem('gas_lang', lang);
                const dict = I18N_DATA[lang] || I18N_DATA['en'];

                // 修复：更安全地更新按钮状态
                const langs = ['zh', 'en', 'ru'];
                langs.forEach(l => {
                    const btn = document.getElementById(`btn-lang-${l}`);
                    if (!btn) return;

                    if (l === lang) {
                        // Active state
                        btn.classList.remove('text-gas-subtext', 'font-medium');
                        btn.classList.add('text-black', 'bg-gas-green', 'shadow-glow', 'font-bold');
                    } else {
                        // Inactive state
                        btn.classList.remove('text-black', 'bg-gas-green', 'shadow-glow', 'font-bold');
                        btn.classList.add('text-gas-subtext', 'font-medium');
                    }
                });

                // 修复：更新文本时保留图标
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (dict[key]) {
                        // 如果元素内有图标（i标签），保留它
                        const icon = el.querySelector('i');
                        if (icon) {
                            el.innerHTML = ''; // 清空
                            el.appendChild(icon); // 放回图标
                            el.append(' ' + dict[key]); // 添加文本
                        } else {
                            el.innerText = dict[key];
                        }
                    }
                });
            },

            showQR(platform, title) {
                const modal = document.getElementById('qr-modal');
                const modalTitle = document.getElementById('modal-title');
                const img = document.getElementById('modal-qr-img');
                const fallback = document.getElementById('qr-fallback');
                const missingText = document.getElementById('missing-filename');

                // 1. 设置内容
                modalTitle.innerText = title;
                const src = QR_ASSETS[platform];
                img.src = src;
                missingText.innerText = src;

                // 2. 强制重置状态：先显示图片，隐藏 fallback
                // 这样每次打开都是尝试加载图片的状态
                img.style.display = 'block';
                fallback.style.display = 'none';

                // 3. 显示弹窗
                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    modal.querySelector('.gas-card').classList.remove('scale-95');
                    modal.querySelector('.gas-card').classList.add('scale-100');
                }, 10);
            },

            // 处理图片加载错误
            handleImageError(img) {
                const fallback = document.getElementById('qr-fallback');
                img.style.display = 'none';
                fallback.style.display = 'flex';
            },

            closeModal() {
                const modal = document.getElementById('qr-modal');
                const card = modal.querySelector('.gas-card');

                modal.classList.add('opacity-0');
                card.classList.remove('scale-100');
                card.classList.add('scale-95');

                setTimeout(() => {
                    modal.classList.add('hidden');
                }, 300);
            }
        };

        // 事件委托：关闭弹窗
        document.getElementById('qr-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                window.app.closeModal();
            }
        });

        // 启动
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => window.app.init());
        } else {
            window.app.init();
        }
    </script>

    <div id="ggx-back-to-top-slot"></div>
    <div id="ggx-chatbot-slot"></div>
    <script src="/shared/ui/site-shell.config.js"></script>
    <script src="/shared/ui/site-shell.shared.js"></script>
</body>
</html>
