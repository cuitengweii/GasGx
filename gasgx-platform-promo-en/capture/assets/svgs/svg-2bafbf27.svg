<svg class="absolute inset-0 w-full h-full z-10" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <linearGradient id="pipe-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#333;stop-opacity:1"></stop>
                            <stop offset="50%" style="stop-color:#555;stop-opacity:1"></stop>
                            <stop offset="100%" style="stop-color:#333;stop-opacity:1"></stop>
                        </linearGradient>
                        <linearGradient id="cable-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#1a1a24;stop-opacity:1"></stop>
                            <stop offset="50%" style="stop-color:#2a2a35;stop-opacity:1"></stop>
                            <stop offset="100%" style="stop-color:#1a1a24;stop-opacity:1"></stop>
                        </linearGradient>
                        <filter id="glow-accent-strong">
                            <feGaussianBlur stdDeviation="3" result="coloredBlur"></feGaussianBlur>
                            <feMerge>
                                <feMergeNode in="coloredBlur"></feMergeNode>
                                <feMergeNode in="SourceGraphic"></feMergeNode>
                            </feMerge>
                        </filter>
                    </defs>

                    <!-- 地平线 -->
                    <line x1="0" y1="480" x2="1200" y2="480" stroke="#1f1f2e" stroke-width="2"></line>
                    
                    <!-- 1. 天然气井口装置 -->
                    <g transform="translate(150, 360)">
                        <rect x="0" y="0" width="60" height="120" fill="#2a2a35" stroke="#111" stroke-width="2"></rect>
                        <rect x="-20" y="-20" width="100" height="20" fill="#3a3a45" stroke="#111" stroke-width="2"></rect>
                        <rect x="20" y="-60" width="20" height="40" fill="#2a2a35" stroke="#111"></rect>
                        <circle cx="30" cy="-60" r="8" fill="#F7931A" filter="url(#glow-accent-strong)">
                            <animate attributeName="opacity" values="0.8;1;0.8" dur="0.5s" repeatCount="indefinite"></animate>
                        </circle>
                        <text x="30" y="150" font-family="monospace" font-weight="bold" font-size="14" fill="#a1a1aa" text-anchor="middle" class="lang-zh">1. 伴生气井口/脱硫站</text>
                        <text x="30" y="150" font-family="monospace" font-weight="bold" font-size="14" fill="#a1a1aa" text-anchor="middle" class="lang-en">1. Flare Gas Wellhead</text>
                        
                        <path d="M60 100 L250 100" stroke="url(#pipe-grad)" stroke-width="12" fill="none"></path>
                        <path d="M60 100 L250 100" stroke="#5DD62C" stroke-width="2" stroke-dasharray="10,10" fill="none" opacity="0.6">
                            <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite"></animate>
                        </path>
                    </g>

                    <!-- 2. 燃气发电机组集装箱 -->
                    <g transform="translate(400, 300)">
                        <rect x="0" y="0" width="320" height="180" fill="#12121A" stroke="#222" stroke-width="4" rx="4"></rect>
                        <rect x="60" y="-50" width="40" height="50" fill="#222" stroke="#111"></rect>
                        <path d="M60 -50 L100 -50 L110 -70 L50 -70 Z" fill="#1a1a1a" stroke="#111"></path>
                        <path d="M80 -70 Q 90 -100 120 -120" stroke="rgba(255,255,255,0.1)" stroke-width="10" fill="none" stroke-linecap="round" filter="url(#glow-accent-strong)"></path>
                        
                        <g transform="translate(30, 40)">
                            <rect x="0" y="0" width="70" height="70" fill="#0d0d12" stroke="#222" rx="4"></rect>
                            <circle cx="35" cy="35" r="30" fill="#050508" stroke="#1a1a24"></circle>
                            <g>
                                <line x1="35" y1="5" x2="35" y2="65" stroke="#222" stroke-width="6"></line>
                                <line x1="5" y1="35" x2="65" y2="35" stroke="#222" stroke-width="6"></line>
                                <animateTransform attributeName="transform" type="rotate" from="0 35 35" to="360 35 35" dur="1s" repeatCount="indefinite"></animateTransform>
                            </g>
                        </g>
                        <text x="200" y="60" font-family="sans-serif" font-weight="900" font-size="28" fill="white">GAS<tspan fill="#5DD62C">GX</tspan></text>
                        <text x="200" y="85" font-family="monospace" font-size="12" fill="#5DD62C" filter="url(#glow-accent-strong)"><tspan class="lang-zh">[ PdM 已保护 ]</tspan><tspan class="lang-en">[ PDM PROTECTED ]</tspan></text>
                        <text x="160" y="210" font-family="monospace" font-weight="bold" font-size="14" fill="#a1a1aa" text-anchor="middle" class="lang-zh">2. 分布式燃气发电机组</text>
                        <text x="160" y="210" font-family="monospace" font-weight="bold" font-size="14" fill="#a1a1aa" text-anchor="middle" class="lang-en">2. Distributed Gas Gen-Set</text>
                        
                        <path d="M320 140 L580 140" stroke="url(#cable-grad)" stroke-width="10" fill="none"></path>
                        <path d="M320 140 L580 140" stroke="#5DD62C" stroke-width="4" stroke-dasharray="15,15" fill="none" opacity="0.9" filter="url(#glow-accent-strong)">
                             <animate attributeName="stroke-dashoffset" from="0" to="30" dur="0.5s" repeatCount="indefinite"></animate>
                        </path>
                    </g>

                    <!-- 3. 比特币矿箱 -->
                    <g transform="translate(980, 300)">
                        <rect x="0" y="0" width="220" height="180" fill="#0a0a0f" stroke="#1f1f2e" stroke-width="4" rx="4"></rect>
                        <g transform="translate(20, 20)">
                            <circle cx="30" cy="30" r="20" fill="#050508" stroke="#222"><animate attributeName="stroke" values="#222;#5DD62C;#222" dur="2s" repeatCount="indefinite"></animate></circle>
                            <circle cx="30" cy="90" r="20" fill="#050508" stroke="#222"></circle>
                            <circle cx="90" cy="30" r="20" fill="#050508" stroke="#222"></circle>
                            <circle cx="90" cy="90" r="20" fill="#050508" stroke="#222"></circle>
                            <circle cx="150" cy="30" r="20" fill="#050508" stroke="#222"></circle>
                            <circle cx="150" cy="90" r="20" fill="#050508" stroke="#222"></circle>
                        </g>
                        <circle cx="110" cy="150" r="22" fill="#F7931A" opacity="0.8"></circle>
                        <text x="110" y="160" font-family="sans-serif" font-weight="bold" font-size="28" fill="white" text-anchor="middle">₿</text>
                        <text x="110" y="210" font-family="monospace" font-weight="bold" font-size="14" fill="#a1a1aa" text-anchor="middle" class="lang-zh">3. 加密算力数据中心</text>
                        <text x="110" y="210" font-family="monospace" font-weight="bold" font-size="14" fill="#a1a1aa" text-anchor="middle" class="lang-en">3. Crypto Mining Center</text>
                    </g>

                    <!-- 4. 现场运维工程师与智能终端 -->
                    <g transform="translate(770, 350)">
                        <path d="M-15 130 L-15 50 L-5 40 L15 40 L25 50 L25 130 Z" fill="#2a2a35" stroke="#111" stroke-width="2"></path>
                        <circle cx="5" cy="25" r="18" fill="#3a3a45" stroke="#111" stroke-width="2"></circle>
                        <rect x="-18" y="130" width="16" height="50" fill="#1a1a24" rx="2"></rect>
                        <rect x="12" y="130" width="16" height="50" fill="#1a1a24" rx="2"></rect>
                        <path d="M-15 50 L-30 85" stroke="#2a2a35" stroke-width="12" stroke-linecap="round"></path>
                        <path d="M25 50 L40 70" stroke="#2a2a35" stroke-width="12" stroke-linecap="round"></path>
                        
                        <g transform="translate(30, 55) rotate(-10)">
                            <rect x="0" y="0" width="55" height="40" fill="#050508" stroke="#444" stroke-width="3" rx="4" filter="url(#glow-accent-strong)"></rect>
                            <rect x="3" y="3" width="49" height="34" fill="#0D0D12" rx="2"></rect>
                            <text x="7" y="12" font-family="sans-serif" font-weight="bold" font-size="6" fill="#5DD62C"><tspan class="lang-zh">SOP：WMS 已就绪</tspan><tspan class="lang-en">SOP: WMS Ready</tspan></text>
                            <rect x="7" y="16" width="41" height="4" fill="#1f1f2e" rx="1"></rect>
                            <rect x="7" y="23" width="20" height="10" fill="#3b82f6" rx="2"></rect>
                            <line x1="3" y1="3" x2="52" y2="3" stroke="#5DD62C" stroke-width="1" opacity="0.5">
                                <animate attributeName="y1" values="3;37;3" dur="2s" repeatCount="indefinite"></animate>
                                <animate attributeName="y2" values="3;37;3" dur="2s" repeatCount="indefinite"></animate>
                            </line>
                        </g>
                        
                        <circle cx="55" cy="75" r="15" fill="none" stroke="#5DD62C" stroke-width="2" opacity="0.8" filter="url(#glow-accent-strong)">
                            <animate attributeName="r" from="15" to="45" dur="1.5s" repeatCount="indefinite"></animate>
                            <animate attributeName="opacity" from="0.8" to="0" dur="1.5s" repeatCount="indefinite"></animate>
                        </circle>
                    </g>
                </svg>