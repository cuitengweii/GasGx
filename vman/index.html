<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VMAN Quote Entry</title>
    <style>
        :root {
            color-scheme: dark;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(180deg, #061727 0%, #000000 100%);
            color: #ffffff;
            font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        .entry-card {
            width: min(92vw, 420px);
            padding: 24px;
            border: 1px solid rgba(93, 214, 44, 0.35);
            border-radius: 18px;
            background: rgba(22, 27, 34, 0.92);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
        }

        .entry-kicker {
            color: #5DD62C;
            font-size: 12px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
        }

        .entry-title {
            margin: 12px 0 8px;
            font-size: 28px;
            font-weight: 800;
        }

        .entry-text {
            margin: 0;
            color: #b0b3b8;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="entry-card">
        <div class="entry-kicker">GasGx Quote</div>
        <div class="entry-title">VMAN</div>
        <p class="entry-text">正在进入统一报价页...</p>
    </div>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const target = new URL('/quote/view.html', window.location.origin);
            target.searchParams.set('brand', 'vman');
            if (params.get('product')) target.searchParams.set('product', params.get('product'));
            if (params.get('lang')) target.searchParams.set('lang', params.get('lang'));
            window.location.replace(target.toString());
        })();
    </script>
</body>
</html>
