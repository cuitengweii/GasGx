        /* 筛选器 */

        .btn-reset { padding: 10px 20px; border: 1px solid #333; background: #202020; color: #ccc; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn-reset:hover { background: #5DD62C; color: #000; border-color: #5DD62C; font-weight: bold; }
        
        /* 卡片网格 */

        // --- 2. 辅助函数：双语提取 ---
        function getLocalizedContent(text, lang) {
            if (!text || typeof text !== 'string') return text;
            const match = text.match(/^(.+?)\s*[（(](.+?)[)）]$/);
            if (match) {
                if (lang === 'en' || lang === 'ru') return match[2]; 
                return text; 
            }
            return text; 
        }

        // --- 3. 终极翻译函数 (Enhanced Version) ---
        function translateText(key, value, lang) {
            if (!value) return '-';
            const dict = I18N_DATA[lang] || I18N_DATA['en'];

            // 3.1 复合字段拆分处理
            // 增强正则：支持 逗号(,), 顿号(、), 斜杠(/), 分号(;), 连接符(&)
            if (['application_scenario', 'gas_source_type', 'cooling_method'].includes(key)) {
                 if (String(value).match(/[,，、\/;&]/)) {
                     const parts = value.split(/[,，、\/;&]/);
                     return parts
                        .map(p => {
                            const cleanP = p.trim();
                            // 递归调用，如果拆分出来的是空的（如&符号两侧），则忽略
                            return cleanP ? translateText(key, cleanP, lang) : null;
                        })
                        .filter(p => p) // 过滤空值
                        .join(', ');    // 用英文逗号重新连接
                 }
            }

            // 3.2 尝试全字/模糊匹配字典
            const strictKey = getDataTranslationKey(value);
            if (strictKey && dict[strictKey]) return dict[strictKey];
            
            // 3.3 缸数 (Cylinders) - 暴力正则替换
            if (key === 'cylinder_configuration' && lang !== 'zh') {
                let text = value;
                text = text.replace(/V型/gi, 'V-Type ');
                text = text.replace(/直列/gi, 'Inline ');
                text = text.replace(/缸/gi, ' Cylinders');
                text = text.replace(/排列/gi, ' Arrangement');
                return getLocalizedContent(text, lang);
            }

            // 3.4 系列 (Series)
            if (key === 'series' && lang !== 'zh') {
                let text = value.replace(/系列/g, ' Series');
                if (text.includes('燃气轮机')) {
                     text = text.replace(/燃气轮机/g, ' Gas Turbine');
                }
                return getLocalizedContent(text, lang);
            }
            
            // 3.5 模型 (Model)
            if (key === 'model' && lang !== 'zh') {
                let text = getLocalizedContent(value, lang);
                text = text.replace(/燃气轮机/g, ' Gas Turbine');
                return text;
            }

            // 3.6 默认处理
            return getLocalizedContent(value, lang);
        }

        function getDataTranslationKey(value) {
            if (!value) return null;
            const v = String(value).trim();
            const vl = v.toLowerCase();
            
            // --- 精确匹配 ---
            if (v === '风冷' || vl === 'air cooling') return 'val_air_cool';
            if (v === '液冷' || vl === 'liquid cooling') return 'val_liquid_cool';
            if (v === '中国生产' || vl === 'made in china') return 'val_china';
            if (v === '海外生产' || vl === 'overseas') return 'val_overseas';
            
            // --- 模糊匹配 ---
            
            // 1. 功率
            if (v.includes('小于') || v === '< 500 kW') return 'val_less_500';
            if (v.includes('500-1000')) return 'val_500_1000';
            if (v.includes('1 MW') || v.includes('> 1 MW')) return 'val_1mw_plus';
            
            // 2. 气源
            if (v === '天然气' || vl === 'natural gas') return 'val_nat_gas';
            if (v === '伴生气' || vl === 'associated gas') return 'val_assoc_gas';
            if (vl.includes('低中烷') || vl.includes('低甲烷') || vl.includes('low methane')) return 'val_low_methane';
            if (vl.includes('沼气') || vl.includes('biogas')) return 'val_biogas';
            if (vl.includes('填埋气') || vl.includes('landfill')) return 'val_landfill';
            if (vl.includes('煤层气') || vl.includes('coal')) return 'val_coal_gas';
            
            // 3. 部署
            if (vl.includes('集装箱') || vl.includes('container')) return 'val_container';
            if (vl.includes('ais') || vl.includes('一体化') || vl === 'ais unit') return 'val_ais';
            if (vl.includes('撬') || vl.includes('skid')) return 'val_skid';
            
            // 4. 应用场景
            if (vl.includes('挖矿') || vl.includes('mining') || vl.includes('crypto')) return 'val_mining';
            if (vl.includes('数据中心') || vl.includes('data center') || vl.includes('datacenter')) return 'val_datacenter';
            if (vl.includes('油田') || vl.includes('oil')) return 'val_oilfield';
            // 常用/主用/Base Load
            if (vl.includes('基本负荷') || vl.includes('常用') || vl.includes('主用') || vl.includes('base load') || vl.includes('prime')) return 'val_prime';
            if (vl.includes('连续') || vl.includes('continuous')) return 'val_continuous';
            if (vl.includes('备用') || vl.includes('standby')) return 'val_standby';
            if (vl.includes('孤岛') || vl.includes('island')) return 'val_island';
            if (vl.includes('并网') || vl.includes('grid')) return 'val_grid';
            if (vl.includes('热电') || vl.includes('chp') || vl.includes('cogen')) return 'val_chp';
            if (vl.includes('重载') || vl.includes('heavy duty') || vl.includes('industrial')) return 'val_heavy_duty';
            // === 新增匹配逻辑 ===
            if (vl.includes('钻井') || vl.includes('钻探') || vl.includes('drilling') || vl.includes('rig')) return 'val_drilling';
            if (vl.includes('分布式') || vl.includes('distributed')) return 'val_distributed';
            if (vl.includes('商业') || vl.includes('commercial')) return 'val_commercial';
            if (vl.includes('调峰') || vl.includes('peak')) return 'val_peak';
            if (vl.includes('温室') || vl.includes('greenhouse')) return 'val_greenhouse';
            
            // 5. 其他特殊词汇
            if (vl.includes('燃气轮机') || vl.includes('gas turbine')) return 'val_gas_turbine';
            if (vl.includes('工业发电') || vl.includes('industrial power')) return 'val_ind_power';
            if (vl.includes('中小型') || vl.includes('small/medium')) return 'val_sm_genset';
            
            return null; 
        }

        // --- 4. 全局 App 对象 ---
        window.app = {
            // 默认设置为英文 (en)
            lang: localStorage.getItem('gas_lang') || 'en',
            
            init() {
                this.setLanguage(this.lang);
                initData();
            },

            setLanguage(lang) {
                this.lang = lang;
                localStorage.setItem('gas_lang', lang);
                const dict = I18N_DATA[lang] || I18N_DATA['en'];

                // 1. 更新按钮状态
                ['zh','en','ru'].forEach(l => {
                    const activeClass = "px-2 py-1 rounded-full text-[10px] font-bold transition-all w-8 text-center text-black bg-gas-green shadow-glow";
                    const inactiveClass = "px-2 py-1 rounded-full text-[10px] font-medium transition-all w-8 text-center text-gas-subtext";
                    
                    const btn = document.getElementById(`btn-lang-${l}`);
                    if(btn) btn.className = l===lang ? activeClass : inactiveClass;

                    const mobBtn = document.getElementById(`mob-btn-lang-${l}`);
                    const mobActive = "px-4 py-2 rounded-full text-xs font-medium transition-all text-black bg-gas-green";
                    const mobInactive = "px-4 py-2 rounded-full text-xs font-bold transition-all text-gray-400";
                    if(mobBtn) mobBtn.className = l===lang ? mobActive : mobInactive;
                });

                // 2. 更新静态文本
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (dict[key]) {
                        if (el.tagName === 'INPUT' && el.type === 'text') {
                             el.placeholder = dict[key];
                        } else {
                             el.innerHTML = el.querySelector('i') ? el.querySelector('i').outerHTML + ' ' + dict[key] : dict[key];
                        }
                    }
                });
                
                const searchInp = document.getElementById('inp-search');
                if(searchInp) searchInp.placeholder = dict['search_placeholder'];

                // 3. 更新筛选器
                this.updateFilterDropdowns(dict);

                // 4. 重新渲染列表
                applyFilters();

                // 5. 刷新弹窗
                if(document.getElementById('modal-overlay').style.display === 'flex' && window.currentModalItem) {
                    openModal(window.currentModalItem);
                }
            },

            updateFilterDropdowns(dict) {
                const selectConfig = {
                    'sel-power': { 'all': 'val_all', '小于500': 'val_less_500', '500-1000': 'val_500_1000', '1 MW': 'val_1mw_plus' },
                    'sel-cool': { 'all': 'val_all', '风冷': 'val_air_cool', '液冷': 'val_liquid_cool' },
                    'sel-gas': { 'all': 'val_all', '天然气': 'val_nat_gas', '伴生气': 'val_assoc_gas', '低中烷': 'val_low_methane' },
                    'sel-deploy': { 'all': 'val_all', '集装箱': 'val_container', '一体化': 'val_ais', '撬': 'val_skid' },
                    'sel-origin': { 'all': 'val_all', '中国': 'val_china', '海外': 'val_overseas' }
                };
                
                for (const [id, map] of Object.entries(selectConfig)) {
                    const select = document.getElementById(id);
                    if (!select) continue;
                    Array.from(select.options).forEach(opt => {
                        for (const [keyPart, transKey] of Object.entries(map)) {
                            if (opt.value === 'all' && keyPart === 'all') {
                                opt.innerText = dict[transKey]; 
                                break;
                            }
                            if (opt.value !== 'all' && opt.value.includes(keyPart)) {
                                opt.innerText = dict[transKey];
                                break;
                            }
                        }
                    });
                }
            },
        };

        // --- 5. 数据逻辑 ---
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
        let allData = [];
        window.currentModalItem = null;

        // 1. 配置路由映射表
        // 键名对应 Select 的 value，键值对应浏览器地址栏的 Path
        const ROUTE_MAP = {
            'power': { 
                '小于500 kW': '/products/power-range/0-500kw', 
                '500-1000 kW': '/products/power-range/500-1000kw', 
                '1 MW以上': '/products/power-range/1mw-plus' 
            },
            'cool': { 
                '风冷': '/products/cooling/air', 
                '液冷': '/products/cooling/liquid' 
            },
            'gas': { 
                '天然气': '/products/gas/natural', 
                '伴生气': '/products/gas/associated', 
                '低中烷值气': '/products/gas/low-methane' 
            },
            'deploy': { 
                '集装箱机组': '/products/deployment/container', 
                '一体化机组 AIS': '/products/deployment/ais', 
                '撬装': '/products/deployment/skid' 
            },
            'origin': { 
                '中国生产': '/products/brands/china', 
                '海外生产': '/products/brands/overseas' 
            }
        };

        // 修改：去掉了 DOM 操作，只打印 Log
        function logDebug(msg, isError = false) {
            if(isError) console.error(msg); else console.log(msg);
        }

        async function initData() {
            logDebug("Connecting to Supabase...");
            
            // 1. 获取数据
            const { data, error } = await _supabase.from(TABLE_NAME).select('*').order('rated_power_kw', { ascending: false });
            
            // 2. 无论成功失败，都关闭加载动画
            const loader = document.getElementById('loading-overlay');
            if (loader) {
                // 添加透明度渐变效果
                loader.style.opacity = '0';
                // 0.5秒后彻底移除（配合CSS的duration-500）
                setTimeout(() => {
                    loader.style.display = 'none';
                }, 500);
            }

            if (error) { logDebug(`Error: ${error.message}`, true); return; }
            if (!data || data.length === 0) { logDebug(`Connected but table ${TABLE_NAME} is empty.`, true); return; }
            
            allData = data;
            logDebug(`Loaded ${data.length} models.`);
            
            // 核心步骤：初始化时从 URL 解析参数
            restoreFromURL();
            applyFilters();
        }

        // 2. 解析当前 URL Path 并设置筛选器
        function restoreFromURL() {
            // 获取当前路径，例如: "/products/power-range/500-1000kw/"
            let path = window.location.pathname;
            
            // 简单清洗：转小写，移除末尾斜杠
            path = path.toLowerCase();
            if (path.endsWith('/')) path = path.slice(0, -1);

            // 如果是首页或空路径，只重置
            if (path === '' || path === '/' || path === '/index.html') {
                resetDropdowns();
                return;
            }

            let matchFound = false;

            // 遍历映射表
            for (const cat in ROUTE_MAP) {
                for (const val in ROUTE_MAP[cat]) {
                    const routePath = ROUTE_MAP[cat][val].toLowerCase();
                    
                    // 检查当前 URL 是否包含我们定义的路径片段
                    // 使用 endsWith 可以避免前缀干扰，但要确保路径精确
                    if (path.endsWith(routePath) || path === routePath) {
                        const select = document.getElementById(`sel-${cat}`);
                        if (select) {
                            resetDropdowns(); // 互斥逻辑：先清空其他
                            select.value = val; // 选中当前
                            matchFound = true;
                        }
                    }
                }
                if (matchFound) break; // 找到一个匹配项就停止
            }
        }

        function resetDropdowns() {
            ['sel-power', 'sel-cool', 'sel-gas', 'sel-deploy', 'sel-origin'].forEach(id => {
                const el = document.getElementById(id);
                if(el) el.value = 'all';
            });
        }

        // 3. 用户切换筛选时，修改 URL (不刷新页面)
        function onFilterChange(category) {
            const val = document.getElementById(`sel-${category}`).value;
            
            // 默认回退路径
            let newUrl = '/index.html'; // 或者 '/'
            
            // 如果是在线上环境，通常是 '/'
            if (window.location.hostname !== 'localhost' && !window.location.href.includes('.html')) {
                newUrl = '/';
            }

            if (val !== 'all' && ROUTE_MAP[category] && ROUTE_MAP[category][val]) {
                // 获取目标路径，例如 /products/power-range/500-1000kw
                newUrl = ROUTE_MAP[category][val];
                // 确保末尾有斜杠（如果你的需求严格要求斜杠）
                if (!newUrl.endsWith('/')) newUrl += '/';
            }

            // 使用 History API 修改地址栏，不触发页面刷新
            window.history.pushState({ path: newUrl }, '', newUrl);
            
            // 应用筛选逻辑
            applyFilters();
        }

        function applyFilters() {
            const fPower = document.getElementById('sel-power').value;
            const fCool = document.getElementById('sel-cool').value;
            const fGas = document.getElementById('sel-gas').value;
            const fDeploy = document.getElementById('sel-deploy').value;
            const fOrigin = document.getElementById('sel-origin').value;
            const fKeyword = document.getElementById('inp-search').value.trim().toLowerCase();
            
            const filtered = allData.filter(item => {
                const check = (dbVal, filterVal) => {
                    if (filterVal === 'all') return true;
                    if (!dbVal) return false;
                    const v1 = String(dbVal).toLowerCase().replace(/\s/g, '');
                    const v2 = String(filterVal).toLowerCase().replace(/\s/g, '');
                    return v1.includes(v2);
                };
                return check(item.power_classification, fPower) &&
                       check(item.cooling_method, fCool) &&
                       check(item.gas_source_type, fGas) &&
                       check(item.deployment_type, fDeploy) &&
                       check(item.brand_origin, fOrigin) &&
                       (!fKeyword || Object.values(item).some(v => String(v).toLowerCase().includes(fKeyword)));
            });
            renderData(filtered);
            
            // 状态栏显示当前“假”链接，用于确认
            const urlText = document.getElementById('url-text');
            if(urlText) {
                urlText.innerText = `Path: ${window.location.pathname}`;
            }
        }

        function renderData(items) {
            const container = document.getElementById('data-container');
            const lang = window.app.lang;
            const dict = I18N_DATA[lang] || I18N_DATA['en'];

            const countEl = document.getElementById('count-text');
            if(countEl) countEl.innerText = dict['status_found'].replace('{n}', items.length);
            
            container.innerHTML = '';
            if (items.length === 0) {
                container.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:50px; color:#666">
                    ${dict['status_no_match']}<br><small>${dict['status_retry']}</small>
                </div>`;
                return;
            }

            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'card';
                div.onclick = () => openModal(item);
                
                const gasText = translateText('gas_source_type', item.gas_source_type, lang);
                const deployText = translateText('deployment_type', item.deployment_type, lang);
                const originText = translateText('brand_origin', item.brand_origin, lang);
                const displayBrand = translateText('brand', item.brand, lang);
                const displayModel = translateText('model', item.model, lang);

                div.innerHTML = `
                    <div class="card-brand">${displayBrand || dict['card_unknown_brand']}</div>
                    <h3 class="card-title">${displayModel || dict['card_unknown_model']}</h3>
                    <div class="specs">
                        <div><span>${dict['label_power']}</span><b>${item.rated_power_kw || '-'} kW</b></div>
                        <div><span>${dict['label_efficiency']}</span><b>${item.power_generation_efficiency_pct || '-'}%</b></div>
                    </div>
                    <div class="tags">
                        <span class="tag green">${gasText}</span>
                        <span class="tag blue">${deployText}</span>
                        <span class="tag">${originText}</span>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function openModal(item) {
            window.currentModalItem = item;
            const modal = document.getElementById('modal-overlay');
            const tbody = document.getElementById('modal-body');
            const lang = window.app.lang;
            const dict = I18N_DATA[lang] || I18N_DATA['en'];

            const titleBrand = translateText('brand', item.brand, lang);
            const titleModel = translateText('model', item.model, lang);
            
            const mTitle = document.getElementById('modal-title');
            if(mTitle) mTitle.innerText = `${titleBrand} ${titleModel}`;
            
            tbody.innerHTML = '';

            const FIELD_KEYS = {
                'brand': 'label_brand', 'model': 'label_model', 'series': 'label_series',
                'rated_power_kw': 'label_power', 'power_generation_efficiency_pct': 'label_efficiency',
                'gas_source_type': 'label_gas', 'application_scenario': 'label_scenario',
                'cooling_method': 'label_cool', 'deployment_type': 'label_deploy',
                'dimensions_lwh_mm': 'label_dims', 'weight_kg': 'label_weight',
                'cylinder_configuration': 'label_cylinders', 'brand_origin': 'label_origin'
            };

            Object.keys(item).forEach(key => {
                if(key === 'id' || key === 'contentFetchId' || !FIELD_KEYS[key]) return;
                
                const label = dict[FIELD_KEYS[key]] || key;
                let rawValue = item[key];
                const displayValue = translateText(key, rawValue, lang);

                const tr = document.createElement('tr');
                tr.innerHTML = `<td><span>${label}</span></td><td><b style="color:#eee">${displayValue}</b></td>`;
                tbody.appendChild(tr);
            });
            modal.style.display = 'flex';
        }

        function closeModal(e) { 
            if(e.target.id === 'modal-overlay' || e.target.classList.contains('close-btn')) {
                document.getElementById('modal-overlay').style.display = 'none';
                window.currentModalItem = null;
            }
        }

        function resetAll() {
            // 重置到首页 Path
            const homePath = '/';
            window.history.pushState({ path: homePath }, '', homePath);
            
            resetDropdowns();
            document.getElementById('inp-search').value = '';
            window.app.setLanguage(window.app.lang); 
            applyFilters();
        }

        // 监听浏览器的“后退/前进”按钮
        window.addEventListener('popstate', () => { 
            restoreFromURL(); 
            applyFilters(); 
        });

        document.addEventListener('DOMContentLoaded', () => window.app.init());
    </script>

        const firebaseConfig = {
            apiKey: "AIzaSyBUEXdeSB7Ue0gkwcXN3j76ymyCbngxufY",
            authDomain: "gasgxmining.firebaseapp.com",
            projectId: "gasgxmining",
            storageBucket: "gasgxmining.firebasestorage.app",
            messagingSenderId: "465579060005",
            appId: "1:465579060005:web:ee20cb21ed58020c4a88cc",
            measurementId: "G-ZHNSQ29181"
        };
        
        const fbApp = initializeApp(firebaseConfig);
        const auth = getAuth(fbApp);

            signIn: () => signInWithPopup(auth, provider),

        onAuthStateChanged(auth, (user) => {

            if (user) {
                loginBtns.forEach(b => b && b.classList.add('hidden'));
                profiles.forEach(p => p && p.classList.remove('hidden'));
                if(profiles[0]) profiles[0].style.display = 'flex'; 
                document.getElementById('auth-user-avatar').src = user.photoURL;
                document.getElementById('mob-auth-user-avatar').src = user.photoURL;
                document.getElementById('dropdown-username').innerText = user.displayName;
                document.getElementById('mob-auth-username').innerText = user.displayName;

                loginBtns.forEach(b => b && b.classList.remove('hidden'));
                profiles.forEach(p => p && p.classList.add('hidden'));
            }
        });
    </script>
