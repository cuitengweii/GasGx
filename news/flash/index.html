<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7x24 Flash News - GasGx Mining</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="/shared/ui/site-shell.config.js?v=20260321authux03"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gas: { bg: '#050505', card: '#0F0F0F', border: '#1F1F1F', green: '#5DD62C', accent: '#FFFFFF', subtext: '#888888' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                        header: ['Oswald', 'sans-serif']
                    },
                    boxShadow: {
                        neon: '0 0 15px rgba(93, 214, 44, 0.3)',
                        'neon-strong': '0 0 30px rgba(93, 214, 44, 0.6)'
                    },
                    animation: { marquee: 'marquee 50s linear infinite' },
                    keyframes: {
                        marquee: {
                            '0%': { transform: 'translateX(0%)' },
                            '100%': { transform: 'translateX(-50%)' }
                        }
                    }
                }
            }
        };
    </script>

    <link rel="stylesheet" href="../shared/modules/styles/layout.shared.css">
    <link rel="stylesheet" href="./modules/styles/header.module.css">
    <link rel="stylesheet" href="./modules/styles/main.module.css">
    <link rel="stylesheet" href="./modules/styles/footer.module.css">
</head>
<body class="gxf-flash-page">
    <style>
        #gxf-startup-mask {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            background: #050505;
            color: #cfcfcf;
            font-family: Inter, sans-serif;
            transition: opacity 220ms ease;
        }
        #gxf-startup-mask .gxf-row {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #gxf-startup-mask.gxf-hidden {
            opacity: 0;
            pointer-events: none;
        }
        #gxf-startup-mask .gxf-spinner {
            width: 34px;
            height: 34px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-top-color: #5DD62C;
            border-radius: 999px;
            animation: gxf-spin 0.9s linear infinite;
            margin-right: 12px;
        }
        @keyframes gxf-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        #gxf-startup-retry {
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: #111111;
            color: #ffffff;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            cursor: pointer;
        }
        #gxf-startup-retry:hover {
            border-color: #5DD62C;
            color: #5DD62C;
        }
        #gxf-startup-mask.gxf-timeout #gxf-startup-retry {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
    </style>
    <div id="gxf-startup-mask" role="status" aria-live="polite" aria-label="Loading flash news">
        <div class="gxf-row">
            <span class="gxf-spinner" aria-hidden="true"></span>
            <span id="gxf-startup-text">Loading Flash News...</span>
        </div>
        <button id="gxf-startup-retry" type="button">Retry</button>
    </div>
    <div id="gxf-header-slot"></div>
    <div id="gxf-main-slot" class="flex-grow w-full overflow-x-hidden"></div>
    <div id="gxf-footer-slot"></div>

<script type="module" src="./modules/flash.bootstrap.js?v=20260511flashfix01"></script>
</body>
</html>
