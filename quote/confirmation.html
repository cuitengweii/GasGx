<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GasGx Stage Confirmation</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="../shared/ui/site-shell.config.js?v=20260321auth02"></script>
    <script src="../shared/ui/main-auth.shared.js?v=20260322authshared01"></script>
    <script src="./public-asset-version.js?v=20260327public25"></script>
    <script>window.AMSLoadQuotePublicStyles('../shared/quote-system/quote-system.css');</script>
</head>
<body class="antialiased pb-12 access-resolved">
    <main id="stage-confirmation-app" class="requirement-shell">
        <section class="requirement-card requirement-loading">
            <div class="requirement-loading__spinner"><i class="fa-solid fa-circle-notch fa-spin"></i></div>
            <div class="requirement-loading__title">正在读取客户确认页...</div>
            <div class="requirement-loading__desc">请稍候，系统正在校验链接并加载当前阶段数据。</div>
        </section>
    </main>

    <script>
        (function redirectConfirmationToAccountSales() {
            const params = new URL(window.location.href).searchParams;
            const mode = String(params.get('mode') || '').trim().toLowerCase();
            const stageSlug = String(params.get('stage') || params.get('confirm_stage') || '').trim();
            const stageToken = String(params.get('token') || params.get('confirm_token') || '').trim();
            if (mode === 'readonly' || !stageSlug || !stageToken) {
                window.AMSLoadQuotePublicModule('../shared/quote-system/quote-confirmation.module.js');
                return;
            }

            const helper = window.GasGxMainAuthShared;
            if (!helper?.createClient || !window.supabase) {
                window.AMSLoadQuotePublicModule('../shared/quote-system/quote-confirmation.module.js');
                return;
            }

            const runtime = helper.resolveConfig(window.GASGX_SITE_SHELL_CONFIG?.site?.mainAuth);
            const accountUrl = new URL(runtime.accountUrl || '/account/account.html', window.location.origin);
            accountUrl.searchParams.set('tab', 'sales');
            accountUrl.searchParams.set('confirm_stage', stageSlug);
            accountUrl.searchParams.set('confirm_token', stageToken);

            const targetPath = `${accountUrl.pathname}${accountUrl.search}`;
            const redirectToAccount = () => {
                try {
                    window.sessionStorage.setItem(runtime.returnUrlStorageKey || 'gx_main_return_url', targetPath);
                } catch (_error) {
                    // Ignore storage errors and continue redirect.
                }
                window.location.replace(targetPath);
            };

            const client = helper.createClient(window.supabase, runtime);
            client.auth.getSession()
                .then(({ data, error }) => {
                    if (error || !data?.session?.user) {
                        redirectToAccount();
                        return;
                    }
                    redirectToAccount();
                })
                .catch(() => redirectToAccount());
        })();
    </script>
</body>
</html>
