<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GasGx Quote Editor</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="./public-asset-version.js?v=20260329public92"></script>
    <script>window.AMSLoadQuotePublicStyles('../shared/quote-system/quote-system.css');</script>
</head>
<body class="antialiased pb-10 md:pb-20 access-resolved quote-editor-mode">
    <div id="toolbar" class="fixed top-0 left-0 right-0 z-50 px-3 md:px-8 py-3 md:py-4 flex justify-between items-center border-b backdrop-blur-md" style="background-color: rgba(10, 14, 20, 0.85); border-color: var(--border-color);">
        <div class="toolbar-brand flex items-center space-x-2 md:space-x-4">
            <div id="toolbar-brand-name" class="text-[var(--gas-green-light)] text-xl md:text-3xl font-black tracking-tight flex whitespace-nowrap items-center flex-shrink-0">
                <span>GasGx Quotation System</span>
            </div>
        </div>

        <div class="toolbar-actions flex items-center space-x-2 md:space-x-4 text-xs md:text-sm">
            <div class="toolbar-lang flex bg-[#161B22] rounded p-1 border border-[#2C2F33]">
                <button type="button" id="btn-zh" class="px-2 md:px-4 py-1 md:py-1.5 rounded transition-all">ZH</button>
                <button type="button" id="btn-en" class="px-2 md:px-4 py-1 md:py-1.5 rounded transition-all">EN</button>
                <button type="button" id="btn-ru" class="px-2 md:px-4 py-1 md:py-1.5 rounded transition-all">RU</button>
            </div>
            <a id="btn-back-admin" class="btn-outline px-3 py-1.5 md:px-4 md:py-2 inline-flex items-center gap-2" href="/article_management/index.html?page=quote-products">
                <i class="fa-solid fa-arrow-left"></i>
                <span>返回后台</span>
            </a>
        </div>
    </div>

    <div class="quote-editor-bar">
        <div class="quote-editor-bar__meta">
            <span class="quote-editor-bar__kicker">REAL TEMPLATE EDITOR</span>
            <strong id="editor-status-title">真实报价页编辑</strong>
            <span id="editor-status-text">正在加载...</span>
            <span id="editor-version-text" class="text-[11px] md:text-xs text-[var(--gas-green-light)] font-mono-num"></span>
        </div>
        <div id="editor-settings-fields" class="quote-editor-settings__body quote-editor-bar__settings"></div>
        <div class="quote-editor-bar__actions">
            <div class="quote-editor-primary-actions">
                <div id="instance-toolbar-actions" class="contents" hidden>
                    <button id="btn-preview-instance" type="button" class="quote-editor-primary-btn quote-editor-preview-btn px-4 py-2.5">预览客户页</button>
                </div>
                <button id="btn-save-editor" type="button" class="quote-editor-primary-btn quote-editor-save-btn px-5 py-2.5">保存草稿</button>
                <button id="btn-publish-instance" type="button" hidden class="quote-editor-primary-btn quote-editor-publish-btn px-5 py-2.5">发布报价</button>
            </div>
            <div class="quote-editor-secondary-actions">
                <button id="btn-add-main-row" type="button" class="btn-outline px-3 py-2">主配置新增行</button>
                <button id="btn-add-service-row" type="button" class="btn-outline px-3 py-2">服务包新增行</button>
                <button id="btn-add-optional-row" type="button" class="btn-outline px-3 py-2">选配新增行</button>
            </div>
        </div>
    </div>

    <div id="doc-container" class="max-w-7xl mx-auto mt-32 md:mt-36 p-4 md:p-12 rounded-lg relative shadow-[0_20px_50px_rgba(0,0,0,0.7)]" style="background-color: var(--bg-card); border: 1px solid var(--border-color);">
        <div class="quote-view-banner" id="editor-banner">
            <div class="quote-view-banner__kicker">TEMPLATE SOURCE</div>
            <div class="quote-view-banner__title" id="editor-banner-title">你现在编辑的就是最终报价页本体。</div>
            <div class="quote-view-banner__meta" id="editor-banner-meta"></div>
        </div>

        <div id="export-area" style="background-color: var(--bg-card);">
            <div class="quote-head-shell border-b border-[var(--border-color)] pb-6 md:pb-8 mb-8 md:mb-10 flex flex-col xl:flex-row justify-between items-start gap-6">
                <div class="quote-head-main w-full xl:flex-1 xl:pr-8 overflow-hidden">
                    <div class="doc-title-row flex items-start md:items-center gap-4 mb-4 md:mb-8 w-full">
                        <h1 class="text-xl md:text-3xl font-bold tracking-wide text-[var(--gas-green-light)] leading-snug break-words flex-1 m-0">
                            <span id="edit-overview-title" class="quote-editable" contenteditable="true"></span>
                        </h1>
                    </div>

                    <div class="doc-meta-grid grid grid-cols-1 md:grid-cols-2 gap-x-8 md:gap-x-12 gap-y-4 md:gap-y-5 text-sm md:text-[15px]">
                        <div class="doc-meta-item flex items-center border-b border-[var(--border-color)] pb-2 overflow-hidden">
                            <span id="edit-validity-label" class="min-w-max pr-3 text-[var(--text-body)] flex-shrink-0 whitespace-nowrap quote-editable" contenteditable="true"></span>
                            <div class="doc-meta-value flex-1 w-0 overflow-x-auto no-scrollbar flex items-center">
                                <span id="edit-validity-value" class="font-semibold text-white font-mono-num whitespace-nowrap outline-none w-full text-left block"></span>
                            </div>
                        </div>
                        <div class="doc-meta-item flex items-center border-b border-[var(--border-color)] pb-2 overflow-hidden">
                            <span id="edit-receiver-label" class="min-w-max pr-3 text-[var(--text-body)] flex-shrink-0 whitespace-nowrap quote-editable" contenteditable="true"></span>
                            <div class="doc-meta-value flex-1 w-0 overflow-x-auto no-scrollbar flex items-center">
                                <span id="edit-receiver-value" class="text-[var(--gas-green-light)] empty-placeholder whitespace-nowrap outline-none w-full text-left block quote-editable" contenteditable="true"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="quote-head-side w-full xl:w-auto text-left xl:text-right flex-shrink-0 flex flex-col items-start xl:items-end">
                    <div class="mt-4 text-xs md:text-sm font-mono-num text-[var(--gas-green-light)] bg-[var(--gas-green-bg)] px-3 py-2 rounded border border-[var(--gas-green-primary)] break-all" id="live-rates-display"></div>
                    <div id="rate-status-detail" class="hidden mt-2 text-[11px] md:text-xs font-mono-num text-[var(--text-muted)] text-left xl:text-right w-full"></div>

                    <div class="mt-3 flex flex-wrap items-center justify-start xl:justify-end gap-2 w-full">
                        <span id="rate-status" class="text-[10px] md:text-[11px] text-[var(--gas-green-light)] font-mono-num flex items-center bg-[var(--gas-green-bg-solid)] px-2 py-1.5 rounded border border-[var(--gas-green-primary)] shadow-[0_0_8px_rgba(93,214,44,0.2)]">
                            <i class="fa-solid fa-pen-ruler text-[var(--gas-green-light)] mr-1.5"></i> 当前为真实报价页编辑模式
                        </span>
                        <button id="btn-refresh-rates" type="button" class="btn-outline bg-[var(--bg-card)] px-3 py-1.5 rounded text-[10px] md:text-[11px] font-bold flex items-center">
                            <i class="fa-solid fa-rotate-right mr-1.5"></i>
                            <span id="btn-text-refresh" class="quote-editable" contenteditable="true"></span>
                        </button>
                    </div>
                </div>
            </div>

            <div id="content-area"></div>
            <div id="footer-note" class="mt-12 md:mt-16 pt-6 md:pt-8 border-t border-[var(--border-color)] text-center text-xs md:text-sm text-[var(--text-muted)] leading-relaxed px-2 quote-editable" contenteditable="true"></div>
        </div>
    </div>

    <button id="back-to-top" type="button" class="back-to-top z-40" aria-label="返回顶部" title="返回顶部">
        <i class="fa-solid fa-arrow-up text-sm"></i>
    </button>

    <script>window.AMSLoadQuotePublicModule('../shared/quote-system/quote-editor.module.js');</script>
</body>
</html>
